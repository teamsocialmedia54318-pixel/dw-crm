// ------- مسار العميل وسجله الموحد -------
function journeyHtml(c) {
  const all = stagesFor(c);
  const cur = stageById(c.stageId);
  const line = all.filter(s => s.type !== 'lost' || s.id === c.stageId);
  const curIdx = line.findIndex(s => s.id === c.stageId);
  const lastVisit = id => [...(c.stageHistory || [])].reverse().find(h => h.stageId === id);
  const divider = line.findIndex(s => s.group === 'aftersales');
  return `<div class="journey" role="list">${line.map((s, i) => {
    const h = lastVisit(s.id);
    const state = s.id === c.stageId ? 'cur' : (cur?.type !== 'lost' && i < curIdx) || (cur?.type === 'lost' && h) ? 'done' : '';
    return `${i === divider && divider > 0 ? `<div class="j-sep" aria-hidden="true"><span>${t('ما بعد البيع')}</span></div>` : ''}<div class="j-step ${state} ${s.type}" role="listitem"><span class="j-dot">${state === 'done' ? '✓' : i + 1}</span><b>${esc(label(s))}</b>${h ? `<small>${fmtDate(h.at)}<br>${esc(userName(h.userId))}</small>` : '<small>&nbsp;</small>'}</div>`;
  }).join('')}</div>`;
}
// علاقة كاتب المتابعة بالعميل، ليظهر لرجل البيع ما قام به زميله المساعد
function relationTag(c, userId) {
  if (userId === c.ownerId) return `<span class="pill p-blue">${t('المسؤول')}</span>`;
  const u = userById(userId);
  if ((c.assistantIds || []).includes(userId)) return `<span class="pill p-after">🔗 ${t('متابع مشترك')}</span>`;
  if ((u?.assists || []).includes(c.ownerId)) return `<span class="pill p-after">${t('زميل مساعد')}</span>`;
  return `<span class="pill p-gray">${esc(roleName(u))}</span>`;
}
function customerTimeline(c) {
  const ev = [];
  followupsOf(c.id).forEach(f => ev.push({ at: f.at, fid: f.id, ic: f.viaVoice ? '🎙' : '📞', title: `${t(f.phase === 'after' ? 'متابعة ما بعد البيع' : 'متابعة')} · ${tv(f.outcome || '')}`, text: f.text, user: f.userId, extra: f.nextDate ? t('المتابعة التالية: {d}', { d: fmtDate(f.nextDate) }) : '', stage: stageById(f.stageId) }));
  (c.stageHistory || []).forEach((h, i) => { if (i) ev.push({ at: h.at, ic: '➜', title: t('الانتقال إلى مرحلة: {s}', { s: label(stageById(h.stageId)) }), text: h.note, user: h.userId }); });
  DB.orders.filter(o => o.customerId === c.id).forEach(o => ev.push({ at: o.createdAt, ic: '🧾', title: t('طلب {no}', { no: o.no }), text: `${money(o.total)} ${curLabel(o)} · ${t(PAY_TYPES[o.payType])} · ${t(ORDER_STATUS[o.status])}`, user: o.repId }));
  afterSalesOf(c.id).filter(a => a.status === 'done').forEach(a => ev.push({ at: a.doneAt, ic: '🤝', title: `${t('ما بعد البيع')} · ${tv(a.name)}`, text: a.feedback, user: a.doneBy, html: stars(a.satisfaction) }));
  DB.tickets.filter(tk => tk.customerId === c.id).forEach(tk => {
    ev.push({ at: tk.createdAt, ic: '🛠', title: t('طلب دعم فني {no}', { no: tk.no }), text: tk.desc, user: tk.createdBy });
    tk.updates.forEach(u => ev.push({ at: u.at, ic: '🛠', title: `${tk.no} · ${t(TICKET_STATUS[u.status])}`, text: u.text, user: u.userId }));
  });
  ev.sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!ev.length) return `<div class="card empty">${t('لم تُسجَّل أي متابعة بعد')}</div>`;
  return `<ul class="timeline card">${ev.map(e => `<li><div class="when"><span aria-hidden="true">${e.ic}</span> ${fmtDT(e.at)} · <b>${esc(userName(e.user))}</b> ${relationTag(c, e.user)}${e.stage ? ` · ${esc(label(e.stage))}` : ''}</div><div class="tl-title">${esc(e.title)} ${e.html || ''}${e.fid && (e.user === ME.id || can('customers.edit')) ? ` <button class="btn sm" data-efu="${e.fid}" aria-label="${t('تعديل')}">✎</button>` : ''}</div>${e.text ? `<div>${esc(e.text)}</div>` : ''}${e.extra ? `<div class="when">${esc(e.extra)}</div>` : ''}</li>`).join('')}</ul>`;
}
function openStageForm(c, onDone) {

    body: `<div class="field"><label>${t('المرحلة الجديدة')}</label><select class="inp" id="ns">${opts(stagesFor(c).map(s => [s.id, label(s)]), c.stageId)}</select></div><div class="field"><label>${t('ملاحظة')}</label><textarea class="inp" id="nn" placeholder="${t('اختياري')}"></textarea></div>`,

    Object.assign(patch, readDevice(m.el));
    const shareTo = $('#asst', m.el) ? $$('#asst .chip.on', m.el).map(b => b.dataset.u) : null;
    if (!patch.name || !patch.phone1) { toast(t('الاسم ورقم الهاتف 1 مطلوبان'), 'err'); return; }
    if (mapError(patch.mapLink)) { toast(mapError(patch.mapLink), 'err'); return; }
    const miss = missingRequired(m.el, c.domainId, patch.custom);
    if (miss.length) { toast(t('يرجى إدخال: {f}', { f: label(miss[0]) }), 'err'); return; }
    const dup = findDuplicate([patch.phone1, patch.phone2], c.id);
    if (dup) { toast(t('هذا الرقم مسجل باسم "{name}" لدى {owner}', { name: dup.name, owner: userName(dup.ownerId) }), 'err'); return; }
    patch.viaDistributorId = viaId(via, patch.source);
    let changed = updateCustomer(c.id, patch);
    const partner = syncPartner(c);
    if (partner?.fresh) toast(t('أُضيف {name} إلى قائمة الموزعين بتصنيف {type}', { name: c.name, type: tv(c.category) }), 'ok');
    if (shareTo) {
      const removed = (c.assistantIds || []).filter(id => !shareTo.includes(id));
      removed.forEach(id => unshareCustomer(c, id));
      if (shareCustomers([c.id], shareTo) || removed.length) changed = true;
    }
    m.close();
    toast(t(changed ? 'تم الحفظ وتسجيل التعديل' : 'لا يوجد تغيير'), changed ? 'ok' : '');
    onDone && onDone();
    route();
  };
}

// ------- رفع ملف إكسيل -------
function openImport() {
  const m = openModal({
    title: t('رفع ملف عملاء'), wide: true,
    body: `<p class="muted" style="margin-top:0">${t('يقرأ النظام الأعمدة بأسمائها ويقسم العملاء تلقائيًا: عملاء مصر حسب المحافظة والكود، وعملاء الخارج حسب الدولة من عمود الدولة أو من مفتاح رقم الهاتف. ولا تُضاف الأرقام المكررة.')}</p>
      ${can('customers.assign') ? `<div class="field"><label>${t('رجل البيع الذي سيستلم العملاء')}</label><select class="inp" id="impRep">${repOptions(sellers()[0]?.id, '')}</select></div>` : ''}
      <div class="field"><label>${t('الملف (xlsx أو csv)')}</label><input class="inp" type="file" id="impFile" accept=".xlsx,.csv,.xls"></div>
      <button class="btn sm" id="tmpl">⬇ ${t('تنزيل نموذج الملف')}</button><div id="impRes" class="mt"></div>`,
    footer: `<button class="btn primary" id="impGo" disabled>${t('إضافة العملاء')}</button>`,
  });
  let result = null;
  const extra = activeFields().map(() => '');
  $('#tmpl', m.el).onclick = () => downloadBlob(buildXlsx([{ name: t('العملاء'), rows: [IMPORT_TEMPLATE(), [t('محمد علي (مثال)'), '01000000000', '', tv('مزارع'), tv('مصر'), tv('البحيرة (الصحراوي)'), '1/A14', t('بجوار الجمعية'), 25, tv('تنقيط'), tv('الموالح'), '2500 ppm', tv('بئر'), tv(DEVICE_MODELS[3]), tv('3 بوصة'), tv('فيسبوك'), tv('جيد جدًا'), fmtDate(today()), fmtDate(addDays(today(), 3)), t('مقدم'), 10000, fmtDate(addDays(today(), 30)), ...extra], ['Ali Hassan', '+966500000000', '', tv('مهندس زراعي'), '', '', '', 'Riyadh', 100, tv('محوري'), tv('نخيل البلح'), '', tv('بئر'), '', '', tv('معرض'), tv('مميز'), '', '', '', '', '', ...extra]] }]), `${t('نموذج ملف العملاء')}.xlsx`);
  $('#impFile', m.el).onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    const box = $('#impRes', m.el);
    box.innerHTML = `<span class="muted">${t('جارٍ قراءة الملف...')}</span>`;
    $('#impGo', m.el).disabled = true;
    try {
      const sheets = await readSpreadsheet(file);
      const owner = can('customers.assign') ? $('#impRep', m.el).value : ME.id;
      const sheet = sheets.find(s => analyzeImport(s.rows, owner).items?.length) || sheets[0];
      result = analyzeImport(sheet.rows, owner);
      if (result.error) { box.innerHTML = `<div class="err-msg">${esc(t(result.error))}</div>`; return; }
      const ul = obj => Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="pill p-gray">${esc(k)}: ${v}</span>`).join(' ') || '<span class="muted">—</span>';
      box.innerHTML = `<div class="kpis"><div class="kpi ok"><div class="l">${t('جاهز للإضافة')}</div><div class="v">${result.items.length}</div></div><div class="kpi warn"><div class="l">${t('مكرر (لن يُضاف)')}</div><div class="v">${result.duplicates.length}</div></div><div class="kpi alert"><div class="l">${t('صفوف ناقصة')}</div><div class="v">${result.errors.length}</div></div></div>
        <div class="field"><label>${t('عملاء مصر حسب المحافظة')}</label><div class="chips">${ul(result.egypt)}</div></div>
        <div class="field"><label>${t('عملاء الخارج حسب الدولة')}</label><div class="chips">${ul(result.intl)}</div></div>
        ${result.unknownGov ? `<div class="demo-banner">${t('تعذر تحديد المحافظة لعدد {n} من عملاء مصر، وسيُضافون باسم "غير محدد" ويمكن تعديلهم لاحقًا.', { n: result.unknownGov })}</div>` : ''}
        ${result.duplicates.length || result.errors.length ? `<details class="tv" open><summary>${t('تفاصيل الصفوف المستبعدة')}</summary><table><tr><th>${t('الصف')}</th><th>${t('الاسم')}</th><th>${t('السبب')}</th></tr>${[...result.duplicates.map(x => [x.line, x.name, t('رقم مكرر ({o})', { o: x.owner })]), ...result.errors.map(x => [x.line, x.name, t(x.why)])].slice(0, 30).map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</table></details>` : ''}`;
      $('#impGo', m.el).disabled = !result.items.length;
    } catch (err) {
      box.innerHTML = `<div class="err-msg">${esc(err.message)}</div>`;
    }
  };
  $('#impGo', m.el).onclick = () => {
    result.items.forEach(it => syncPartner(createCustomer(it, { silent: true })));
    audit('import', 'customer', null, 'رفع ملف عملاء: {a} جديد، {b} مكرر، {c} ناقص', { a: result.items.length, b: result.duplicates.length, c: result.errors.length });
    toast(t('أُضيف العملاء وقُسِّموا تلقائيًا: {n}', { n: result.items.length }), 'ok');
    m.close();
    route();
  };
}

</script>
<script>
// العمل اليومي: لوحة اليوم، المتابعة الصوتية، المواسم، التقويم والبريد اليومي
const PENDING_CALL = 'dw_crm_pending_call';
const pendingCall = () => { try { return JSON.parse(localStorage.getItem(PENDING_CALL) || 'null'); } catch { return null; } };

// بدء الاتصال يفتح متابعة يلزم تسجيلها قبل أي عمل آخر، حتى لا تمر مكالمة دون توثيق
function startCall(customerId) {
  const c = custById(customerId);
  localStorage.setItem(PENDING_CALL, JSON.stringify({ customerId, at: nowStamp(), userId: ME.id }));
  audit('call', 'customer', customerId, 'بدء مكالمة: {name}', { name: c.name });
  const a = document.createElement('a');
  a.href = `tel:${String(c.phone1).replace(/\s/g, '')}`;
  // داخل إطار رابط جوجل لا يفتح الاتصال إلا في نافذة مستقلة
  if (window.top !== window) a.target = '_blank';
  a.click();
  openFollowup(customerId, { locked: true, onDone: () => route() });
}
function resumePendingCall() {
  const p = pendingCall();
  if (p && p.userId === ME.id && custById(p.customerId) && !$('.fu-modal')) openFollowup(p.customerId, { locked: true, onDone: () => route() });
}

function openFollowup(customerId, { locked, onDone, phase } = {}) {
  const c = custById(customerId);
  let outcome = 'تم الرد', viaVoice = false;
  const m = openModal({
    title: t(phase === 'after' ? 'متابعة ما بعد البيع: {name}' : 'متابعة: {name}', { name: esc(c.name) }), locked,
    body: `<div class="fu-modal"></div>
      ${locked ? `<div class="demo-banner">${t('المكالمة جارية على الرقم')} <b class="num">${esc(showPhone(c.phone1))}</b>. ${t('سجّل المتابعة فور انتهائها، ولن تُغلق هذه الشاشة قبل التسجيل.')}</div>` : ''}
      <div class="field"><label>${t('نتيجة المكالمة')}</label><div class="chips" id="oc">${OUTCOMES.map(o => `<button type="button" class="chip ${o === outcome ? 'on' : ''}" data-o="${o}">${tv(o)}</button>`).join('')}</div></div>
      <div class="mic-box"><button type="button" class="mic" id="mic" aria-label="${t('تسجيل صوتي')}">🎙</button><div class="mic-status" id="ms"></div></div>
      <div class="field"><label>${t('نص المتابعة')}</label><textarea class="inp" id="txt" rows="4" placeholder="${t('يظهر الكلام هنا ويمكن تعديله')}"></textarea></div>
      <div class="field"><label>${t('المتابعة التالية')} <span class="req">*</span></label><div class="chips" id="quick">${[['غدًا', 1], ['بعد 3 أيام', 3], ['بعد أسبوع', 7], ['بعد شهر', 30]].map(([l, n]) => `<button type="button" class="chip" data-n="${n}">${t(l)}</button>`).join('')}<button type="button" class="chip" data-n="">${t('لا توجد متابعة (إغلاق)')}</button></div>
        <input class="inp mt" type="date" id="next" min="${today()}" value="${addDays(today(), 3)}"></div>
      <div class="grid2"><div class="field"><label>${t('مرحلة العميل')}</label><select class="inp" id="stg" ${can('stages.move') ? '' : 'disabled'}>${opts(stagesFor(c).map(s => [s.id, label(s)]), c.stageId)}</select></div>
      <div class="field"><label>${t('تحديث تقييم العميل')}</label><select class="inp" id="rate">${optsT(RATINGS, c.rating)}</select></div></div>`,
    footer: `<button class="btn primary" id="save">${t('حفظ المتابعة')}</button>`,
  });
  const txt = $('#txt', m.el), next = $('#next', m.el);
  const stopMic = bindMic(m.el, { mic: '#mic', status: '#ms', input: '#txt', onVoice: () => { viaVoice = true; } });
  $$('#oc .chip', m.el).forEach(b => b.onclick = () => {
    outcome = b.dataset.o;
    $$('#oc .chip', m.el).forEach(x => x.classList.toggle('on', x === b));
    if (['لم يرد', 'مشغول', 'غير متاح / مغلق', 'خارج الخدمة'].includes(outcome)) next.value = addDays(today(), 1);
    if (['رقم خطأ', 'غير مهتم'].includes(outcome)) next.value = '';
  });
  $$('#quick .chip', m.el).forEach(b => b.onclick = () => { next.value = b.dataset.n ? addDays(today(), +b.dataset.n) : ''; });
  $('#save', m.el).onclick = () => {
    stopMic();
    const text = txt.value.trim();
    if (outcome === 'تم الرد' && !text) { toast(t('سجّل المتابعة صوتيًا أو اكتب ملخص المكالمة'), 'err'); return; }
    if (!next.value && !['رقم خطأ', 'غير مهتم', 'تم البيع'].includes(outcome) && !confirm(t('هل تريد إغلاق العميل دون متابعة قادمة؟'))) return;
    const stageSel = $('#stg', m.el).value;
    addFollowup(customerId, { text: text || tv(outcome), outcome, nextDate: next.value, viaVoice, rating: $('#rate', m.el).value, stageId: can('stages.move') && stageSel !== c.stageId ? stageSel : '', phase });
    localStorage.removeItem(PENDING_CALL);
    m.close();
    toast(t('تم تسجيل المتابعة'), 'ok');
    onDone && onDone();
  };
}

// على الموبايل يظهر كل صف كبطاقة، وعنوان كل خانة من data-label
const callRow = c => `<tr class="click" data-id="${c.id}"><td class="sticky-col card-title" data-label="">${esc(c.name)}</td><td data-label="${t('الهاتف')}">${phoneLink(c.phone1)}</td><td data-label="${t('الموقع')}">${esc(custLocation(c))}</td><td data-label="${t('المحصول')}">${esc(c.crops.map(tv).join(LANG === 'en' ? ', ' : '، '))}</td><td data-label="${t('التقييم')}">${ratingPill(c.rating)}</td><td data-label="${t('المرحلة')}">${stagePill(c)}</td><td data-label="${t('المتابعة')}">${followPill(c.followupDate)}</td>${can('customers.view_all') ? `<td data-label="${t('رجل البيع')}">${esc(userName(c.ownerId))}</td>` : ''}<td class="wrap card-wide" data-label="${t('آخر متابعة')}">${esc((followupsOf(c.id)[0]?.text || '').slice(0, 70))}</td><td class="card-wide" data-label="">${can('followups.add') && can('customers.view_phones') ? `<button class="btn sm call" data-call="${c.id}">📞 ${t('اتصال')}</button>` : ''}</td></tr>`;
const callHead = () => `<thead><tr><th class="sticky-col">${t('الاسم')}</th><th>${t('الهاتف')}</th><th>${t('الموقع')}</th><th>${t('المحصول')}</th><th>${t('التقييم')}</th><th>${t('المرحلة')}</th><th>${t('المتابعة')}</th>${can('customers.view_all') ? `<th>${t('رجل البيع')}</th>` : ''}<th>${t('آخر متابعة')}</th><th></th></tr></thead>`;
function bindCallRows(el) {
  $$('[data-call]', el).forEach(b => b.onclick = e => { e.stopPropagation(); startCall(b.dataset.call); });
  $$('tr.click[data-id]', el).forEach(tr => tr.onclick = () => openCustomer(tr.dataset.id));
}
const ratingSort = (a, b) => RATINGS.indexOf(a.rating) - RATINGS.indexOf(b.rating);

// ------- إنجاز اليوم: ما سجّله الموظف اليوم من عملاء ومتابعات وطلبات -------
// التواريخ محفوظة بتوقيت جرينتش، فيُقارن اليوم بالتوقيت المحلي حتى لا تضيع أعمال ما بعد منتصف الليل
const localDay = s => { const d = new Date(s); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const timeOf = s => { const d = new Date(s); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
// من تُعرض أعماله: كل شخص يرى أعماله، ومن يرى كل العملاء يختار موظفًا أو الكل
let todayWho = '', todayWhoFor = '';
function todayWork(day, who) {
  const mine = id => who === 'all' || id === who;
  const items = [];
  DB.audit.forEach(a => {
    if (!mine(a.userId) || localDay(a.at) !== day) return;
    if (a.action === 'create' && a.entity === 'customer') items.push({ at: a.at, kind: 'new', userId: a.userId, c: custById(a.entityId) });
    else if (a.action === 'create' && a.entity === 'order') {
      const o = DB.orders.find(x => x.id === a.entityId);
      if (o) items.push({ at: a.at, kind: 'order', userId: a.userId, c: custById(o.customerId), text: `${o.no} · ${money(o.total)} ${curLabel(o)}` });
    }
  });
  DB.followups.forEach(f => {
    if (!mine(f.userId) || localDay(f.at) !== day) return;
    items.push({ at: f.at, kind: 'fu', userId: f.userId, c: custById(f.customerId), outcome: f.outcome, text: f.text, next: f.nextDate, voice: f.viaVoice });
  });
  return items.filter(i => i.c).sort((a, b) => String(b.at).localeCompare(String(a.at)));
}
const WORK_KINDS = { new: 'عميل جديد', fu: 'متابعة', order: 'طلب جديد' };
function workSection(items, td) {
  const all = todayWho === 'all';
  const cnt = k => items.filter(i => i.kind === k).length;
  const who = can('customers.view_all') ? `<select class="inp" id="who" style="width:auto" aria-label="${t('أعمال')}"><option value="${ME.id}" ${todayWho === ME.id ? 'selected' : ''}>${t('أعمالي')}</option><option value="all" ${all ? 'selected' : ''}>${t('كل الفريق')}</option>${DB.users.filter(u => u.active && u.id !== ME.id).map(u => `<option value="${u.id}" ${todayWho === u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}</select>` : '';
  return `<div class="section-bar jump-target" id="sec-work">${t('إنجاز اليوم ({n})', { n: items.length })}</div>
  <div class="filters">${who}<span class="chips"><span class="chip">${t('عملاء جدد: {n}', { n: cnt('new') })}</span><span class="chip">${t('متابعات: {n}', { n: cnt('fu') })}</span>${cnt('order') ? `<span class="chip">${t('طلبات: {n}', { n: cnt('order') })}</span>` : ''}</span><span class="spacer"></span>${canExport() && items.length ? `<button class="btn" id="expWork">⬇ ${t('تصدير أعمال اليوم')}</button>` : ''}</div>
  ${items.length ? `<div class="tbl-wrap" style="margin-bottom:14px"><table class="tbl"><thead><tr><th class="sticky-col">${t('العميل')}</th><th>${t('الوقت')}</th><th>${t('النوع')}</th>${all ? `<th>${t('الموظف')}</th>` : ''}<th>${t('النتيجة')}</th><th>${t('ما كُتب في المتابعة')}</th><th>${t('المتابعة التالية')}</th></tr></thead><tbody>${items.map(i => `<tr class="click" data-id="${i.c.id}"><td class="sticky-col card-title" data-label="">${esc(i.c.name)} <span class="muted">${esc(i.c.code)}</span></td><td data-label="${t('الوقت')}">${timeOf(i.at)}</td><td data-label="${t('النوع')}"><span class="pill ${i.kind === 'new' ? 'p-green' : i.kind === 'order' ? 'p-orange' : 'p-blue'}">${t(WORK_KINDS[i.kind])}</span></td>${all ? `<td data-label="${t('الموظف')}">${esc(userName(i.userId))}</td>` : ''}<td data-label="${t('النتيجة')}">${i.outcome ? esc(tv(i.outcome)) : '—'}</td><td class="wrap card-wide" data-label="${t('ما كُتب في المتابعة')}">${i.voice ? '🎙 ' : ''}${esc(i.text || '')}</td><td data-label="${t('المتابعة التالية')}">${i.kind === 'fu' ? (i.next ? fmtDate(i.next) : t('بدون')) : '—'}</td></tr>`).join('')}</tbody></table></div>` : `<div class="card empty" style="margin-bottom:14px">${t('لم تُسجَّل أعمال اليوم بعد')}</div>`}`;
}
function exportWork(items, td) {
  const all = todayWho === 'all';
  const who = all ? t('كل الفريق') : userName(todayWho);
  exportSheet(`${t('أعمال اليوم')} - ${who}`, [
    [t('الوقت'), t('الموظف'), t('النوع'), t('كود العميل'), t('الاسم'), t('الهاتف'), t('الموقع'), t('المحصول'), t('نتيجة المتابعة'), t('ما كُتب في المتابعة'), t('المتابعة التالية'), t('المرحلة الحالية'), t('التقييم')],
    ...items.slice().reverse().map(i => [`${fmtDate(td)} ${timeOf(i.at)}`, userName(i.userId), t(WORK_KINDS[i.kind]), i.c.code, i.c.name, showPhone(i.c.phone1), custLocation(i.c), i.c.crops.map(tv).join('، '), i.outcome ? tv(i.outcome) : '', i.text || '', i.kind === 'fu' ? (i.next ? fmtDate(i.next) : t('بدون')) : '', label(stageById(i.c.stageId)), tv(i.c.rating)]),
  ]);
}

function viewToday(root) {
  const td = today();
  const due = dueOn(td).sort(ratingSort), late = overdue().sort((a, b) => a.followupDate.localeCompare(b.followupDate));
  const inst = installmentAlerts(), posts = postponedDue();
  const m = new Date().getMonth();
  const seasonList = visibleCustomers().filter(c => customerSeason(c, m).some(s => s.start));
  // الاختيار يخص المستخدم الحالي فقط، ويعود لأعماله عند تغيير الحساب
  if (!todayWho || todayWhoFor !== ME.id || !can('customers.view_all')) { todayWho = ME.id; todayWhoFor = ME.id; }
  const work = todayWork(td, todayWho);
  const doneToday = work.filter(i => i.kind === 'fu').length, newToday = work.filter(i => i.kind === 'new').length;
  const asDue = can('aftersales.view') ? afterSalesDue() : [];
  const openTickets = visibleTickets().filter(ticketOpen);
  const notes = myNotifications();
  const buyersDue = visibleCustomers().filter(c => c.asNextDate && c.asNextDate <= td);
  root.innerHTML = `
  <div class="page-head"><h1>${t('مرحبًا، {name}', { name: esc(ME.name.split(' (')[0]) })}</h1><span class="spacer"></span>${canExport() && (late.length || due.length) ? `<button class="btn" id="expLate">⬇ ${t('تصدير المتأخرات ومتابعات اليوم')}</button>` : ''}${can('customers.create') ? `<button class="btn primary" id="add">+ ${t('عميل جديد')}</button>` : ''}<div class="hint">${fmtDate(td)} · ${monthName(m)}</div></div>
  ${notes.length ? `<a class="notice-bar" href="#/notifications">🔔 ${t('لديك تنبيهات جديدة على عملائك: {n}', { n: notes.length })}</a>` : ''}
  ${buyersDue.length ? `<a class="notice-bar after" href="#/buyers">🤝 ${t('متابعات العملاء المشترين المستحقة: {n}', { n: buyersDue.length })}</a>` : ''}

function drawMatrix(el) {
  const cm = new Date().getMonth(), edit = can('crops.manage');

  const draw = () => {

    $('#mt', el).innerHTML = `<thead><tr><th>${t('المحصول')}</th>${MONTHS.map((_, i) => `<th class="${i === cm ? 'cur' : ''}">${monthName(i)}</th>`).join('')}</tr></thead><tbody>${DB.crops.filter(c => !q || c.name.includes(q) || tv(c.name).toLowerCase().includes(q)).map(c => `<tr><td>${esc(tv(c.name))}</td>${MONTHS.map((_, i) => {

      return `<td><span class="m-cell ${p && h ? 'm-b' : p ? 'm-p' : h ? 'm-h' : 'm-n'}" data-c="${esc(c.name)}" data-m="${i}" ${note ? `data-tip="${esc(note)}"` : ''}>${p && h ? t('ز+ح') : p ? t('زراعة') : h ? t('حصاد') : '·'}</span></td>`;
    }).join('')}</tr>`).join('')}</tbody>`;
    if (edit) $$('.m-cell', el).forEach(s => s.onclick = () => {

      // الدورة: فارغ ← زراعة ← حصاد ← الاثنان ← فارغ
      if (!p && !h) c.plant[i] = '';

      else { delete c.plant[i]; delete c.harvest[i]; }

      draw();
    });

  const add = $('#madd', el);

  };

    }
    sellers().forEach(u => logMail(u, today()));
    toast(t('جُهّز بريد اليوم لعدد {n} من رجال البيع (محاكاة)', { n: sellers().length }), 'ok');
    audit('mail', 'mail', null, 'تشغيل بريد المتابعة اليومي (محاكاة)');
  };
  $('#mailLog', root).onclick = openMailLog;
  drawDay();
}
function logMail(u, date) {
  const s = dailySheet(u.id, date);
  DB.mails.unshift({ id: uid(), at: nowStamp(), to: u.email, userId: u.id, date, due: s.due.length, late: s.late.length, inst: s.inst.length, simulated: true });
  if (DB.mails.length > 300) DB.mails.length = 300;
  saveDB();
}
function previewMail(u, date) {
  const s = dailySheet(u.id, date);
  const m = openModal({
    title: t('معاينة بريد المتابعة اليومي'), wide: true,
    body: `<div class="demo-banner">${t('هذه معاينة لبريد رجل البيع. الإرسال الفعلي حاليًا إلى عناوين الاختبار فقط، وبعد ربط الخادم سيُرسل لكل رجل بيع.')}</div>
    <div class="mail-prev"><div><b>${t('إلى:')}</b> <span class="ltr">${esc(u.email)}</span></div><div><b>${t('الموضوع:')}</b> ${t('متابعات {d}: اليوم {a}، المتأخرة {b}', { d: fmtDate(date), a: s.due.length, b: s.late.length })}</div><div><b>${t('المرفق:')}</b> 📎 ${t('متابعات')} ${date}.xlsx</div><hr style="border:0;border-top:1px solid var(--border)">
    <p>${t('صباح الخير {name}،', { name: esc(u.name) })}</p><p>${t('متابعات اليوم: {a}، المتأخرة: {b}، الأقساط المستحقة: {c}، متابعات ما بعد البيع: {d}. التفاصيل في الملف المرفق.', { a: s.due.length, b: s.late.length, c: s.inst.length, d: s.after.length })}</p>
    ${s.due.length ? `<table class="tbl"><thead><tr><th>${t('العميل')}</th><th>${t('الهاتف')}</th><th>${t('التقييم')}</th></tr></thead><tbody>${s.due.slice(0, 8).map(c => `<tr><td>${esc(c.name)}</td><td class="num">${esc(c.phone1)}</td><td>${ratingPill(c.rating)}</td></tr>`).join('')}</tbody></table>` : ''}</div>`,
    footer: `<button class="btn primary" id="dl">⬇ ${t('تنزيل المرفق')}</button>`,
  });
  $('#dl', m.el).onclick = () => downloadBlob(buildXlsx(s.sheets), `${t('متابعات')} ${date} - ${u.name}.xlsx`);
}
function openMailLog() {
  const list = (can('calendar.team') ? DB.mails : DB.mails.filter(x => x.userId === ME.id)).slice(0, 80);
  openModal({ title: t('سجل البريد اليومي'), wide: true, body: list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('الوقت')}</th><th>${t('إلى')}</th><th>${t('متابعات')}</th><th>${t('متأخرة')}</th><th>${t('أقساط')}</th><th>${t('الحالة')}</th></tr></thead><tbody>${list.map(x => `<tr><td>${fmtDT(x.at)}</td><td class="ltr">${esc(x.to)}</td><td>${x.due}</td><td>${x.late}</td><td>${x.inst}</td><td><span class="pill p-gray">${t('محاكاة')}</span></td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">${t('لا توجد رسائل بعد')}</div>` });
}

</script>
<script>
// الطلبات والأقساط. ينشئ رجل البيع طلبه ويلغيه أو يؤجله دون اعتماد، وتُسجَّل كل خطوة لدى المدير
const orderState = { status: '', q: '', rep: '', tab: 'orders', dist: '', from: '', to: '' };
let filteredOrders = null;

function viewOrders(root, sub) {
  const st = orderState;
  if (sub === 'installments') st.tab = 'installments';
  const all = visibleOrders();
  root.innerHTML = `<div class="page-head"><h1>${t('الطلبات')}</h1><span class="spacer"></span>${canExport() && st.tab !== 'prices' ? `<button class="btn" id="exp">⬇ ${t('تصدير')}</button>` : ''}${can('orders.create') ? `<button class="btn primary" id="add">+ ${t('طلب جديد')}</button>` : ''}</div>
  <div class="tabs"><button class="tab ${st.tab === 'orders' ? 'on' : ''}" data-t="orders">${t('جميع الطلبات')} <span class="c">(${all.length})</span></button><button class="tab ${st.tab === 'installments' ? 'on' : ''}" data-t="installments">${t('الأقساط')} <span class="c">(${installmentAlerts().length})</span></button><button class="tab ${st.tab === 'prices' ? 'on' : ''}" data-t="prices">${t('قائمة الأسعار')}</button></div><div id="ob"></div>`;
  $$('.tab', root).forEach(b => b.onclick = () => { st.tab = b.dataset.t; if (location.hash !== '#/orders') history.replaceState(null, '', '#/orders'); viewOrders(root); });
  const add = $('#add', root);
  if (add) add.onclick = () => openOrderForm();
  const ex = $('#exp', root);
  if (ex) ex.onclick = () => {
    if (st.tab === 'installments') {
      const rows = all.filter(o => o.status !== 'cancelled').flatMap(o => o.installments.map(i => [o.no, custById(o.customerId)?.name || '', custById(o.customerId)?.phone1 || '', orderRepsName(o), fmtDate(i.due), i.amount, curLabel(o), t(i.paid ? 'مسدد' : i.due < today() ? 'متأخر' : 'مستحق'), fmtDate(i.paidAt)]));
      exportSheet(t('الأقساط'), [[t('الطلب'), t('العميل'), t('الهاتف'), t('رجل البيع'), t('الاستحقاق'), t('المبلغ'), t('العملة'), t('الحالة'), t('تاريخ السداد')], ...rows]);
      return;
    }
    const list = filteredOrders || all;
    const rows = ordersToRows(list);
    rows[0].push(t('الموزع'));
    list.forEach((o, i) => rows[i + 1].push(DB.distributors.find(d => d.id === o.distributorId)?.name || ''));
    exportSheet(t('الطلبات'), rows);
  };
  const ob = $('#ob', root);
  if (st.tab === 'installments') return drawInstallments(ob);
  if (st.tab === 'prices') return drawPrices(ob);
  ob.innerHTML = `<div class="filters"><input class="inp search" id="q" placeholder="${t('ابحث برقم الطلب أو اسم العميل')}" value="${esc(st.q)}"><select class="inp" id="s" aria-label="${t('الحالة')}">${optsT(Object.entries(ORDER_STATUS), st.status, t('جميع الحالات'))}</select>${can('orders.view_all') ? `<select class="inp" id="r" aria-label="${t('رجل البيع')}">${repOptions(st.rep)}</select>` : ''}<select class="inp" id="dist" aria-label="${t('الموزع')}">${opts(DB.distributors.map(d => [d.id, d.name]), st.dist, t('جميع الموزعين'))}</select>${dateRangeHtml(st)}</div><div id="ol"></div>`;
  bindDateRange(ob, st, () => draw());
  $('#dist', ob).onchange = e => { st.dist = e.target.value; draw(); };
  const draw = () => {
    const q = st.q.trim();
    const list = all.filter(o => (!st.status || o.status === st.status) && (!st.rep || creditedTo(o, st.rep)) && (!st.dist || o.distributorId === st.dist) && inDateRange(o.date, st) && (!q || o.no.includes(q) || custById(o.customerId)?.name.includes(q)));
    filteredOrders = list;
    $('#ol', ob).innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('الطلب')}</th><th>${t('التاريخ')}</th><th>${t('العميل')}</th>${can('orders.view_all') ? `<th>${t('رجل البيع')}</th>` : ''}<th>${t('الجهاز')}</th><th>${t('الكمية')}</th><th>${t('الإجمالي')}</th><th>${t('الدفع')}</th><th>${t('المحصّل')}</th><th>${t('المتبقي')}</th><th>${t('الحالة')}</th></tr></thead><tbody>${list.slice(0, 150).map(o => {
      const coll = orderCollected(o);
      return `<tr class="click" data-o="${o.id}"><td><b>${o.no}</b></td><td>${fmtDate(o.date)}</td><td>${esc(custById(o.customerId)?.name)}</td>${can('orders.view_all') ? `<td>${esc(orderRepsName(o))}</td>` : ''}<td>${esc(o.items.map(i => deviceName(i.type, i.size)).join(' + '))}</td><td>${o.items.reduce((s, i) => s + i.qty, 0)}</td><td>${money(o.total)} ${curLabel(o)}</td><td>${t(PAY_TYPES[o.payType])}</td><td>${money(coll)}</td><td>${o.status === 'cancelled' ? '—' : money(o.total - coll)}</td><td>${statusPill(o.status)}${o.status === 'postponed' && o.postponedTo ? ` <span class="muted">${fmtDate(o.postponedTo)}</span>` : ''}</td></tr>`;
    }).join('')}</tbody></table></div>` : `<div class="card empty">${t('لا توجد طلبات مطابقة')}</div>`;
    $$('[data-o]', ob).forEach(tr => tr.onclick = () => openOrder(tr.dataset.o, () => viewOrders(root)));
  };
  $('#q', ob).oninput = e => { st.q = e.target.value; draw(); };
  $('#s', ob).onchange = e => { st.status = e.target.value; draw(); };
  const r = $('#r', ob);
  if (r) r.onchange = e => { st.rep = e.target.value; draw(); };
  draw();
}

function drawInstallments(ob) {
  const td = today();
  const rows = visibleOrders().filter(o => o.status !== 'cancelled').flatMap(o => o.installments.filter(i => !i.paid).map(i => ({ o, i }))).sort((a, b) => a.i.due.localeCompare(b.i.due));
  const late = rows.filter(r => r.i.due < td);
  const sum = list => list.reduce((s, r) => s + r.i.amount * fx(r.o), 0);
  ob.innerHTML = `<div class="kpis"><div class="kpi alert"><div class="l">${t('أقساط متأخرة')}</div><div class="v">${money(sum(late))} <small>${t('ج.م')}</small></div><div class="d">${t('عدد الأقساط: {n}', { n: late.length })}</div></div><div class="kpi warn"><div class="l">${t('مستحق خلال 7 أيام')}</div><div class="v">${money(sum(rows.filter(r => r.i.due >= td && r.i.due <= addDays(td, 7))))} <small>${t('ج.م')}</small></div></div><div class="kpi"><div class="l">${t('إجمالي المتبقي')}</div><div class="v">${money(sum(rows))} <small>${t('ج.م')}</small></div><div class="d">${t('عدد الأقساط: {n}', { n: rows.length })}</div></div></div>
  ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('الاستحقاق')}</th><th>${t('العميل')}</th><th>${t('الهاتف')}</th><th>${t('الطلب')}</th>${can('orders.view_all') ? `<th>${t('رجل البيع')}</th>` : ''}<th>${t('المبلغ')}</th><th></th></tr></thead><tbody>${rows.slice(0, 200).map(({ o, i }) => {
    const c = custById(o.customerId);
    return `<tr><td>${i.due < td ? `<span class="pill p-red">⚠ ${fmtDate(i.due)}</span>` : i.due === td ? `<span class="pill p-orange">${t('اليوم')}</span>` : fmtDate(i.due)}</td><td>${esc(c?.name)}</td><td>${phoneLink(c?.phone1)}</td><td><a href="#" data-o="${o.id}">${o.no}</a></td>${can('orders.view_all') ? `<td>${esc(orderRepsName(o))}</td>` : ''}<td><b>${money(i.amount)}</b> ${curLabel(o)}</td><td>${can('orders.collect') ? `<button class="btn sm" data-pay="${o.id}|${i.id}">✓ ${t('تم السداد')}</button>` : ''}</td></tr>`;
  }).join('')}</tbody></table></div>` : `<div class="card empty">${t('لا توجد أقساط مستحقة')}</div>`}`;
  $$('[data-o]', ob).forEach(a => a.onclick = e => { e.preventDefault(); openOrder(a.dataset.o, () => drawInstallments(ob)); });
  $$('[data-pay]', ob).forEach(b => b.onclick = () => {
    const [oid, iid] = b.dataset.pay.split('|');
    markPaid(oid, iid);
    drawInstallments(ob);
  });
}
function markPaid(oid, iid) {
  const o = DB.orders.find(x => x.id === oid), i = o.installments.find(x => x.id === iid);
  i.paid = true; i.paidAt = today();
  const c = custById(o.customerId), next = o.installments.find(x => !x.paid);
  if (c) c.payDate = next?.due || i.paidAt;
  audit('update', 'order', o.id, 'تحصيل قسط من الطلب {no}', { no: o.no }, [{ field: 'قسط', from: fmtDate(i.due), to: money(i.amount) }]);
  toast(t('تم تسجيل التحصيل'), 'ok');
}

function drawPrices(ob) {
  const multi = activeDomains().length > 1;
  const table = mk => {
    const list = productsFor(null, mk).sort(productSort);
    const cur = curName(mk === 'intl' ? 'USD' : 'EGP');
    const head = `<div class="section-bar">${t(mk === 'intl' ? 'أسعار خارج مصر (بالدولار)' : 'أسعار داخل مصر (بالجنيه)')}</div>`;
    if (!list.length) return `${head}<div class="card empty">${t('لا توجد أجهزة متاحة')}</div>`;
    // الموديلات في جدول مثل قائمة الأسعار: المقاسات صفوف والموديلات أعمدة، والخانة الفارغة تعني غير متاح
    const models = list.filter(p => MODEL_RX.test(p.type));
    const types = [...new Set(models.map(p => p.type))].sort((a, b) => +a.match(MODEL_RX)[1] - +b.match(MODEL_RX)[1]);
    const sizes = [...new Set(models.map(p => p.size))];
    const grid = models.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('المقاس')}</th>${types.map(ty => { const m = ty.match(MODEL_RX); return `<th>X${m[1]}<div class="muted">${t('حتى {ppm}', { ppm: ppmText(m[2]) })}</div></th>`; }).join('')}</tr></thead><tbody>${sizes.map(s => `<tr><td><b>${esc(tv(s))}</b></td>${types.map(ty => { const p = models.find(x => x.type === ty && x.size === s); return `<td>${p ? `${money(p.price)} ${cur}` : '<span class="muted">—</span>'}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>` : '';
    const others = list.filter(p => !MODEL_RX.test(p.type));
    const rest = others.length ? `<div class="tbl-wrap mt"><table class="tbl"><thead><tr>${multi ? `<th>${t('المجال')}</th>` : ''}<th>${t('الجهاز')}</th><th>${t('السعر')} (${cur})</th></tr></thead><tbody>${others.map(p => `<tr>${multi ? `<td>${esc(label(DB.domains.find(d => d.id === p.domainId)))}</td>` : ''}<td>${esc(productLabel(p))}</td><td>${money(p.price)}</td></tr>`).join('')}</tbody></table></div>` : '';
    return head + grid + rest;
  };
  ob.innerHTML = `<div class="filters">${can('catalog.manage') ? `<a class="btn" href="#/settings/catalog">${t('إدارة المنتجات والأسعار')}</a>` : ''}</div>${table('egypt')}${table('intl')}`;
}

function openOrderForm(customerId) {
  const customers = visibleCustomers().sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  const items = [{ productId: '', qty: 1, price: 0 }];
  const preset = customerId ? custById(customerId) : null;
  const presetCur = preset?.market === 'intl' ? 'USD' : 'EGP';
  if (preset) {
    const same = x => x.type === preset.deviceType && x.size === preset.deviceSize;
    const p = productsFor(null, preset.market).find(same) || activeProducts().find(same);
    if (p) { items[0].productId = p.id; items[0].price = productPrice(p, presetCur); }
  }
  // قائمة الأجهزة مقسمة: داخل مصر بالجنيه، وخارج مصر بالدولار
  const productOpts = sel => `<option value="">${t('اختر')}</option>${Object.entries(PRODUCT_MARKETS).map(([mk, l]) => {
    const list = productsFor(null, mk).sort(productSort);
    return list.length ? `<optgroup label="${esc(t(l))}">${list.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(productLabel(p))} · ${money(p.price)} ${curName(productCurrency(p))}</option>`).join('')}</optgroup>` : '';
  }).join('')}`;
  const m = openModal({
    title: t('طلب جديد'), wide: true,
    body: `<div class="grid2"><div class="field"><label>${t('العميل')} <span class="req">*</span></label><input class="inp" id="oc" list="ocl" value="${preset ? esc(`${preset.name} | ${preset.code}`) : ''}" placeholder="${t('اكتب اسم العميل')}"><datalist id="ocl">${customers.map(c => `<option value="${esc(`${c.name} | ${c.code}`)}">`).join('')}</datalist></div><div class="field"><label>${t('تاريخ الطلب')}</label><input class="inp" type="date" id="od" value="${today()}"></div><div class="field"><label>${t('عن طريق الموزع')}</label><select class="inp" id="odist">${opts(DB.distributors.filter(d => d.active !== false || d.id === preset?.viaDistributorId).map(d => [d.id, `${d.name}${d.type ? ` (${tv(d.type)})` : ''}`]), preset ? preset.viaDistributorId || territoryPartners(preset)[0]?.id || '' : '', t('بدون موزع'))}</select></div></div>
    <div id="its"></div><button class="btn sm" id="addIt">+ ${t('جهاز آخر')}</button>
    <div class="grid3 mt"><div class="field"><label>${t('العملة')}</label><select class="inp" id="cur">${optsT([['EGP', 'جنيه مصري'], ['USD', 'دولار']], presetCur)}</select></div><div class="field"><label>${t('الخصم')}</label><input class="inp" type="number" min="0" id="disc" value="0"></div><div class="field"><label>${t('الإجمالي')}</label><div class="kpi" style="padding:5px 10px"><div class="v" id="tot" style="font-size:18px">0</div></div></div></div>
    <div class="field"><label>${t('طريقة الدفع')}</label><div class="chips" id="pt">${Object.entries(PAY_TYPES).map(([k, v]) => `<button type="button" class="chip ${k === 'cash' ? 'on' : ''}" data-p="${k}">${t(v)}</button>`).join('')}</div></div><div id="payBox"></div>`,
    footer: `<button class="btn primary" id="sv">${t('حفظ الطلب')}</button>`,
  });
  let payType = 'cash';
  const cur = () => $('#cur', m.el).value;
  const total = () => Math.max(0, items.reduce((s, i) => s + (+i.qty || 0) * (+i.price || 0), 0) - (+$('#disc', m.el).value || 0));
  const schedule = () => {
    const dep = +($('#dep', m.el)?.value) || 0, rest = Math.max(0, total() - dep);
    if (payType === 'cash') return [];
    if (payType === 'deposit') return [{ id: uid(), due: $('#first', m.el).value, amount: rest, paid: false, paidAt: '' }];
    const n = Math.max(1, +$('#cnt', m.el).value || 1), each = Math.floor(rest / n), first = $('#first', m.el).value;
    return Array.from({ length: n }, (_, k) => ({ id: uid(), due: addMonths(first, k), amount: k === n - 1 ? rest - each * (n - 1) : each, paid: false, paidAt: '' }));
  };
  const planPreview = () => {
    const list = schedule();
    return list.length ? `<div class="muted">${t('جدول السداد:')}</div><div class="chips">${list.map(i => `<span class="pill p-gray">${fmtDate(i.due)}: ${money(i.amount)}</span>`).join('')}</div>` : '';
  };
  const upd = () => {
    $('#tot', m.el).textContent = money(total());
    const plan = $('#plan', m.el);
    if (plan) plan.innerHTML = planPreview();
  };
  const drawPay = () => {
    const box = $('#payBox', m.el);
    box.innerHTML = payType === 'cash' ? '' : `<div class="grid3"><div class="field"><label>${t('قيمة المقدم')}</label><input class="inp" type="number" min="0" id="dep" value="0"></div>${payType === 'installment' ? `<div class="field"><label>${t('عدد الأقساط')}</label><input class="inp" type="number" min="1" id="cnt" value="3"></div>` : ''}<div class="field"><label>${t(payType === 'installment' ? 'تاريخ أول قسط' : 'تاريخ سداد المتبقي')}</label><input class="inp" type="date" id="first" value="${addMonths(today(), 1)}"></div></div><div id="plan"></div>`;
    $$('input', box).forEach(i => i.oninput = upd);
    upd();
  };
  const drawItems = () => {
    const box = $('#its', m.el);
    box.innerHTML = items.map((it, i) => `<div class="grid3" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1.3fr) auto;align-items:end"><div class="field"><label>${t('الجهاز')}</label><select class="inp" data-i="${i}" data-k="productId">${productOpts(it.productId)}</select></div><div class="field"><label>${t('الكمية')}</label><input class="inp" type="number" min="1" data-i="${i}" data-k="qty" value="${it.qty}"></div><div class="field"><label>${t('سعر الوحدة')}</label><input class="inp" type="number" min="0" data-i="${i}" data-k="price" value="${it.price}"></div><div class="field">${items.length > 1 ? `<button class="btn sm danger" data-rm="${i}">×</button>` : ''}</div></div>`).join('');
    $$('[data-k]', box).forEach(el => el.oninput = el.onchange = () => {
      const it = items[+el.dataset.i];
      it[el.dataset.k] = el.value;
      if (el.dataset.k === 'productId') {
        const p = DB.products.find(x => x.id === el.value);
        it.price = productPrice(p, cur());
        drawItems();
      }
      upd();
    });
    $$('[data-rm]', box).forEach(b => b.onclick = () => { items.splice(+b.dataset.rm, 1); drawItems(); upd(); });
  };
  $('#addIt', m.el).onclick = () => { items.push({ productId: '', qty: 1, price: 0 }); drawItems(); };
  $('#disc', m.el).oninput = upd;
  $('#cur', m.el).onchange = () => {
    items.forEach(it => { const p = DB.products.find(x => x.id === it.productId); if (p) it.price = productPrice(p, cur()); });
    drawItems(); upd();
  };
  $$('#pt .chip', m.el).forEach(b => b.onclick = () => { payType = b.dataset.p; $$('#pt .chip', m.el).forEach(x => x.classList.toggle('on', x === b)); drawPay(); });
  $('#sv', m.el).onclick = () => {
    const code = ($('#oc', m.el).value.split('|')[1] || '').trim();
    const c = customers.find(x => x.code === code);
    if (!c) { toast(t('يرجى اختيار العميل من القائمة'), 'err'); return; }
    if (items.some(i => !i.productId || !(+i.qty > 0))) { toast(t('يرجى اختيار الجهاز والكمية'), 'err'); return; }
    const tot = total();
    if (tot <= 0) { toast(t('يجب أن يكون إجمالي الطلب أكبر من صفر'), 'err'); return; }
    const deposit = +($('#dep', m.el)?.value) || 0;
    if (deposit > tot) { toast(t('المقدم أكبر من إجمالي الطلب'), 'err'); return; }
    if (deposit >= tot && payType === 'deposit') { toast(t('عند سداد المبلغ كاملًا يرجى اختيار نقدًا'), 'err'); return; }
    const orderItems = items.map(i => {
      const p = DB.products.find(x => x.id === i.productId);
      return { productId: p.id, type: p.type, size: p.size, qty: +i.qty, price: +i.price };
    });
    const o = createOrder({ customerId: c.id, repId: c.ownerId, distributorId: $('#odist', m.el).value, date: $('#od', m.el).value || today(), items: orderItems, discount: +$('#disc', m.el).value || 0, total: tot, currency: $('#cur', m.el).value, payType, deposit, installments: schedule() });
    m.close();
    toast(t('تم تسجيل الطلب {no}', { no: o.no }), 'ok');
    route();
  };
  drawItems(); drawPay();
}

function openOrder(id, onChange) {
  const o = DB.orders.find(x => x.id === id);
  if (!o) return;
  const c = custById(o.customerId), cur = curLabel(o);
  const manage = can('orders.manage'), collect = can('orders.collect');
  const footer = (manage ? `<button class="btn" id="edit">✎ ${t('تعديل')}</button>` : '') + (!manage ? '' : o.status === 'cancelled' ? `<button class="btn" id="re">${t('إعادة تفعيل الطلب')}</button>` : `${o.status !== 'delivered' ? `<button class="btn primary" id="del">✓ ${t('تم التسليم')}</button>` : ''}${o.status === 'postponed' ? `<button class="btn" id="re">${t('تفعيل الطلب')}</button>` : `<button class="btn" id="post">${t('تأجيل')}</button>`}<button class="btn danger" id="can">${t('إلغاء الطلب')}</button>`);
  const m = openModal({
    title: t('طلب {no}', { no: o.no }), wide: true,
    body: `<div class="kv"><div><div class="k">${t('العميل')}</div><div class="val">${esc(c?.name)}</div></div><div><div class="k">${t('الهاتف')}</div><div class="val">${phoneLink(c?.phone1)}</div></div><div><div class="k">${t('التاريخ')}</div><div class="val">${fmtDate(o.date)}</div></div><div><div class="k">${t('الحالة')}</div><div class="val">${statusPill(o.status)} ${o.statusReason ? `<span class="muted">${esc(tv(o.statusReason))}</span>` : ''} ${o.postponedTo ? `<span class="muted">${fmtDate(o.postponedTo)}</span>` : ''}</div></div><div><div class="k">${t('رجل البيع')}</div><div class="val">${esc(orderRepsName(o))}</div></div><div><div class="k">${t('الدفع')}</div><div class="val">${t(PAY_TYPES[o.payType])}${o.deposit ? ` · ${t('المقدم')} ${money(o.deposit)}` : ''}</div></div><div><div class="k">${t('الموزع')}</div><div class="val">${esc(DB.distributors.find(d => d.id === o.distributorId)?.name || '—')}</div></div></div>
    <table class="tbl mt"><thead><tr><th>${t('الجهاز')}</th><th>${t('المقاس')}</th><th>${t('الكمية')}</th><th>${t('السعر')}</th><th>${t('الإجمالي')}</th></tr></thead><tbody>${o.items.map(i => `<tr><td>${esc(deviceName(i.type, i.size))}</td><td>${esc(tv(i.size))}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty * i.price)}</td></tr>`).join('')}${o.discount ? `<tr><td colspan="4">${t('الخصم')}</td><td>- ${money(o.discount)}</td></tr>` : ''}<tr><td colspan="4"><b>${t('الإجمالي')}</b></td><td><b>${money(o.total)} ${cur}</b></td></tr></tbody></table>
    ${o.installments.length ? `<h4 class="mt">${t('جدول السداد')}</h4><table class="tbl mt"><thead><tr><th>${t('الاستحقاق')}</th><th>${t('المبلغ')}</th><th>${t('الحالة')}</th><th></th></tr></thead><tbody>${o.installments.map(i => `<tr><td>${fmtDate(i.due)}</td><td>${money(i.amount)} ${cur}</td><td>${i.paid ? `<span class="pill p-green">${t('مسدد')} ${fmtDate(i.paidAt)}</span>` : i.due < today() ? `<span class="pill p-red">⚠ ${t('متأخر')}</span>` : `<span class="pill p-gray">${t('مستحق')}</span>`}</td><td>${!i.paid && o.status !== 'cancelled' && collect ? `<button class="btn sm" data-pay="${i.id}">✓ ${t('تم السداد')}</button>` : ''}</td></tr>`).join('')}</tbody></table>` : ''}
    <div class="muted mt">${t('المحصّل {a} {c} من {b} {c}', { a: money(orderCollected(o)), b: money(o.total), c: cur })}</div>`,
    footer,
  });
  const done = () => { m.close(); onChange ? onChange() : route(); };
  $$('[data-pay]', m.el).forEach(b => b.onclick = () => { markPaid(o.id, b.dataset.pay); done(); });
  const on = (sel, fn) => { const el = $(sel, m.el); if (el) el.onclick = fn; };
  on('#edit', () => { m.close(); openOrderEdit(o, () => openOrder(o.id, onChange)); });
  on('#del', () => { setOrderStatus(o, 'delivered'); toast(t('تم التسليم وأُنشئت متابعات ما بعد البيع'), 'ok'); done(); });
  on('#re', () => { setOrderStatus(o, 'active'); done(); });
  const askReason = (title, withDate, cb) => {
    const q = openModal({ title, body: `${withDate ? `<div class="field"><label>${t('التأجيل إلى تاريخ')} <span class="req">*</span></label><input class="inp" type="date" id="pd" min="${today()}" value="${addDays(today(), 7)}"></div>` : ''}<div class="field"><label>${t('السبب')} <span class="req">*</span></label><input class="inp" id="rs"></div>`, footer: `<button class="btn primary" id="ok">${t('تأكيد')}</button>` });
    $('#ok', q.el).onclick = () => {
      const r = $('#rs', q.el).value.trim();
      if (!r) { toast(t('يرجى كتابة السبب'), 'err'); return; }
      const d = withDate ? $('#pd', q.el).value : '';
      if (withDate && !d) { toast(t('يرجى تحديد التاريخ'), 'err'); return; }
      q.close(); cb(r, d);
    };
  };
  on('#post', () => askReason(t('تأجيل الطلب'), true, (r, d) => { setOrderStatus(o, 'postponed', r, d); done(); }));
  on('#can', () => askReason(t('إلغاء الطلب'), false, r => { setOrderStatus(o, 'cancelled', r); done(); }));
}

</script>
<script>
// إدارة ما بعد البيع (لكل العملاء) وطلبات الدعم الفني (لعملاء مصر فقط)
const asState = { tab: 'due', rep: '', q: '', from: '', to: '' };

function viewAfterSales(root) {
  const st = asState;
  const td = today();
  const all = afterSalesVisible();
  const pending = all.filter(a => a.status === 'pending');
  const due = pending.filter(a => a.due <= td), coming = pending.filter(a => a.due > td), done = all.filter(a => a.status === 'done');
  const scored = done.filter(a => a.satisfaction);
  const avg = scored.length ? scored.reduce((s, a) => s + a.satisfaction, 0) / scored.length : 0;
  const buyers = new Set(visibleOrders().filter(countsAsSale).map(o => o.customerId));
  root.innerHTML = `<div class="page-head"><h1>${t('متابعات ما بعد البيع')}</h1><div class="hint">${t('تُنشأ المتابعات تلقائيًا عند تسليم الطلب وفق الخطة المحددة في الإعدادات')}</div></div>
  <div class="kpis">
    ${kpiBtn('buyers', t('العملاء المشترون'), buyers.size, '', st.tab === 'buyers')}
    ${kpiBtn('due', t('متابعات مستحقة'), due.length, due.length ? 'alert' : 'ok', st.tab === 'due')}
    ${kpiBtn('coming', t('متابعات قادمة'), coming.length, '', st.tab === 'coming')}
    ${kpiBtn('done', t('متابعات منجزة'), done.length, 'ok', st.tab === 'done')}
    ${kpiBtn('done', t('متوسط رضا العملاء'), `${avg ? avg.toFixed(1) : '—'} <small>/ 5</small>`, '', false)}
  </div>
  <div class="tabs jump-target" id="kpi-list">${[['due', 'مستحقة', due.length], ['coming', 'قادمة', coming.length], ['done', 'منجزة', done.length], ['buyers', 'العملاء المشترون', buyers.size]].map(([k, l, n]) => `<button class="tab ${st.tab === k ? 'on' : ''}" data-t="${k}">${t(l)} <span class="c">(${n})</span></button>`).join('')}</div>
  <div class="filters"><input class="inp search" id="q" placeholder="${t('ابحث باسم العميل')}" value="${esc(st.q)}">${can('customers.view_all') ? `<select class="inp" id="rep" aria-label="${t('رجل البيع')}">${repOptions(st.rep)}</select>` : ''}${dateRangeHtml(st, t('الموعد من'))}<span class="spacer"></span>${canExport() ? `<button class="btn" id="exp">⬇ ${t('تصدير')}</button>` : ''}</div><div id="al"></div>`;
  let shown = [];
  $$('.tab', root).forEach(b => b.onclick = () => { st.tab = b.dataset.t; viewAfterSales(root); });
  bindKpis(root, k => { st.tab = k; viewAfterSales(root); });
  const draw = () => {
    const el = $('#al', root);
    const q = st.q.trim();
    const custOk = c => c && (!q || c.name.includes(q)) && (!st.rep || followedBy(c, st.rep));
    if (st.tab === 'buyers') {
      const list = [...buyers].map(custById).filter(custOk);
      el.innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky-col">${t('الاسم')}</th><th>${t('الهاتف')}</th><th>${t('الموقع')}</th><th>${t('المرحلة')}</th><th>${t('آخر طلب')}</th><th>${t('المتابعة القادمة')}</th><th>${t('آخر تقييم رضا')}</th></tr></thead><tbody>${list.slice(0, 200).map(c => {
        const lastOrder = DB.orders.filter(o => o.customerId === c.id && countsAsSale(o)).sort((a, b) => b.date.localeCompare(a.date))[0];
        const rec = afterSalesOf(c.id);
        const next = rec.find(a => a.status === 'pending');
        const last = [...rec].reverse().find(a => a.status === 'done' && a.satisfaction);
        return `<tr class="click" data-c="${c.id}"><td class="sticky-col">${esc(c.name)}</td><td>${phoneLink(c.phone1)}</td><td>${esc(custLocation(c))}</td><td>${stagePill(c)}</td><td>${fmtDate(lastOrder?.date)}</td><td>${next ? `${followPill(next.due)} <span class="muted">${esc(tv(next.name))}</span>` : '<span class="muted">—</span>'}</td><td>${last ? stars(last.satisfaction) : '<span class="muted">—</span>'}</td></tr>`;
      }).join('')}</tbody></table></div>` : `<div class="card empty">${t('لا توجد بيانات')}</div>`;
      $$('[data-c]', el).forEach(tr => tr.onclick = () => openCustomer(tr.dataset.c, 'after'));
      return;
    }
    const base = st.tab === 'due' ? due : st.tab === 'coming' ? coming : done;
    const list = base.filter(a => custOk(custById(a.customerId)) && inDateRange(a.due, st)).sort((a, b) => st.tab === 'done' ? String(b.doneAt).localeCompare(String(a.doneAt)) : a.due.localeCompare(b.due));
    el.innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th class="sticky-col">${t('العميل')}</th><th>${t('الهاتف')}</th><th>${t('المتابعة')}</th><th>${t('الموعد')}</th>${can('customers.view_all') ? `<th>${t('رجل البيع')}</th>` : ''}${st.tab === 'done' ? `<th>${t('الرضا')}</th><th>${t('الملاحظات')}</th><th>${t('نفّذها')}</th>` : '<th></th>'}</tr></thead><tbody>${list.slice(0, 200).map(a => {
      const c = custById(a.customerId);
      return `<tr class="click" data-c="${c.id}"><td class="sticky-col">${esc(c.name)}</td><td>${phoneLink(c.phone1)}</td><td>${esc(tv(a.name))}</td><td>${a.status === 'done' ? fmtDate(a.due) : followPill(a.due)}</td>${can('customers.view_all') ? `<td>${esc(userName(c.ownerId))}</td>` : ''}${st.tab === 'done' ? `<td>${stars(a.satisfaction)}</td><td class="wrap">${esc(a.feedback)}</td><td>${esc(userName(a.doneBy))}</td>` : `<td>${can('aftersales.work') ? `<button class="btn sm primary" data-as="${a.id}">${t('تسجيل المتابعة')}</button> <button class="btn sm" data-ase="${a.id}" aria-label="${t('تعديل')}">✎</button>` : ''}</td>`}</tr>`;
    }).join('')}</tbody></table></div>` : `<div class="card empty">${t('لا توجد متابعات في هذا القسم')}</div>`;
    shown = list;
    $$('[data-as]', el).forEach(b => b.onclick = e => { e.stopPropagation(); openAfterSaleForm(b.dataset.as, () => viewAfterSales(root)); });
    $$('[data-ase]', el).forEach(b => b.onclick = e => { e.stopPropagation(); openAfterSaleEdit(b.dataset.ase, () => viewAfterSales(root)); });
    $$('[data-c]', el).forEach(tr => tr.onclick = () => openCustomer(tr.dataset.c, 'after'));
  };
  $('#q', root).oninput = e => { st.q = e.target.value; draw(); };
  bindDateRange(root, st, draw);
  const exp = $('#exp', root);
  if (exp) exp.onclick = () => exportSheet(t('متابعات ما بعد البيع'), [[t('العميل'), t('الهاتف'), t('المتابعة'), t('الموعد'), t('الحالة'), t('رجل البيع'), t('الرضا'), t('الملاحظات'), t('نفّذها')], ...shown.map(a => { const c = custById(a.customerId); return [c?.name || '', c?.phone1 || '', tv(a.name), fmtDate(a.due), t(a.status === 'done' ? 'تمت' : 'قادمة'), userName(c?.ownerId), a.satisfaction || '', a.feedback, userName(a.doneBy)]; })]);
  const rep = $('#rep', root);
  if (rep) rep.onchange = () => { st.rep = rep.value; draw(); };
  draw();
}

function openAfterSaleForm(id, onDone) {
  const a = DB.afterSales.find(x => x.id === id);
  const c = custById(a.customerId);
  let viaVoice = false, score = 0;
  const m = openModal({
    title: `${esc(tv(a.name))}: ${esc(c.name)}`,
    body: `<div class="mic-box"><button type="button" class="mic" id="mic" aria-label="${t('تسجيل صوتي')}">🎙</button><div class="mic-status" id="ms"></div></div>
    <div class="field"><label>${t('ملاحظات العميل')} <span class="req">*</span></label><textarea class="inp" id="fb" rows="4"></textarea></div>
    <div class="field"><label>${t('مستوى رضا العميل')}</label><div class="chips" id="sc">${[1, 2, 3, 4, 5].map(n => `<button type="button" class="chip" data-n="${n}">${'★'.repeat(n)}</button>`).join('')}</div></div>
    <div class="grid2"><div class="field"><label>${t('متابعة إضافية بتاريخ')}</label><input class="inp" type="date" id="nd" min="${today()}"><small>${t('اختياري')}</small></div><div class="field"><label>${t('اسم المتابعة الإضافية')}</label><input class="inp" id="nn" value="${esc(tv(a.name))}"></div></div>`,
    footer: `<button class="btn primary" id="sv">${t('حفظ')}</button>`,
  });
  const stopMic = bindMic(m.el, { mic: '#mic', status: '#ms', input: '#fb', onVoice: () => { viaVoice = true; } });
  $$('#sc .chip', m.el).forEach(b => b.onclick = () => { score = +b.dataset.n; $$('#sc .chip', m.el).forEach(x => x.classList.toggle('on', x === b)); });
  $('#sv', m.el).onclick = () => {
    stopMic();
    const feedback = $('#fb', m.el).value.trim();
    if (!feedback) { toast(t('يرجى تسجيل ملاحظات العميل'), 'err'); return; }
    completeAfterSale(a, { feedback, satisfaction: score, viaVoice, nextDate: $('#nd', m.el).value, nextName: $('#nn', m.el).value.trim() });
    m.close();
    toast(t('تم تسجيل المتابعة'), 'ok');
    onDone && onDone();
  };
}
function openScheduleAfterSale(customerId, onDone) {
  const m = openModal({
    title: t('جدولة متابعة ما بعد البيع'),
    body: `<div class="field"><label>${t('اسم المتابعة')} <span class="req">*</span></label><input class="inp" id="nm"></div><div class="field"><label>${t('الموعد')} <span class="req">*</span></label><input class="inp" type="date" id="dt" value="${addDays(today(), 7)}"></div>`,
    footer: `<button class="btn primary" id="sv">${t('حفظ')}</button>`,
  });
  $('#sv', m.el).onclick = () => {
    const name = $('#nm', m.el).value.trim(), due = $('#dt', m.el).value;
    if (!name || !due) { toast(t('يرجى إدخال الاسم والموعد'), 'err'); return; }
    addAfterSale(customerId, name, due);
    audit('aftersale', 'customer', customerId, 'جدولة متابعة ما بعد البيع: {name}', { name: custById(customerId)?.name || '' });
    m.close();
    onDone && onDone();
  };
}

// ------- الدعم الفني -------
const supState = { status: 'open', prio: '', q: '', assigned: '', from: '', to: '' };
// حالات مجمّعة للاختصارات: "قيد التنفيذ" تشمل المُسند والجاري، و"تم حلها" تشمل المحلول والمغلق
const supStatusOk = (x, s) => s === 'all' || (s === 'open' ? ticketOpen(x) : s === 'prog' ? ['assigned', 'in_progress'].includes(x.status) : s === 'done' ? !ticketOpen(x) : x.status === s);
function viewSupport(root) {
  const st = supState;
  const all = visibleTickets();
  const open = all.filter(ticketOpen);
  root.innerHTML = `<div class="page-head"><h1>${t('الدعم الفني')}</h1><span class="spacer"></span>${can('support.create') ? `<button class="btn primary" id="add">+ ${t('طلب دعم جديد')}</button>` : ''}<div class="hint">${t('خدمة إضافية لعملاء مصر فقط')}</div></div>
  <div class="kpis">
    ${kpiBtn('new', t('طلبات جديدة'), all.filter(x => x.status === 'new').length, all.some(x => x.status === 'new') ? 'alert' : 'ok', st.status === 'new' && !st.prio)}
    ${kpiBtn('prog', t('قيد التنفيذ'), all.filter(x => ['assigned', 'in_progress'].includes(x.status)).length, 'warn', st.status === 'prog' && !st.prio)}
    ${kpiBtn('urgent', t('طلبات عاجلة مفتوحة'), open.filter(x => x.priority === 'high').length, open.some(x => x.priority === 'high') ? 'alert' : '', st.prio === 'high')}
    ${kpiBtn('done', t('تم حلها'), all.filter(x => !ticketOpen(x)).length, 'ok', st.status === 'done' && !st.prio)}
  </div>
  <div class="filters jump-target" id="kpi-list"><input class="inp search" id="q" placeholder="${t('ابحث برقم الطلب أو اسم العميل')}" value="${esc(st.q)}"><select class="inp" id="s" aria-label="${t('الحالة')}">${opts([['open', t('المفتوحة')], ['all', t('الكل')], ['prog', t('قيد التنفيذ (مُسند أو جارٍ)')], ['done', t('تم حلها (محلول أو مغلق)')], ...Object.entries(TICKET_STATUS).map(([k, v]) => [k, t(v)])], st.status)}</select>${st.prio ? `<button class="chip on" id="prioX">⚠ ${t('العاجلة فقط')} ×</button>` : ''}${can('support.manage') ? `<select class="inp" id="as" aria-label="${t('مُسند إلى')}">${opts(DB.users.filter(u => u.active && userCan(u, 'support.manage')).map(u => [u.id, u.name]), st.assigned, t('الجميع'))}</select>` : ''}${dateRangeHtml(st)}<span class="spacer"></span>${canExport() ? `<button class="btn" id="exp">⬇ ${t('تصدير')}</button>` : ''}</div><div id="tl"></div>`;
  let shown = [];
  const draw = () => {
    const q = st.q.trim();
    const list = all.filter(x => supStatusOk(x, st.status) && (!st.prio || x.priority === st.prio) && (!st.assigned || x.assignedTo === st.assigned) && inDateRange(x.createdAt, st) && (!q || x.no.includes(q) || custById(x.customerId)?.name.includes(q)))
      .sort((a, b) => (a.priority === 'high' ? 0 : 1) - (b.priority === 'high' ? 0 : 1) || b.createdAt.localeCompare(a.createdAt));
    const el = $('#tl', root);
    el.innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('رقم الطلب')}</th><th>${t('العميل')}</th><th>${t('الموقع')}</th><th>${t('النوع')}</th><th>${t('الأولوية')}</th><th>${t('الحالة')}</th><th>${t('مُسند إلى')}</th><th>${t('موعد الزيارة')}</th><th>${t('تاريخ الطلب')}</th></tr></thead><tbody>${list.map(x => {
      const c = custById(x.customerId);
      return `<tr class="click" data-tk="${x.id}"><td><b>${x.no}</b></td><td>${esc(c?.name)}</td><td>${c ? esc(custLocation(c)) : ''}</td><td>${esc(tv(x.type))}</td><td>${priorityPill(x.priority)}</td><td>${ticketPill(x.status)}</td><td>${x.assignedTo ? esc(userName(x.assignedTo)) : '<span class="muted">—</span>'}</td><td>${fmtDate(x.visitDate)}</td><td>${fmtDate(x.createdAt)}</td></tr>`;
    }).join('')}</tbody></table></div>` : `<div class="card empty">${t('لا توجد طلبات مطابقة')}</div>`;
    $$('[data-tk]', el).forEach(tr => tr.onclick = () => openTicket(tr.dataset.tk, () => viewSupport(root)));
    shown = list;
  };
  bindDateRange(root, st, () => draw());
  const exp = $('#exp', root);
  if (exp) exp.onclick = () => exportSheet(t('الدعم الفني'), [[t('رقم الطلب'), t('العميل'), t('الهاتف'), t('الموقع'), t('النوع'), t('الأولوية'), t('الحالة'), t('مُسند إلى'), t('موعد الزيارة'), t('تاريخ الطلب'), t('وصف المشكلة'), t('الحل')], ...shown.map(x => { const c = custById(x.customerId); return [x.no, c?.name || '', c?.phone1 || '', c ? custLocation(c) : '', tv(x.type), t(TICKET_PRIORITY[x.priority]), t(TICKET_STATUS[x.status]), userName(x.assignedTo), fmtDate(x.visitDate), fmtDate(x.createdAt), x.desc, x.resolution]; })]);
  const add = $('#add', root);
  if (add) add.onclick = () => openTicketForm(null, () => viewSupport(root));
  $('#q', root).oninput = e => { st.q = e.target.value; draw(); };
  $('#s', root).onchange = e => { st.status = e.target.value; viewSupport(root); };
  const prioX = $('#prioX', root);
  if (prioX) prioX.onclick = () => { st.prio = ''; viewSupport(root); };
  bindKpis(root, (k, on) => {
    if (on) { st.status = 'open'; st.prio = ''; }
    else if (k === 'urgent') { st.status = 'open'; st.prio = 'high'; }
    else { st.status = k; st.prio = ''; }
    viewSupport(root);
  });
  const as = $('#as', root);
  if (as) as.onchange = () => { st.assigned = as.value; draw(); };
  draw();
}
function openTicketForm(customerId, onDone) {
  const customers = visibleCustomers().filter(c => c.market === 'egypt').sort((a, b) => a.name.localeCompare(b.name, 'ar'));
  const preset = customerId ? custById(customerId) : null;
  if (preset && preset.market !== 'egypt') { toast(t('الدعم الفني متاح لعملاء مصر فقط'), 'err'); return; }
  const engineers = DB.users.filter(u => u.active && userCan(u, 'support.manage'));
  const m = openModal({
    title: t('طلب دعم جديد'),
    body: `<div class="field"><label>${t('العميل')} <span class="req">*</span></label><input class="inp" id="tc" list="tcl" value="${preset ? esc(`${preset.name} | ${preset.code}`) : ''}" placeholder="${t('عملاء مصر فقط')}"><datalist id="tcl">${customers.map(c => `<option value="${esc(`${c.name} | ${c.code}`)}">`).join('')}</datalist></div>
    <div class="grid2"><div class="field"><label>${t('نوع الطلب')}</label><select class="inp" id="tt">${optsT(DB.lists.ticketType, DB.lists.ticketType[0])}</select></div><div class="field"><label>${t('الأولوية')}</label><select class="inp" id="tp">${optsT(Object.entries(TICKET_PRIORITY), 'normal')}</select></div>
    ${can('support.manage') ? `<div class="field"><label>${t('إسناد إلى')}</label><select class="inp" id="ta">${opts(engineers.map(u => [u.id, u.name]), '', t('بدون إسناد'))}</select></div>` : ''}<div class="field"><label>${t('موعد الزيارة')}</label><input class="inp" type="date" id="tv" min="${today()}"></div></div>
    <div class="field"><label>${t('وصف المشكلة')} <span class="req">*</span></label><textarea class="inp" id="td" rows="4"></textarea></div>`,
    footer: `<button class="btn primary" id="sv">${t('إرسال الطلب')}</button>`,
  });
  $('#sv', m.el).onclick = () => {
    const code = ($('#tc', m.el).value.split('|')[1] || '').trim();
    const c = customers.find(x => x.code === code);
    if (!c) { toast(t('يرجى اختيار العميل من القائمة'), 'err'); return; }
    const desc = $('#td', m.el).value.trim();
    if (!desc) { toast(t('يرجى وصف المشكلة'), 'err'); return; }
    const tk = createTicket({ customerId: c.id, orderId: DB.orders.find(o => o.customerId === c.id)?.id || '', type: $('#tt', m.el).value, priority: $('#tp', m.el).value, desc, assignedTo: $('#ta', m.el)?.value || '', visitDate: $('#tv', m.el).value });
    m.close();
    toast(t('تم تسجيل طلب الدعم {no}', { no: tk.no }), 'ok');
    onDone && onDone();
  };
}
function openTicket(id, onDone) {
  const tk = DB.tickets.find(x => x.id === id);
  const c = custById(tk.customerId);
  const manage = can('support.manage') || tk.assignedTo === ME.id;
  const engineers = DB.users.filter(u => u.active && userCan(u, 'support.manage'));
  const m = openModal({
    title: t('طلب دعم {no}', { no: tk.no }), wide: true,
    body: `<div class="kv"><div><div class="k">${t('العميل')}</div><div class="val">${esc(c?.name)}</div></div><div><div class="k">${t('الهاتف')}</div><div class="val">${phoneLink(c?.phone1)}</div></div><div><div class="k">${t('العنوان')}</div><div class="val">${c ? esc(custAddress(c)) : ''}</div></div><div><div class="k">${t('النوع')}</div><div class="val">${esc(tv(tk.type))} ${priorityPill(tk.priority)}</div></div><div><div class="k">${t('الحالة')}</div><div class="val">${ticketPill(tk.status)}</div></div><div><div class="k">${t('أنشأه')}</div><div class="val">${esc(userName(tk.createdBy))} · ${fmtDT(tk.createdAt)}</div></div></div>
    <h4 class="mt">${t('وصف المشكلة')}</h4><p style="margin:4px 0">${esc(tk.desc)}</p>
    ${tk.resolution ? `<h4 class="mt">${t('الحل')}</h4><p style="margin:4px 0">${esc(tk.resolution)}</p>` : ''}
    ${manage ? `<div class="grid3 mt"><div class="field"><label>${t('الحالة')}</label><select class="inp" id="us">${optsT(Object.entries(TICKET_STATUS), tk.status)}</select></div><div class="field"><label>${t('إسناد إلى')}</label><select class="inp" id="ua" ${can('support.manage') ? '' : 'disabled'}>${opts(engineers.map(u => [u.id, u.name]), tk.assignedTo, t('بدون إسناد'))}</select></div><div class="field"><label>${t('موعد الزيارة')}</label><input class="inp" type="date" id="uv" value="${tk.visitDate || ''}"></div></div>
    <div class="field"><label>${t('تحديث أو حل')}</label><textarea class="inp" id="un" rows="3"></textarea></div>` : ''}
    ${tk.updates.length ? `<h4>${t('سجل التحديثات')}</h4><ul class="timeline">${tk.updates.map(u => `<li><div class="when">${fmtDT(u.at)} · ${esc(userName(u.userId))} · ${t(TICKET_STATUS[u.status])}</div>${esc(u.text)}</li>`).join('')}</ul>` : ''}`,
    footer: manage ? `<button class="btn primary" id="sv">${t('حفظ التحديث')}</button><button class="btn" id="ted">✎ ${t('تعديل التفاصيل')}</button>` : '',
  });
  const ted = $('#ted', m.el);
  if (ted) ted.onclick = () => { m.close(); openTicketEdit(tk.id, () => openTicket(tk.id, onDone)); };
  const sv = $('#sv', m.el);
  if (sv) sv.onclick = () => {
    const status = $('#us', m.el).value, note = $('#un', m.el).value.trim();
    if (['resolved', 'closed'].includes(status) && !note && !tk.resolution) { toast(t('يرجى كتابة الحل قبل إغلاق الطلب'), 'err'); return; }
    let assignedTo = $('#ua', m.el).value;
    const patch = { status, assignedTo, visitDate: $('#uv', m.el).value };
    if (status === 'new' && assignedTo) patch.status = 'assigned';
    if (['resolved', 'closed'].includes(status) && note) patch.resolution = note;
    updateTicket(tk, patch, note);
    m.close();
    toast(t('تم تحديث طلب الدعم'), 'ok');
    onDone && onDone();
  };
}

</script>
<script>
// العملاء المشترون، الموزعون، التنبيهات، ونوافذ تعديل التفاصيل، وأدوات التصدير وفلتر التاريخ المشتركة
const canExport = () => can('export.lists') || can('export.all');
function exportSheet(name, rows) {
  downloadBlob(buildXlsx([{ name, rows }]), `${name} ${today()}.xlsx`);
  audit('export', 'list', null, 'تصدير {name}: {n}', { name, n: rows.length - 1 });
  toast(t('تم تنزيل ملف يضم {n} صفًا', { n: rows.length - 1 }), 'ok');
}
// فلتر "من - إلى" بنفس الشكل في كل القوائم
const dateRangeHtml = (st, label) => `<span class="date-range"><span class="muted">${label || t('من')}</span><input class="inp" type="date" data-dr="from" value="${st.from || ''}" aria-label="${t('من تاريخ')}"><span class="muted">${t('إلى')}</span><input class="inp" type="date" data-dr="to" value="${st.to || ''}" aria-label="${t('إلى تاريخ')}"></span>`;
function bindDateRange(root, st, redraw) {
  $$('[data-dr]', root).forEach(el => el.onchange = () => { st[el.dataset.dr] = el.value; if ('page' in st) st.page = 1; redraw(); });
}
const inDateRange = (d, st) => { const s = String(d || '').slice(0, 10); return (!st.from || (s && s >= st.from)) && (!st.to || (s && s <= st.to)); };

// ------- التنبيهات -------
function viewNotifications(root) {
  const list = myNotifications();
  const kindLabel = { followup: 'متابعة جديدة', after: 'متابعة ما بعد البيع', ticket: 'تحديث دعم فني', assign: 'عميل أُسند إليك', share: 'عميل عُيّن لك للمتابعة المشتركة' };
  root.innerHTML = `<div class="page-head"><h1>${t('التنبيهات')}</h1><span class="spacer"></span>${list.length ? `<button class="btn" id="seen">✓ ${t('تحديد الكل كمقروء')}</button>` : ''}<div class="hint">${t('كل ما سجله غيرك على عملائك وعلى العملاء المشتركين: متابعات، ما بعد البيع، دعم فني، أو عملاء حُوّلوا أو عُيّنوا لك')}</div></div>
  ${list.length ? `<ul class="timeline card">${list.slice(0, 200).map(n => {
    const c = custById(n.customerId);
    return `<li class="click-li" data-c="${n.customerId}"><div class="when">${fmtDT(n.at)} · <b>${esc(userName(n.userId))}</b> · <span class="pill p-blue">${t(kindLabel[n.kind])}</span></div><div class="tl-title">${esc(c?.name || '')}</div>${n.text ? `<div>${esc(n.text)}</div>` : ''}</li>`;
  }).join('')}</ul>` : `<div class="card empty">${t('لا توجد تنبيهات جديدة')}</div>`}`;
  $$('[data-c]', root).forEach(li => li.onclick = () => openCustomer(li.dataset.c));
  const seen = $('#seen', root);
  if (seen) seen.onclick = () => { ME.notifSeenAt = nowStamp(); saveDB(); route(); };
}

// ------- العملاء المشترون -------
const buyersState = { q: '', rep: '', gov: '', follow: '', cls: '', from: '', to: '', page: 1, selected: new Set() };
function lastOrderOf(c) {
  return DB.orders.filter(o => o.customerId === c.id && countsAsSale(o)).sort((a, b) => b.date.localeCompare(a.date))[0];
}
function buyersList() {
  const st = buyersState, ids = buyerIds(), td = today(), q = st.q.trim().toLowerCase(), nq = normPhone(q);
  return visibleCustomers().filter(c => ids.has(c.id)).filter(c => {
    if (st.rep && !followedBy(c, st.rep)) return false;
    if (st.gov && (c.market !== 'egypt' || regionByCode(c.govCode)?.gov !== st.gov)) return false;
    if (st.cls && (st.cls === 'none' ? c.buyerClass : c.buyerClass !== st.cls)) return false;
    if (!inDateRange(purchaseDateOf(c), st)) return false;
    const due = afterDueOf(c);
    if (st.follow === 'today' && due !== td) return false;
    if (st.follow === 'late' && !(due && due < td)) return false;
    if (st.follow === 'none' && due) return false;
    if (q && !(c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || (nq && (normPhone(c.phone1).includes(nq) || normPhone(c.phone2).includes(nq))))) return false;
    return true;
  }).sort((a, b) => (afterDueOf(a) || '9').localeCompare(afterDueOf(b) || '9'));
}
const buyerRow = c => {
  const o = lastOrderOf(c);
  const dist = o?.distributorId ? DB.distributors.find(d => d.id === o.distributorId) : null;
  const lastAfter = DB.followups.find(f => f.customerId === c.id && f.phase === 'after');
  return { c, o, device: o ? o.items.map(i => `${deviceName(i.type, i.size)} ×${i.qty}`).join(' + ') : deviceName(c.deviceType, c.deviceSize), date: purchaseDateOf(c), dist: dist?.name || '', last: lastAfter?.text || '', due: afterDueOf(c) };
};
function viewBuyers(root) {
  const st = buyersState;
  const all = buyersList(), td = today();
  // أرقام الأعلى تُحسب دون فلتر المتابعة، حتى تبقى ثابتة عند الضغط عليها
  const follow = st.follow; st.follow = '';
  const base = follow ? buyersList() : all;
  st.follow = follow;
  const pages = Math.max(1, Math.ceil(all.length / PAGE_SIZE));
  st.page = Math.min(st.page, pages);
  const rows = all.slice((st.page - 1) * PAGE_SIZE, st.page * PAGE_SIZE).map(buyerRow);
  const assign = can('customers.assign');
  root.innerHTML = `<div class="page-head"><h1>${t('العملاء المشترون')}</h1><span class="spacer"></span>
    ${can('customers.import') ? `<button class="btn" id="imp">⬆ ${t('رفع ملف إكسيل')}</button>` : ''}${canExport() ? `<button class="btn" id="exp">⬇ ${t('تصدير')}</button>` : ''}
    <div class="hint">${t('متابعة مستقلة لمن اشترى بالفعل، بموعد منفصل عن متابعة البيع')}</div></div>
  <div class="kpis">
    ${kpiBtn('all', t('العملاء المشترون'), base.length, '', !st.follow)}
    ${kpiBtn('today', t('متابعات اليوم'), base.filter(c => afterDueOf(c) === td).length, 'warn', st.follow === 'today')}
    ${kpiBtn('late', t('متابعات متأخرة'), base.filter(c => afterDueOf(c) && afterDueOf(c) < td).length, base.some(c => afterDueOf(c) && afterDueOf(c) < td) ? 'alert' : 'ok', st.follow === 'late')}
    ${kpiBtn('none', t('بلا موعد متابعة'), base.filter(c => !afterDueOf(c)).length, '', st.follow === 'none')}
  </div>
  <div class="chips" style="margin-bottom:10px">${BUYER_CLASSES.map(k => `<button class="chip ${st.cls === k ? 'on' : ''}" data-cls="${k}" dir="ltr">${k}: ${all.filter(c => c.buyerClass === k).length}</button>`).join('')}<button class="chip ${st.cls === 'none' ? 'on' : ''}" data-cls="none">${t('بدون تصنيف')}: ${all.filter(c => !c.buyerClass).length}</button></div>
  <div class="filters jump-target" id="kpi-list"><input class="inp search" id="q" placeholder="${t('ابحث بالاسم أو الرقم أو الكود')}" value="${esc(st.q)}"><select class="inp" id="gov" aria-label="${t('المحافظة')}">${govOptions(st.gov)}</select>${can('customers.view_all') ? `<select class="inp" id="rep" aria-label="${t('رجل البيع')}">${repOptions(st.rep)}</select>` : ''}<select class="inp" id="follow" aria-label="${t('المتابعة')}">${optsT([['today', 'متابعات اليوم'], ['late', 'متأخرة'], ['none', 'بلا موعد متابعة']], st.follow, t('جميع المتابعات'))}</select>${dateRangeHtml(st, t('تاريخ الشراء من'))}</div>
  ${assign ? `<div class="bulk-bar" id="bulk" ${st.selected.size ? '' : 'hidden'}><b id="selN"></b><select class="inp" id="toRep" aria-label="${t('رجل البيع')}">${repOptions('', t('اختر رجل البيع'))}</select><button class="btn primary" id="doMove">${t('تحويل المحدد')}</button><button class="btn" id="clr">${t('إلغاء التحديد')}</button></div>` : ''}
  ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${assign ? `<th><input type="checkbox" id="all" aria-label="${t('تحديد الكل')}"></th>` : ''}<th class="sticky-col">${t('الاسم')}</th><th>${t('تصنيف العميل المشتري')}</th><th>${t('الهاتف')}</th><th>${t('الموقع')}</th><th>${t('الجهاز')}</th><th>${t('تاريخ الشراء')}</th><th>${t('الموزع')}</th><th>${t('رجل البيع')}</th><th>${t('آخر متابعة بعد البيع')}</th><th>${t('المتابعة القادمة')}</th><th></th></tr></thead><tbody>${rows.map(r => `<tr class="click" data-id="${r.c.id}">${assign ? `<td><input type="checkbox" data-sel="${r.c.id}" ${st.selected.has(r.c.id) ? 'checked' : ''} aria-label="${t('تحديد')}"></td>` : ''}<td class="sticky-col">${esc(r.c.name)} ${r.c.rating === 'مميز' ? ratingPill(r.c.rating) : ''}</td><td>${can('customers.edit') ? `<select class="inp" style="width:auto;min-height:0;padding:2px 6px" data-bcls="${r.c.id}" aria-label="${t('تصنيف العميل المشتري')}">${opts(BUYER_CLASSES, r.c.buyerClass || '', '—')}</select>` : buyerClassPill(r.c.buyerClass)}</td><td>${phoneLink(r.c.phone1)}</td><td>${esc(custLocation(r.c))}</td><td class="wrap">${esc(r.device)}</td><td>${fmtDate(r.date)}</td><td>${esc(r.dist)}</td><td>${esc(userName(r.c.ownerId))}</td><td class="wrap">${esc(r.last.slice(0, 70))}</td><td>${followPill(r.due)}</td><td>${can('followups.add') ? `<button class="btn sm primary" data-fu="${r.c.id}">${t('متابعة')}</button>` : ''}${assign ? ` <button class="btn sm" data-mv="${r.c.id}">${t('تحويل')}</button>` : ''}</td></tr>`).join('')}</tbody></table>
    <div class="pager"><button class="btn sm" id="prev" ${st.page <= 1 ? 'disabled' : ''}>${t('السابق')}</button><span>${t('صفحة {a} من {b}', { a: st.page, b: pages })} · ${t('العملاء: {n}', { n: all.length })}</span><button class="btn sm" id="next" ${st.page >= pages ? 'disabled' : ''}>${t('التالي')}</button></div></div>` : `<div class="card empty">${t('لا يوجد عملاء مطابقون.')}</div>`}`;
  const redraw = () => viewBuyers(root);
  const on = (sel, fn) => { const el = $(sel, root); if (el) el.onclick = fn; };
  $('#q', root).oninput = e => { st.q = e.target.value; st.page = 1; clearTimeout(st.qt); st.qt = setTimeout(() => { redraw(); const q = $('#q', root); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 300); };
  ['gov', 'rep', 'follow'].forEach(k => { const el = $('#' + k, root); if (el) el.onchange = () => { st[k] = el.value; st.page = 1; redraw(); }; });
  bindDateRange(root, st, redraw);
  on('#prev', () => { st.page--; redraw(); });
  on('#next', () => { st.page++; redraw(); });
  on('#imp', () => openBuyersImport(redraw));
  bindKpis(root, (k, on) => { st.follow = on || k === 'all' ? '' : k; st.page = 1; redraw(); });
  $$('[data-cls]', root).forEach(b => b.onclick = () => { st.cls = st.cls === b.dataset.cls ? '' : b.dataset.cls; st.page = 1; redraw(); });
  $$('[data-bcls]', root).forEach(s => {
    s.onclick = e => e.stopPropagation();
    s.onchange = () => { updateCustomer(s.dataset.bcls, { buyerClass: s.value }); toast(t('تم حفظ التصنيف'), 'ok'); };
  });
  on('#exp', () => exportSheet(t('العملاء المشترون'), [[t('كود العميل'), t('الاسم'), t('تصنيف العميل المشتري'), t('رقم الهاتف 1'), t('رقم الهاتف 2'), t('الموقع'), t('الجهاز'), t('تاريخ الشراء'), t('الموزع'), t('رجل البيع'), t('آخر متابعة بعد البيع'), t('المتابعة القادمة')], ...all.map(buyerRow).map(r => [r.c.code, r.c.name, r.c.buyerClass || '', r.c.phone1, r.c.phone2, custLocation(r.c), r.device.replace(/[⁦-⁩]/g, ''), fmtDate(r.date), r.dist, userName(r.c.ownerId), r.last, fmtDate(r.due)])]));
  $$('tr.click', root).forEach(tr => tr.onclick = e => { if (e.target.closest('input,button,a,select')) return; openCustomer(tr.dataset.id, 'after'); });
  $$('[data-fu]', root).forEach(b => b.onclick = e => { e.stopPropagation(); openFollowup(b.dataset.fu, { phase: 'after', onDone: redraw }); });
  $$('[data-mv]', root).forEach(b => b.onclick = e => { e.stopPropagation(); openTransfer([b.dataset.mv], redraw); });
  const syncBulk = () => { const bar = $('#bulk', root); if (!bar) return; bar.hidden = !st.selected.size; $('#selN', root).textContent = t('المحدد: {n}', { n: st.selected.size }); };
  $$('[data-sel]', root).forEach(cb => cb.onchange = () => { cb.checked ? st.selected.add(cb.dataset.sel) : st.selected.delete(cb.dataset.sel); syncBulk(); });
  const allCb = $('#all', root);
  if (allCb) allCb.onchange = () => { rows.forEach(r => allCb.checked ? st.selected.add(r.c.id) : st.selected.delete(r.c.id)); redraw(); };
  on('#clr', () => { st.selected.clear(); redraw(); });
