<!-- تثبيت النظام كتطبيق على الموبايل والكمبيوتر؛ الملفات في مجلد pwa وتُنشر بجوار الصفحة -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0D1A4D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Delta CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- الخط يُحمَّل دون أن يؤخر ظهور الصفحة -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --navy: #0D1A4D; --navy-mid: #123F7D; --blue-deep: #0B2F5D; --teal: #0D74A7; --cyan: #2FC2F0; --cyan-bar: #29ABE2;
  --bg: #F3F6FA; --card: #FFFFFF; --card-soft: #F6F9FC; --border: #E2E8F2; --text: #293562; --muted: #61698B;
  --green: #2E8B57; --orange: #E0891A; --red: #C62828; --blue: #1565C0;
  --green-bg: #EAF7EE; --orange-bg: #FFF4E6; --red-bg: #FDECEA; --blue-bg: #EEF8FD;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --radius: 10px; --shadow: 0 1px 3px rgba(13,26,77,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
h1, h2, h3, h4 { margin: 0; color: var(--navy); line-height: 1.3; }
a { color: var(--teal); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
.num, .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* تسجيل الدخول */
.login-page { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: linear-gradient(150deg, #0A1542, #123F7D 55%, #0D74A7); }
.login-card { background: #fff; border-radius: 16px; padding: 32px; width: 100%; max-width: 410px; box-shadow: 0 20px 50px rgba(5,15,50,.35); }
.wordmark { font-weight: 800; font-size: 26px; color: var(--navy); direction: ltr; letter-spacing: -.5px; }
.wordmark b { color: var(--cyan-bar); font-weight: 800; }
.login-card .sub { color: var(--muted); margin-bottom: 22px; }
.demo-box { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--border); }
.demo-box p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
.demo-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.err-msg { color: var(--red); background: var(--red-bg); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; }

/* الهيكل */
.shell { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
.side { background: var(--navy); color: #fff; padding: 18px 12px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.side .wordmark { color: #fff; font-size: 22px; padding: 0 8px; }
.side .tag { color: #9fb4d8; font-size: 11.5px; padding: 0 8px 14px; }
.nav-group { color: #7f93bd; font-size: 11.5px; margin: 12px 8px 4px; font-weight: 600; }
.nav-link { display: flex; align-items: center; gap: 9px; padding: 8px 10px; color: #d7e0f2; border-radius: 8px; border-inline-start: 3px solid transparent; margin-bottom: 2px; font-weight: 500; }
.nav-link:hover { background: rgba(255,255,255,.07); color: #fff; }
.nav-link.on { background: rgba(47,194,240,.15); color: #fff; border-inline-start-color: var(--cyan); }
.nav-link .ic { width: 18px; text-align: center; }
.nav-link .cnt { margin-inline-start: auto; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 10px; }
.side-user { margin-top: auto; padding: 12px 8px 0; border-top: 1px solid rgba(255,255,255,.12); font-size: 12.5px; }
.side-user b { display: block; color: #fff; }
.side-user span { color: #9fb4d8; }
.side-user .row { display: flex; gap: 6px; margin-top: 8px; }
.side-user button { flex: 1; background: rgba(255,255,255,.1); color: #fff; border: 0; border-radius: 6px; padding: 5px; cursor: pointer; font-size: 12px; }
.side-user button:hover { background: rgba(255,255,255,.2); }
.main { min-width: 0; padding: 20px 24px 50px; }
.page-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.page-head h1 { font-size: 22px; font-weight: 800; }
.page-head .hint { color: var(--muted); font-size: 13px; width: 100%; margin-top: -8px; }
.spacer { flex: 1; }
.demo-banner { background: var(--orange-bg); border-inline-start: 4px solid var(--orange); padding: 8px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
.call-banner { position: sticky; top: 8px; z-index: 40; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }

/* أزرار وحقول */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--border); background: #fff; color: var(--navy); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--card-soft); }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: #0b6490; }
.btn.navy { background: var(--navy); border-color: var(--navy); color: #fff; }
.btn.danger { color: var(--red); border-color: #f2c5c5; }
.btn.danger:hover { background: var(--red-bg); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn.call { background: var(--green); border-color: var(--green); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible, .inp:focus-visible, .nav-link:focus-visible { outline: 2px solid var(--cyan-bar); outline-offset: 1px; }
.inp { width: 100%; border: 1px solid #cdd6e6; background: #fff; border-radius: 8px; padding: 7px 10px; min-height: 37px; }
.inp:focus { outline: 2px solid var(--cyan-bar); outline-offset: -1px; border-color: transparent; }
textarea.inp { resize: vertical; min-height: 80px; }
.field { margin-bottom: 12px; min-width: 0; }
.field label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 3px; color: var(--navy); }
.field .req { color: var(--red); }
.field small { color: var(--muted); font-size: 12px; }
.field small.bad { color: var(--red); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 0 14px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters .inp { width: auto; max-width: 200px; }
.filters .inp.search { width: 260px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid #cdd6e6; background: #fff; padding: 3px 12px; border-radius: 16px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--text); }
.chip:hover { background: var(--card-soft); }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip .x { opacity: .7; margin-inline-start: 4px; }
.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--border); margin-bottom: 14px; flex-wrap: wrap; }
.tab { padding: 7px 14px; background: none; border: 0; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tab.on { color: var(--navy); border-bottom-color: var(--teal); }
.tab .c { font-size: 12px; color: var(--muted); font-weight: 500; }

/* بطاقات */
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
.card > h3 { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
.card > .sub { color: var(--muted); font-size: 12.5px; margin: -8px 0 10px; }
.section-bar { background: var(--navy); color: #fff; padding: 8px 14px; border-radius: 8px; border-inline-start: 6px solid var(--cyan-bar); font-weight: 700; margin: 6px 0 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; box-shadow: var(--shadow); }
.kpi .l { color: var(--muted); font-size: 12.5px; }
.kpi .v { font-size: 23px; font-weight: 800; color: var(--navy); line-height: 1.3; }
.kpi .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
.kpi .d { font-size: 12px; color: var(--muted); }
.kpi .d .up { color: var(--green); font-weight: 700; }
.kpi .d .down { color: var(--red); font-weight: 700; }
.kpi.alert { border-inline-start: 4px solid var(--red); }
.kpi.ok { border-inline-start: 4px solid var(--green); }
.kpi.warn { border-inline-start: 4px solid var(--orange); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
.empty { color: var(--muted); text-align: center; padding: 24px 12px; }

/* الجداول */
.tbl-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { background: var(--navy); color: #fff; padding: 8px 10px; font-weight: 600; white-space: nowrap; text-align: start; position: sticky; top: 0; }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td.wrap { white-space: normal; min-width: 170px; }
.tbl tbody tr:nth-child(even) { background: var(--card-soft); }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: #e8f3fb; }
.tbl tr.season td:first-child { border-inline-start: 4px solid var(--s4); }
.tbl tr.season { background: #fffaf0 !important; }
.tbl .sticky-col { position: sticky; inset-inline-start: 0; background: inherit; z-index: 1; font-weight: 700; color: var(--navy); }
.tbl tbody tr .sticky-col { background: #fff; }
.tbl tbody tr:nth-child(even) .sticky-col { background: var(--card-soft); }
.tbl tbody tr.season .sticky-col { background: #fffaf0; }
.tbl th.sticky-col { background: var(--navy); color: #fff; z-index: 2; }
.tbl th.grp { background: var(--navy-mid); text-align: center; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; color: var(--muted); }

/* شارات */
.pill { display: inline-flex; align-items: center; gap: 3px; padding: 1px 9px; border-radius: 11px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.r-1 { background: #0D1A4D; color: #fff; }
.r-2 { background: #d5ecf9; color: #0B2F5D; }
.r-3 { background: #e9eef6; color: #293562; }
.r-4 { background: #fff; color: var(--muted); border: 1px dashed #b5bdd2; }
.p-green { background: var(--green-bg); color: #1f6d42; }
.p-orange { background: var(--orange-bg); color: #9c5c08; }
.p-red { background: var(--red-bg); color: var(--red); }
.p-blue { background: var(--blue-bg); color: var(--blue); }
.p-gray { background: #eef1f7; color: var(--muted); }
.p-plant { background: #e2f5e9; color: #1f6d42; }
.p-harvest { background: #fdf0d5; color: #8a5a00; }
.code-tag { font-family: Consolas, monospace; font-size: 12px; background: #eef1f7; padding: 0 6px; border-radius: 4px; direction: ltr; display: inline-block; color: var(--navy); }

/* نوافذ */
.modal-back { position: fixed; inset: 0; background: rgba(10,21,66,.5); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 30px 14px; overflow-y: auto; }
.modal { background: #fff; border-radius: 14px; width: 100%; max-width: 620px; box-shadow: 0 24px 60px rgba(5,15,50,.4); }
.modal.wide { max-width: 880px; }
.modal-h { padding: 13px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.modal-h h3 { font-size: 16px; font-weight: 800; flex: 1; }
.modal-x { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
.modal-b { padding: 16px 18px; }
.modal-f { padding: 11px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-start; flex-wrap: wrap; }
.drawer-back { position: fixed; inset: 0; background: rgba(10,21,66,.4); z-index: 90; }
.drawer { position: fixed; top: 0; bottom: 0; inset-inline-end: 0; width: min(700px, 100%); background: var(--bg); z-index: 91; overflow-y: auto; box-shadow: 8px 0 40px rgba(5,15,50,.3); }
.drawer-h { background: var(--navy); color: #fff; padding: 14px 18px; position: sticky; top: 0; z-index: 3; }
.drawer-h h2 { color: #fff; font-size: 19px; }
.drawer-h .meta { color: #b9c8e6; font-size: 12.5px; }
.drawer-b { padding: 14px 18px; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 16px; }
.kv > div { min-width: 0; }
.kv .k { color: var(--muted); font-size: 12px; }
.kv .val { font-weight: 600; color: var(--navy); overflow-wrap: anywhere; }
.steps { display: flex; gap: 4px; margin-bottom: 16px; }
.step { flex: 1; text-align: center; padding: 6px 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); border-bottom: 3px solid var(--border); }
.step.on { color: var(--navy); border-color: var(--teal); }
.step.done { color: var(--green); border-color: var(--green); }

/* الفويس */
.mic-box { text-align: center; padding: 8px 0 12px; }
.mic { width: 78px; height: 78px; border-radius: 50%; border: 0; background: var(--teal); color: #fff; font-size: 30px; cursor: pointer; box-shadow: 0 4px 14px rgba(13,116,167,.4); }
.mic.rec { background: var(--red); animation: pulse 1.3s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(198,40,40,.5); } 100% { box-shadow: 0 0 0 20px rgba(198,40,40,0); } }
@media (prefers-reduced-motion: reduce) { .mic.rec { animation: none; } }
.mic-status { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 20px; }

/* زمن المتابعات */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { border-inline-start: 3px solid var(--border); padding-block: 0 12px; padding-inline: 12px 0; position: relative; }
.timeline li::before { content: ''; position: absolute; inset-inline-start: -6.5px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
.timeline .when { color: var(--muted); font-size: 12px; }
.change { font-size: 12.5px; color: var(--muted); }
.change del { color: var(--red); }
.change ins { color: var(--green); text-decoration: none; font-weight: 600; }

/* الكاليندر */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-h { text-align: center; font-weight: 700; color: var(--muted); font-size: 12.5px; padding: 3px; }
.cal-d { background: #fff; border: 1px solid var(--border); border-radius: 8px; min-height: 78px; padding: 5px 7px; cursor: pointer; text-align: start; display: block; width: 100%; }
.cal-d:hover { border-color: var(--teal); }
.cal-d.out { background: transparent; border-color: transparent; cursor: default; }
.cal-d.today { border: 2px solid var(--teal); }
.cal-d.sel { background: #e8f3fb; }
.cal-d .n { font-weight: 700; color: var(--navy); }
.cal-d .ev { display: block; font-size: 11.5px; border-radius: 4px; padding: 0 5px; margin-top: 2px; font-weight: 600; }
.ev.f { background: #d5ecf9; color: #0B2F5D; }
.ev.l { background: var(--red-bg); color: var(--red); }
.ev.i { background: var(--orange-bg); color: #9c5c08; }

/* الرسوم */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 210px; border-bottom: 1px solid #c9d2e2; background-image: repeating-linear-gradient(to top, transparent 0 51.5px, #eef1f7 51.5px 52.5px); }
.bar-col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; cursor: default; }
.bar-col:hover .bar { filter: brightness(1.15); }
.bar { width: 62%; max-width: 40px; background: var(--teal); border-radius: 4px 4px 0 0; min-height: 2px; }
.bar.cur { background: var(--navy); }
.bar-val { font-size: 11px; color: var(--muted); margin-bottom: 2px; white-space: nowrap; }
.bar-labels { display: flex; gap: 2px; margin-top: 4px; }
.bar-labels span { flex: 1; min-width: 0; text-align: center; font-size: 11.5px; color: var(--muted); overflow: hidden; white-space: nowrap; }
.hb { display: grid; grid-template-columns: minmax(70px, 34%) 1fr auto; gap: 4px 8px; align-items: center; font-size: 13px; }
.hb .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb .track { height: 15px; background: #f1f4f9; border-radius: 4px; overflow: hidden; }
.hb .fill { height: 100%; background: var(--teal); border-start-end-radius: 4px; border-end-end-radius: 4px; min-width: 2px; }
.hb .val { font-weight: 700; color: var(--navy); font-size: 12.5px; text-align: end; }
.stack { display: flex; gap: 2px; height: 22px; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.stack > div { min-width: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; }
details.tv { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
details.tv summary { cursor: pointer; }
details.tv table { width: 100%; border-collapse: collapse; margin-top: 6px; }
details.tv td, details.tv th { padding: 2px 6px; border-bottom: 1px solid var(--border); text-align: start; }
#tip { position: fixed; z-index: 300; background: var(--navy); color: #fff; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; pointer-events: none; max-width: 280px; white-space: pre-line; }

/* مصفوفة المحاصيل */
.matrix th, .matrix td { text-align: center; padding: 5px 6px; }
.matrix td:first-child, .matrix th:first-child { text-align: start; position: sticky; inset-inline-start: 0; background: #fff; z-index: 1; font-weight: 700; color: var(--navy); }
.matrix th:first-child { background: var(--navy); color: #fff; z-index: 2; }
.matrix th.cur { background: var(--teal); }
.m-cell { display: inline-block; min-width: 40px; border-radius: 5px; font-size: 11.5px; font-weight: 700; padding: 1px 3px; }
.m-p { background: #d9f2e2; color: #1f6d42; }
.m-h { background: #fdeabf; color: #8a5a00; }
.m-b { background: linear-gradient(90deg, #fdeabf 50%, #d9f2e2 50%); color: var(--navy); }
.m-n { color: #cbd2e0; }
.matrix.edit .m-cell { cursor: pointer; }
.season-card { border: 1px solid var(--border); background: #fff; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.season-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 9px 14px; cursor: pointer; background: none; border: 0; width: 100%; text-align: start; }
.season-head:hover { background: var(--card-soft); }
.season-head b { color: var(--navy); font-size: 15px; }
.season-head .count { margin-inline-start: auto; font-weight: 800; color: var(--navy); }
.season-body { padding: 0 14px 12px; }

#toasts { position: fixed; bottom: 18px; inset-inline-end: 18px; z-index: 400; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--navy); color: #fff; padding: 9px 16px; border-radius: 9px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 340px; }
.toast.ok { background: var(--green); }
.toast.err { background: var(--red); }
.mail-prev { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: var(--card-soft); }
.muted { color: var(--muted); }
.mt { margin-top: 10px; }
.mobile-bar { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset-inline-start: 0; width: 240px; z-index: 80; transform: translateX(100%); transition: transform .2s; } [dir="ltr"] .side { transform: translateX(-100%); } [dir="ltr"] .side.open { transform: none; }
  .side.open { transform: none; }
  .main { padding: 12px 16px 50px; }
  .mobile-bar { display: flex; align-items: center; gap: 10px; background: var(--navy); color: #fff; padding: 8px 16px; position: sticky; top: 0; z-index: 70; }
  .mobile-bar button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  .mobile-bar .wordmark { color: #fff; font-size: 18px; }
  .cols2, .cols3, .grid3 { grid-template-columns: 1fr; }
  .cal-d { min-height: 60px; padding: 3px; }
  .cal-d .ev { font-size: 10px; padding: 0 2px; }
  .filters .inp, .filters .inp.search { width: 100%; max-width: none; }
}
@media (max-width: 560px) { .grid2, .kv { grid-template-columns: 1fr; } }

/* عناصر الصفحات الجديدة */
.notice-bar { display: flex; align-items: center; gap: 8px; background: #EAF3FF; border: 1px solid #C9DDF8; color: var(--navy); padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; font-weight: 700; text-decoration: none; }
.notice-bar:hover { background: #DCEBFF; }
.notice-bar.after { background: #EAF7EF; border-color: #C3E6CF; color: #17663a; }
.bulk-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--navy); color: #fff; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; position: sticky; top: 8px; z-index: 20; }
.bulk-bar[hidden] { display: none; }
.bulk-bar .inp { width: auto; min-width: 170px; }
.date-range { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.date-range .inp { width: auto; min-width: 140px; }
.click-li { cursor: pointer; }
.click-li:hover { background: var(--card-soft); }
.chk { display: flex; align-items: center; gap: 8px; margin-top: 6px; cursor: pointer; }
.chk input { width: 18px; height: 18px; }
.side-back { display: none; }
body.no-scroll { overflow: hidden; }
/* لا تمرير متحرك عند الانتقال بين الصفحات، فهو يسبب اهتزاز الصفحة على الموبايل */
html { -webkit-text-size-adjust: 100%; }
.tbl-wrap { -webkit-overflow-scrolling: touch; }

/* الموبايل: لمسات أكبر، نوافذ بملء الشاشة، وقائمة جانبية فوق الصفحة */
@media (max-width: 900px) {
  .side-back { display: block; position: fixed; inset: 0; background: rgba(10,21,66,.45); z-index: 75; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .side-back.on { opacity: 1; pointer-events: auto; }
  .side { width: min(290px, 84vw); box-shadow: 0 0 40px rgba(0,0,0,.3); }
  .nav-link { padding-block: 11px; }
  .page-head { flex-wrap: wrap; gap: 8px; }
  .page-head h1 { font-size: 19px; }
  .page-head .btn { flex: 1 1 auto; }
  .date-range { width: 100%; }
  .date-range .inp { flex: 1; min-width: 0; }
  .bulk-bar .inp { flex: 1; min-width: 0; }
}
@media (max-width: 640px) {
  .inp, select.inp, textarea.inp { font-size: 16px; min-height: 42px; }
  .btn { min-height: 40px; }
  .btn.sm { min-height: 34px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: 8px; }
  .kpi .v { font-size: 20px; }
  /* النافذة تطول مع محتواها فتبقى الخلفية البيضاء خلف كل الحقول عند التمرير */
  .modal-back { padding: 0; display: block; background: #fff; overscroll-behavior: contain; }
  .modal, .modal.wide { max-width: none; min-height: 100%; height: auto; border-radius: 0; display: flex; flex-direction: column; box-shadow: none; }
  .modal-h { position: sticky; top: 0; background: #fff; z-index: 2; }
  .modal-b { flex: 1; }
  .modal-f { position: sticky; bottom: 0; background: #fff; z-index: 2; padding-bottom: calc(11px + env(safe-area-inset-bottom)); }
  .modal-f .btn { flex: 1 1 auto; }
  .modal-x { font-size: 28px; padding: 4px 8px; }
  .tbl th, .tbl td { padding: 8px 7px; }
  .toast { max-width: calc(100vw - 32px); }
}

/* Ø§Ù„Ø´Ø¹Ø§Ø± */
.logo-plate { background: #fff; border-radius: 10px; padding: 8px 10px; margin-bottom: 12px; display: block; }
.logo-plate img { display: block; width: 100%; height: auto; }
.logo-plate.sm { padding: 3px 7px; margin: 0; width: 104px; border-radius: 7px; }
.login-logo { display: block; width: 100%; max-width: 270px; height: auto; margin: 0 auto 6px; }
.login-card .sub { text-align: center; }
.login-top { display: flex; margin-bottom: 8px; }
.lang-btn { border: 1px solid var(--border); background: #fff; border-radius: 7px; padding: 3px 12px; cursor: pointer; font-weight: 600; color: var(--navy); font-size: 13px; }
.lang-btn:hover { background: var(--card-soft); }
.side-user .row button { padding: 5px 2px; }
.nav-link { font-size: 13.5px; padding: 7px 10px; }

/* Ù…Ø³Ø§Ø± Ø§Ù„Ø¹Ù…ÙŠÙ„ */
.journey { display: flex; flex-wrap: wrap; gap: 6px 2px; align-items: stretch; }
.j-step { flex: 1 1 86px; min-width: 86px; text-align: center; padding: 4px 3px; position: relative; color: var(--muted); }
.j-step b { display: block; font-size: 12px; font-weight: 600; line-height: 1.25; margin: 3px 0 1px; }
.j-step small { display: block; font-size: 10.5px; line-height: 1.25; color: var(--muted); }
.j-dot { display: inline-flex; width: 25px; height: 25px; align-items: center; justify-content: center; border-radius: 50%; background: #eef1f7; color: var(--muted); font-weight: 700; font-size: 12px; border: 2px solid #d5dcea; }
.j-step.done .j-dot { background: var(--green); border-color: var(--green); color: #fff; }
.j-step.done b { color: var(--text); }
.j-step.cur .j-dot { background: var(--navy); border-color: var(--cyan-bar); color: #fff; }
.j-step.cur b { color: var(--navy); font-weight: 800; }
.j-step.cur.lost .j-dot { background: var(--red); border-color: var(--red); }
.j-step.cur.won .j-dot { background: var(--green); border-color: #7fd0a4; }
.j-sep { flex: 0 0 100%; display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.j-sep::after { content: ''; flex: 1; border-top: 2px dashed #bfe6f5; }
.j-sep span { font-size: 11.5px; color: var(--teal); font-weight: 700; }
.tl-title { font-weight: 700; color: var(--navy); font-size: 13.5px; }
.p-after { background: #e4f4fb; color: #0B5F88; }
.stars { color: #e6a100; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: #dfe4ee; }

/* Ù„ÙˆØ­Ø© Ø§Ù„Ù…Ø³Ø§Ø± */
.board { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; align-items: flex-start; }
.board-col { flex: 0 0 224px; background: #e9eef6; border-radius: 10px; padding: 8px; }
.board-col.aftersales { background: #e2f3fa; }
.board-col.won { background: #e3f4e9; }
.board-col.lost { background: #f8e9e8; }
.board-col header { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; color: var(--navy); font-size: 13px; }
.board-col header .n { margin-inline-start: auto; background: #fff; border-radius: 10px; padding: 0 8px; font-weight: 700; }
.board-list { display: flex; flex-direction: column; gap: 6px; }
.board-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; text-align: start; cursor: pointer; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px; }
.board-card:hover { border-color: var(--teal); }
.board-card b { color: var(--navy); }

/* Ø§Ù„ØµÙ„Ø§Ø­ÙŠØ§Øª */
.perm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.perm-group { border: 1px solid var(--border); border-radius: 9px; padding: 6px 12px 10px; margin: 0; min-width: 0; }
.perm-group legend { font-weight: 700; color: var(--navy); padding: 0 6px; font-size: 13px; }
.perm { display: flex; gap: 7px; align-items: flex-start; padding: 3px 0; font-size: 13px; cursor: pointer; }
.perm input { margin-top: 4px; accent-color: var(--teal); }
.perm.locked { color: var(--muted); cursor: not-allowed; }
.section-sub { font-weight: 700; color: var(--navy); margin: 8px 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 8px; border-top: 1px solid var(--border); }
.row-card { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row-card .grow { flex: 1; min-width: 220px; }
.kpi.link { display: block; color: inherit; }
.kpi.link:hover { border-color: var(--teal); }
.danger-bar { background: var(--red); border-inline-start-color: #7d1818; }
.ev.a { background: #e4f4fb; color: #0B5F88; }
.bar-labels span { font-size: 11px; }
.field[hidden] { display: none; }
@media (max-width: 900px) { .perm-grid { grid-template-columns: 1fr; } .board-col { flex-basis: 200px; } .j-step { flex-basis: 76px; min-width: 76px; } }
.wordmark.wm-login { text-align: center; font-size: 30px; margin-bottom: 6px; }
.wordmark.wm-plate { display: block; color: var(--navy); text-align: center; font-size: 21px; padding: 0; }
.wordmark.wm-sm { display: block; color: var(--navy); font-size: 15px; text-align: center; }

/* تعيين العملاء المشتركين */
.share-list { max-height: 340px; overflow: auto; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
.share-list .tbl { margin: 0; }
.share-list thead th { position: sticky; top: 0; z-index: 1; }
.x-btn { border: 0; background: transparent; color: inherit; cursor: pointer; font-size: 15px; line-height: 1; padding: 0 2px; opacity: .7; }
.x-btn:hover { opacity: 1; color: var(--red); }

/* شاشة التحميل حتى تصل البيانات */
.boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 14px; background: var(--navy); color: #cfe0f7; font-size: 14px; }
.boot img { width: 190px; height: auto; background: #fff; border-radius: 12px; padding: 10px 14px; }
.boot .spin { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.25); border-top-color: var(--cyan); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .boot .spin { animation-duration: 2.4s; } }

/* لا تنزلق الصفحة جانبيًا: الجداول العريضة تُمرَّر داخل إطارها فقط */
@supports (overflow: clip) { html, body { overflow-x: clip; } }
.card { overflow-x: auto; }
.ftog { display: none; }
.more-filters { display: contents; }

@media (max-width: 900px) {
  /* القائمة الجانبية بطول الشاشة الظاهرة فعلًا، فيظهر زر الخروج فوق شريط المتصفح */
  .side { height: 100vh; height: 100dvh; padding-bottom: calc(28px + env(safe-area-inset-bottom)); overscroll-behavior: contain; visibility: hidden; transition: transform .2s, visibility 0s linear .2s; }
  .side.open { visibility: visible; transition: transform .2s; }
  /* ملف العميل: الأزرار والمسار والتبويبات في سطر واحد يُمرَّر أفقيًا بدل أن تأخذ نصف الشاشة */
  .drawer-h { padding: 10px 14px; }
  .drawer-h .chips { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .drawer-h .chips .btn { flex: 0 0 auto; }
  .drawer-b { padding: 10px 12px; }
  .drawer .journey { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .drawer .tabs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; position: sticky; top: var(--dh, 0); background: var(--bg); z-index: 2; }
  .drawer .tab { white-space: nowrap; flex: 0 0 auto; }
}

@media (max-width: 640px) {
  .ftog { display: inline-flex; }
  .more-filters { display: none; width: 100%; }
  .more-filters.open { display: flex; flex-wrap: wrap; gap: 8px; }
  /* جداول العملاء والمتابعات تظهر كبطاقات، كل خانة بعنوانها */
  .tbl-wrap:has(td[data-label]) { background: none; border: 0; box-shadow: none; overflow: visible; }
  .tbl:has(td[data-label]), .tbl:has(td[data-label]) tbody { display: block; width: 100%; }
  .tbl:has(td[data-label]) thead { display: none; }
  .tbl:has(td[data-label]) tr { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; box-shadow: var(--shadow); }
  .tbl:has(td[data-label]) tr.season { background: #fffaf0 !important; border-inline-start: 4px solid var(--s4); }
  .tbl:has(td[data-label]) td { display: block; padding: 0 !important; border: 0 !important; white-space: normal; min-width: 0; position: static !important; background: none !important; overflow-wrap: anywhere; }
  .tbl:has(td[data-label]) td::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .tbl:has(td[data-label]) td[data-label=""]::before { display: none; }
  .tbl:has(td[data-label]) td:empty, .tbl:has(td[data-label]) td.card-hide { display: none; }
  .tbl:has(td[data-label]) td.card-title { grid-column: 1 / -1; font-size: 15.5px; }
  .tbl:has(td[data-label]) td.card-wide { grid-column: 1 / -1; }
  .tbl:has(td[data-label]) td .btn.call { width: 100%; min-height: 40px; }
}
/* موقع المزرعة */
.map-field { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.map-field .inp { flex: 1 1 220px; min-width: 0; }
.map-field .btn[hidden] { display: none; }
.inp.bad-inp { border-color: var(--red, #c62828); }
.map-chip { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; font-size: 12.5px; text-decoration: none; }
.map-chip:hover { background: rgba(255,255,255,.26); }
/* أرقام لوحة اليوم: الضغط عليها ينزل لقائمتها */
button.kpi { font: inherit; text-align: start; width: 100%; cursor: pointer; color: inherit; }
button.kpi:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
.jump-target { scroll-margin-top: 76px; }
/* ميكروفون صغير بجانب حقل نص (ملاحظة أول مكالمة) */
.mic-box.mic-inline { display: flex; align-items: center; gap: 10px; text-align: start; padding: 0 0 8px; }
.mic-inline .mic { width: 46px; height: 46px; font-size: 20px; flex: none; }
.mic-inline .mic-status { margin-top: 0; }
/* الرقم المختار حاليًا كفلتر */
.kpi.kpi-on { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal) inset, var(--shadow); }
</style>

// نحوّل الجدول لسجل واحد لكل محصول: { name, plant: {شهر: ملاحظة}, harvest: {...} }
window.buildCropCalendar = function () {
  const map = {};
  const put = (list, kind, m) => list.forEach(item => {
    const [name, note = ''] = item.split('|');
    const c = map[name] || (map[name] = { name, plant: {}, harvest: {} });
    const old = c[kind][m];
    c[kind][m] = old && note && old !== note ? `${old} / ${note}` : (old || note);
  });
  PLANT.forEach((l, m) => { put(l, 'plant', m); put(PLANT_ALL, 'plant', m); });
  HARVEST.forEach((l, m) => { put(l, 'harvest', m); put(HARVEST_ALL, 'harvest', m); });
  addCropGroups(map);
  return Object.values(map).sort((a, b) => a.name.localeCompare(b.name, 'ar'));
};
// يضيف كل محصول مصنَّف غير موجود في جدول المواعيد، ويحدد تصنيف كل محصول
window.addCropGroups = function (map) {
  window.CROP_GROUPS.forEach(([group, names]) => names.forEach(name => {
    const c = map[name] || (map[name] = { name, plant: {}, harvest: {} });
    if (!c.group) c.group = group;
  }));
  return map;
};
window.cropGroupOf = name => (window.CROP_GROUPS.find(([, names]) => names.includes(name)) || [''])[0];

// بداية الموسم = أول شهر في فترة متصلة (مع مراعاة اللف من ديسمبر ليناير)
window.isSeasonStart = function (months, m) {
  if (!(m in months)) return false;
  const count = Object.keys(months).length;
  if (count === 12) return false;
  return !((m + 11) % 12 in months);
};
window.isYearRound = c => Object.keys(c.plant).length === 12 || Object.keys(c.harvest).length === 12;

// هل ملاحظة الموعد بتنطبق على محافظة العميل؟
window.noteAppliesTo = function (note, govCode) {
  if (!note) return true;
  const hasU = /قبلي|الصعيد/.test(note), hasL = /بحري|الدلتا/.test(note);
  if (hasU && hasL) return true;
  if (!govCode) return true;
  if (hasU) return window.UPPER_CODES.has(govCode);
  if (hasL) return !window.UPPER_CODES.has(govCode);
  return true;
};

// قارئ وكاتب xlsx من غير مكتبات خارجية، عشان النظام يشتغل بدون إنترنت
(function () {
  const enc = new TextEncoder();
  const dec = new TextDecoder('utf-8');
  const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');

  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcTable[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  function zipStore(files) {
    const chunks = [], central = [];
    let offset = 0;
    const u16 = n => [n & 255, (n >>> 8) & 255];
    const u32 = n => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
    files.forEach(f => {
      const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data);
      const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0)];
      const local = new Uint8Array([0x50, 0x4B, 3, 4, ...common]);
      chunks.push(local, name, data);
      central.push(new Uint8Array([0x50, 0x4B, 1, 2, ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
      offset += local.length + name.length + data.length;
    });
    const cdSize = central.reduce((s, c) => s + c.length, 0);
    const end = new Uint8Array([0x50, 0x4B, 5, 6, 0, 0, 0, 0, ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), 0, 0]);
    return new Blob([...chunks, ...central, end], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }

  const colName = i => { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = (i - m - 1) / 26; } return s; };

  function sheetXml(sheet) {
    const rows = sheet.rows;
    const widths = rows[0].map((_, i) => Math.min(40, Math.max(10, ...rows.slice(0, 200).map(r => String(r[i] ?? '').length + 3))));
    let x = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView ${LANG === 'ar' ? 'rightToLeft="1" ' : ''}workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>`;
    widths.forEach((w, i) => { x += `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`; });
    x += '</cols><sheetData>';
    rows.forEach((r, ri) => {
      x += `<row r="${ri + 1}">`;

function sha256Fallback(bytes) {

  const rr = (x, r) => (x >>> r) | (x << (32 - r));
  for (let o = 0; o < total; o += 64) {
    const w = new Array(64), dv = new DataView(m.buffer, o, 64);
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(i * 4);
    for (let i = 16; i < 64; i++) w[i] = (w[i - 16] + (rr(w[i - 15], 7) ^ rr(w[i - 15], 18) ^ (w[i - 15] >>> 3)) + w[i - 7] + (rr(w[i - 2], 17) ^ rr(w[i - 2], 19) ^ (w[i - 2] >>> 10))) | 0;

    for (let i = 0; i < 64; i++) {

      const t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;

    }
    [a, b, c, d, e, f, g, h].forEach((v, i) => { H[i] = (H[i] + v) | 0; });

const MAP_HOSTS = /^(?:[\w-]+\.)*(?:google\.(?:com|[a-z]{2}|com?\.[a-z]{2})|goo\.gl|g\.co)$/i;
function mapCoords(text) {
  const s = String(text || '').trim();

    || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)

async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || file.size < 1.5 * 1024 * 1024 || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const out = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
    return out && out.size < file.size ? out : file;
  } catch { return file; }
}

    if (out.error === 'unknown action') throw new Error(t('يلزم تحديث خدمة جوجل لتفعيل رفع الملفات. يرجى إبلاغ إدارة الشركة'));
    if (!out.ok) throw new Error(out.error || 'failed');
    return { store, ref: out.id };
  }
  const ref = uid() + uid();
  if (store === 'server') {
    const res = await fetch(`/api/file?id=${ref}`, { method: 'PUT', headers: { 'Content-Type': blob.type || 'application/octet-stream' }, body: blob });
    if (!res.ok) throw new Error(String(res.status));

async function fetchFile(f) {

    return new Blob([fromBase64(out.data)], { type: out.mime || f.mime });
  }
  if (f.store === 'server') {

    return new Blob([await res.arrayBuffer()], { type: f.mime });

  const b = await idbDo('readonly', s => s.get(f.ref));

}
async function removeStoredFile(f) {

function detectGov(row) {

    if (regionByCode(gc)) return { govCode: gc, subCode: `${n}/${gc}` };

  if (!hay.trim()) return { govCode: '', subCode: '' };
  const pickGov = normHeader(row.gov || '');

  for (const r of list.length ? list : window.REGIONS) {

function analyzeImport(rows, ownerId) {
  const allAlts = alts => alts.flatMap(a => [a, EN[a] || a]).map(normHeader);
  const headerIdx = rows.findIndex(r => r.some(c => allAlts(IMPORT_HEADERS.name).includes(normHeader(c))));
  if (headerIdx < 0) return { error: 'لم يُعثر على عمود "الاسم" في الملف. يرجى تنزيل النموذج واستخدامه مرجعًا' };
  const headers = rows[headerIdx].map(normHeader), idx = {};
  Object.entries(IMPORT_HEADERS).forEach(([k, alts]) => {
    const list = allAlts(alts);
    const i = headers.findIndex(h => list.includes(h));
    if (i >= 0) idx[k] = i;
  });
  const fieldIdx = {};
  activeFields().forEach(f => {
    const i = headers.findIndex(h => h === normHeader(f.name) || (f.en && h === normHeader(f.en)));
    if (i >= 0) fieldIdx[f.id] = i;
  });
  const res = { items: [], duplicates: [], errors: [], egypt: {}, intl: {}, unknownGov: 0, unknownCountry: 0 };
  const seen = new Set();
  rows.slice(headerIdx + 1).forEach((r, n) => {
    if (!r.some(x => String(x ?? '').trim())) return;
    const raw = {}; Object.keys(idx).forEach(k => { raw[k] = r[idx[k]] ?? ''; });
    const line = headerIdx + n + 2;
    const name = String(raw.name || '').trim(), p1 = String(raw.phone1 || '').trim(), p2 = String(raw.phone2 || '').trim();
    if (!name || !(p1 || p2)) { res.errors.push({ line, name, why: !name ? 'الاسم فارغ' : 'لا يوجد رقم هاتف' }); return; }
    const np = [normPhone(p1), normPhone(p2)].filter(Boolean);
    const dup = findDuplicate([p1, p2]);
    if (dup || np.some(x => seen.has(x))) {
      const d = { line, name, phone: p1, owner: dup ? userName(dup.ownerId) : t('مكرر داخل الملف'), id: dup?.id };
      // الصف الأصلي غير قابل للتعداد حتى لا يُحفظ داخل بيانات العميل
      Object.defineProperty(d, '_raw', { value: r, enumerable: false });
      res.duplicates.push(d);
      return;
    }
    np.forEach(x => seen.add(x));
    let market = 'egypt', country = '';
    const ctext = String(raw.country || '').trim();
    if (ctext && !/^(مصر|egypt)$/i.test(ctext)) { market = 'intl'; country = findCountry(ctext)?.name || ctext; }
    else if (!ctext) {
      const fromP = countryFromPhone(p1) || countryFromPhone(p2);
      if (fromP && fromP.name !== 'مصر') { market = 'intl'; country = fromP.name; }
    }
    const loc = market === 'egypt' ? detectGov(raw) : { govCode: '', subCode: '' };
    const ptext = String(raw.payType || '');
    const payType = /كاش|نقد|cash/i.test(ptext) ? 'cash' : /قسط|تقسيط|install/i.test(ptext) ? 'installment' : /مقدم|deposit/i.test(ptext) ? 'deposit' : '';
    const rtext = String(raw.rating || '').replace('جدا', 'جدًا');
    const rating = RATINGS.find(x => rtext.includes(x) || normHeader(rtext) === normHeader(EN[x])) || 'جيد';
    const crops = splitCrops(String(raw.crops || ''));
    const ctg = String(raw.category || '').trim();
    const category = CUSTOMER_CATEGORIES.find(x => cropKey(x) === cropKey(ctg) || normHeader(EN[x] || DV[x]) === normHeader(ctg)) || ctg;
    const custom = {};
    Object.entries(fieldIdx).forEach(([id, i]) => { custom[id] = r[i] ?? ''; });
    const item = {
      ownerId, name, category, phone1: p1, phone2: p2, market, country, ...loc, address: String(raw.address || '').trim(), area: raw.area === '' || raw.area === undefined ? '' : (parseFloat(raw.area) || ''), irrigation: String(raw.irrigation || ''), crops, salinity: String(raw.salinity || ''), waterSource: String(raw.waterSource || ''), deviceType: String(raw.deviceType || ''), deviceSize: String(raw.deviceSize || ''), source: String(raw.source || ''), rating, contactDate: parseDateCell(raw.contactDate) || today(), followupDate: parseDateCell(raw.followupDate), payType, deposit: raw.deposit ? (parseFloat(raw.deposit) || '') : '', payDate: parseDateCell(raw.payDate), custom,
    };
    Object.defineProperty(item, '_raw', { value: r, enumerable: false });
    res.items.push(item);
    if (market === 'egypt') {
      const lab = regionByCode(loc.govCode) ? govLabel(regionByCode(loc.govCode).gov) : t('غير محدد');
      if (!loc.govCode) res.unknownGov++;
      res.egypt[lab] = (res.egypt[lab] || 0) + 1;

}

      const c = pick(db.customers);
      const prod = db.products.find(p => p.type === c.deviceType && p.size === c.deviceSize && productMarket(p) === c.market) || pick(db.products.filter(p => p.active !== false));
      const qty = rnd() < .75 ? 1 : int(2, 3);
      const usd = c.market === 'intl';
      const price = productPrice(prod, usd ? 'USD' : 'EGP');
      const total = price * qty;
      const payType = pick(['cash', 'cash', 'installment', 'installment', 'deposit']);
      let deposit = 0;
      const installments = [];
      if (payType !== 'cash') {
        deposit = Math.round(total * pick([.2, .3, .5]));
        const parts = payType === 'deposit' ? 1 : pick([3, 4, 6]);
        const each = Math.round((total - deposit) / parts);
        for (let p = 1; p <= parts; p++) {
          const due = addMonths(date, p);
          const paid = due < td && rnd() < .85;
          installments.push({ id: uid(), due, amount: each, paid, paidAt: paid ? due : '' });
        }
      }
      const r = rnd();
      const status = r < .06 ? 'cancelled' : r < .11 ? 'postponed' : r < .6 ? 'delivered' : 'active';
      db.counters.order++;
      db.orders.push({
        id: uid(), no: `DW-${year}-${String(db.counters.order).padStart(4, '0')}`, customerId: c.id, repId: c.ownerId, date,
        items: [{ productId: prod.id, type: prod.type, size: prod.size, qty, price }], total, currency: usd ? 'USD' : 'EGP', payType, deposit, installments,
        status, statusReason: status === 'cancelled' || status === 'postponed' ? 'بطلب من العميل' : '', postponedTo: status === 'postponed' ? addDays(td, int(-2, 20)) : '', createdAt: new Date(date + 'T11:00:00').toISOString(),
      });
      const next = installments.find(i => !i.paid);
      Object.assign(c, { payType, deposit: deposit || '', payDate: next?.due || date });
      if (status === 'delivered') {
        c.stageId = 'st_after';
        db.settings.afterSalesPlan.forEach(step => {
          db.afterSales.push({ id: uid(), customerId: c.id, orderId: db.orders[db.orders.length - 1].id, name: step.name, due: addDays(date, step.days), status: 'pending', userId: c.ownerId, feedback: '', satisfaction: 0, doneAt: '', doneBy: '', viaVoice: false });
        });
      } else if (status !== 'cancelled' && c.stageId !== 'st_after') c.stageId = 'st_won';
    }
  }
  db.orders.sort((a, b) => b.date.localeCompare(a.date));
  db.customers.forEach(buildHistory);

  // سجل نشاط تجريبي يوضح شكل المراقبة
  const entry = (at, userId, action, entity, entityId, key, params, changes) => {
    let lab = key;
    if (params) Object.entries(params).forEach(([k, v]) => { lab = lab.split(`{${k}}`).join(v); });
    db.audit.push({ id: uid(), at, userId, action, entity, entityId, key, params: params || null, label: lab, changes: changes || [] });
  };
  repIds.forEach((id, i) => {
    for (let back = 5; back >= 1; back--) {
      const start = new Date(addDays(td, -back) + `T${pad(9 + i % 2)}:${pad(int(0, 40))}:00`);
      const end = new Date(start.getTime() + int(4, 8) * 3600000);
      db.sessions.unshift({ id: uid(), userId: id, start: start.toISOString(), lastSeen: end.toISOString(), end: end.toISOString() });
      entry(start.toISOString(), id, 'login', 'session', id, 'تسجيل الدخول');
      const c = pick(db.customers.filter(x => x.ownerId === id));
      entry(new Date(start.getTime() + 3600000).toISOString(), id, 'update', 'customer', c.id, 'تعديل بيانات العميل: {name}', { name: c.name }, [{ field: 'رقم الهاتف 2', from: '', to: `0100${int(1000000, 9999999)}` }]);
      entry(end.toISOString(), id, 'logout', 'session', id, 'تسجيل الخروج');
    }
  });
  db.audit.sort((a, b) => b.at.localeCompare(a.at));

  db.grants.push({ id: uid(), userId: repIds[0], label: 'عملائي في موسم الشهر', dataset: 'season', scope: 'own', market: 'egypt', govCodes: [], crops: [], ratings: [], columns: ['name', 'phone1', 'gov', 'crops', 'rating', 'followupDate'], until: addDays(td, 30), active: true, createdBy: db.users[1].id, createdAt: nowStamp() });
  seedSupportDemo(db);
  seedDistributorsDemo(db);
  seedSharesDemo(db);
}

const DISTRIBUTOR_TYPES = ['شركة', 'مزارع', 'مهندس زراعي', 'وكيل', 'موزع'];
// النسخة المنشورة تستبدل العناوين بعناوين وهمية، فتُترك القائمة فارغة وتستخدم خدمة جوجل عناوينها الافتراضية
const DEFAULT_MAIL_MANAGERS = ['user@example.com', 'user@example.com'].filter(m => !/@example\.com$/i.test(m));
function seedDistributorsDemo(db) {

  list.forEach(([name, type, govCode]) => db.distributors.push({ id: uid(), name, type, govCode, govs: regionByCode(govCode) ? [regionByCode(govCode).gov] : [], phone: `010${Math.floor(10000000 + rnd() * 89999999)}`, notes: '', active: true, createdAt: nowStamp() }));
  db.orders.forEach(o => { if (!o.distributorId && rnd() < .45) o.distributorId = pick(db.distributors).id; });

async function loadDB() {
  let remote = null, serverEmpty = false;
  if (cloudMode) {
    const m = location.hash.match(/key=([^&]+)/);
    if (m) { localStorage.setItem(CLOUD_KEY_STORE, decodeURIComponent(m[1])); history.replaceState(null, '', location.pathname); }
    if (!localStorage.getItem(CLOUD_KEY_STORE)) throw new Error('needs-key');
    // عند تعذر الوصول تتوقف الصفحة ولا تبدأ ببيانات جديدة قد تُكتب فوق المحفوظ
    const out = await cloudCall('db');
    if (!out.ok) {
      if (out.error === 'suspended') throw new Error('suspended');
      if (out.error === 'unauthorized') { localStorage.removeItem(CLOUD_KEY_STORE); throw new Error('needs-key'); }
      throw new Error(out.error);
    }
    serverOn = true;
    serverRev = out.rev || 0;
    lastRev = serverRev;
    if (out.db) {
      setBase(out.db);
      DB = out.db;
      lastRev = Math.max(DB.rev || 0, serverRev);
      if (migrateDB(DB)) saveDB();
    } else await resetDB(true);
    return;
  }
  try {
    const res = await fetch('/api/db', { cache: 'no-store' });
    if (res.headers.get('X-CRM-API')) {
      serverOn = true;
      serverRev = +res.headers.get('X-Rev') || 0;
      if (res.status === 200) { remote = await res.json(); setBase(remote); }
      else serverEmpty = true;
    }
  } catch {}
  let local = null;
  try { local = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
  // نسخة المتصفح تُعتمد فقط إذا كانت تعديلًا لم يصل إلى الملف بعد على آخر نسخة منه
  const localAhead = local && remote && (local.rev || 0) > serverRev && +localStorage.getItem(SYNC_KEY) === serverRev;
  DB = remote && !localAhead ? remote : local;
  if (!DB) { await resetDB(true); return; }
  lastRev = Math.max(DB.rev || 0, serverRev);
  // عند أول تشغيل مع الملف تُنقل بيانات المتصفح الحالية إليه
  if (migrateDB(DB) || serverEmpty || localAhead) saveDB();
  scheduleCloudSync();
}
async function resetDB(withDemo) {
  DB = emptyDB();
  await makeUsers(DB);
  if (withDemo) seedDemo(DB);
  else { DB.settings.demo = false; DB.users = DB.users.filter(u => ['owner', 'manager'].includes(u.role)); }
  seedAgents(DB);
  applyTeamNames(DB);
  saveDB();
}

<script>
// أدوات الواجهة المشتركة: النوافذ والتنبيهات والرسوم
const framed = window.top !== window;
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 3800);
}

function openModal({ title, body, footer, wide, locked, onClose }) {
  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="modal-h"><h3>${title}</h3>${locked ? '' : `<button class="modal-x" aria-label="${t('إغلاق')}">×</button>`}</div>
    <div class="modal-b">${body}</div>${footer ? `<div class="modal-f">${footer}</div>` : ''}</div>`;
  $('#modal-root').appendChild(back);
  const close = () => { back.remove(); onClose && onClose(); };
  if (!locked) {
    $('.modal-x', back).onclick = close;
    back.addEventListener('mousedown', e => { if (e.target === back) close(); });
  }
  return { el: back, close };
}
function confirmBox(title, text, onYes, yesLabel) {
  const m = openModal({ title, body: `<p style="margin-top:0">${text}</p>`, footer: `<button class="btn primary" id="yes">${yesLabel || t('تأكيد')}</button><button class="btn" id="no">${t('رجوع')}</button>` });

  $('#no', m.el).onclick = m.close;
}

const ratingPill = r => `<span class="pill r-${RATINGS.indexOf(r) + 1 || 3}">${r === 'مميز' ? '★ ' : ''}${esc(tv(r) || '—')}</span>`;
const payPill = c => {
  if (!c.payType) return `<span class="muted">${t('لم يشترِ')}</span>`;
  return `<span class="pill ${c.payType === 'cash' ? 'p-green' : c.payType === 'installment' ? 'p-blue' : 'p-orange'}">${t(PAY_TYPES[c.payType])}</span>`;
};
const statusPill = s => `<span class="pill ${{ active: 'p-blue', delivered: 'p-green', postponed: 'p-orange', cancelled: 'p-red' }[s]}">${t(ORDER_STATUS[s])}</span>`;
const stagePill = c => {
  const s = stageById(c.stageId);
  if (!s) return '';
  const cls = s.type === 'won' ? 'p-green' : s.type === 'lost' ? 'p-red' : s.group === 'aftersales' ? 'p-after' : 'p-blue';
  return `<span class="pill ${cls}">${esc(label(s))}</span>`;
};
const ticketPill = s => `<span class="pill ${{ new: 'p-red', assigned: 'p-orange', in_progress: 'p-blue', resolved: 'p-green', closed: 'p-gray' }[s]}">${t(TICKET_STATUS[s])}</span>`;
const priorityPill = p => `<span class="pill ${{ high: 'p-red', normal: 'p-gray', low: 'p-gray' }[p]}">${p === 'high' ? '⚠ ' : ''}${t(TICKET_PRIORITY[p])}</span>`;
const stars = n => n ? `<span class="stars" aria-label="${n}/5">${'★'.repeat(n)}<span class="off">${'★'.repeat(5 - n)}</span></span>` : '';
const followPill = d => {
  if (!d) return '<span class="muted">—</span>';
  const td = today();
  if (d < td) return `<span class="pill p-red">⚠ ${fmtDate(d)}</span>`;
  if (d === td) return `<span class="pill p-orange">${t('اليوم')}</span>`;
  return `<span>${fmtDate(d)}</span>`;
};
const seasonBadges = (c, m) => customerSeason(c, m).slice(0, 2).map(s => `<span class="pill ${s.kind === 'plant' ? 'p-plant' : 'p-harvest'}">${t(s.kind === 'plant' ? 'زراعة' : 'حصاد')} ${esc(tv(s.crop))}</span>`).join(' ');
const opts = (list, sel, blank) => (blank !== undefined ? `<option value="">${blank}</option>` : '') + list.map(v => {
  const [val, lab] = Array.isArray(v) ? v : [v, v];
  return `<option value="${esc(val)}" ${String(val) === String(sel ?? '') ? 'selected' : ''}>${esc(lab)}</option>`;
}).join('');
const optsT = (list, sel, blank) => opts(list.map(v => Array.isArray(v) ? [v[0], t(v[1])] : [v, tv(v)]), sel, blank);
const govOptions = sel => opts(GOVS.map(g => [g, govLabel(g)]), sel, t('جميع المحافظات'));
const regionLabel = r => `${r.code} - ${govLabel(r.gov)}${r.main === 'المناطق الرئيسية' ? '' : ' / ' + r.main}`;
const repOptions = (sel, blank) => opts(sellers().map(u => [u.id, u.name]), sel, blank === undefined ? t('جميع رجال البيع') : blank);
const phoneLink = p => !p ? '' : can('customers.view_phones') ? `<a class="num" href="tel:${esc(String(p).replace(/\s/g, ''))}"${window.top !== window ? ' target="_blank"' : ''} onclick="event.stopPropagation()">${esc(p)}</a>` : `<span class="num muted">${esc(showPhone(p))}</span>`;

// تلميحات الرسوم
document.addEventListener('mouseover', e => {
  const el = e.target.closest?.('[data-tip]');
  const tip = $('#tip');
  if (!tip) return;
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tip;
  tip.hidden = false;
});
document.addEventListener('mousemove', e => {
  const tip = $('#tip');
  if (tip && !tip.hidden) {
    tip.style.top = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 6) + 'px';
    tip.style.left = Math.max(6, Math.min(e.clientX - tip.offsetWidth / 2, innerWidth - tip.offsetWidth - 6)) + 'px';
  }
});

const tableView = (rows, h1, h2) => `<details class="tv"><summary>${t('عرض كجدول')}</summary><table><tr><th>${h1}</th><th>${h2}</th></tr>${rows.map(r => `<tr><td>${esc(r[0])}</td><td>${r[2] ?? r[1]}</td></tr>`).join('')}</table></details>`;

// أعمدة رأسية: rows = [{label, value, tip, current}]
function barChart(rows, unitFmt = moneyShort) {
  const max = Math.max(1, ...rows.map(r => r.value));
  const bestIdx = rows.reduce((b, r, i) => r.value > rows[b].value ? i : b, 0);
  return `<div class="bars">${rows.map((r, i) => {
    const showVal = i === bestIdx || i === rows.length - 1;
    return `<div class="bar-col" data-tip="${esc(r.tip || `${r.label}: ${money(r.value)}`)}">${showVal ? `<span class="bar-val">${unitFmt(r.value)}</span>` : ''}<div class="bar ${r.current ? 'cur' : ''}" style="height:${Math.max(.5, r.value / max * 88)}%"></div></div>`;
  }).join('')}</div><div class="bar-labels">${rows.map(r => `<span>${esc(r.label)}</span>`).join('')}</div>${tableView(rows.map(r => [r.label, money(r.value)]), t('الفترة'), t('القيمة'))}`;
}
// أعمدة أفقية: rows = [[label, value, display?]]
function hbars(rows, opt = {}) {
  if (!rows.length) return `<div class="empty">${t('لا توجد بيانات في هذه الفترة')}</div>`;
  const max = Math.max(1, ...rows.map(r => r[1]));
  const fmt = opt.fmt || money;
  return `<div class="hb">${rows.map(r => `<div class="lab" title="${esc(r[0])}">${esc(r[0])}</div><div class="track" data-tip="${esc(r[0])}: ${esc(r[2] ?? fmt(r[1]))}"><div class="fill" style="width:${r[1] / max * 100}%"></div></div><div class="val">${esc(r[2] ?? fmt(r[1]))}</div>`).join('')}</div>${tableView(rows.map(r => [r[0], fmt(r[1]), r[2]]), opt.h1 || t('البند'), opt.h2 || t('القيمة'))}`;
}
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
function stackBar(rows, fmt = money) {
  const total = rows.reduce((s, r) => s + r[1], 0) || 1;
  return `<div class="stack">${rows.filter(r => r[1] > 0).map(r => `<div style="flex:${r[1]} 0 0;background:${SERIES[rows.indexOf(r)]}" data-tip="${esc(r[0])}: ${fmt(r[1])} (${Math.round(r[1] / total * 100)}%)"></div>`).join('')}</div>
  <div class="legend">${rows.map((r, i) => `<span><i style="background:${SERIES[i]}"></i>${esc(r[0])}: <b>${fmt(r[1])}</b> (${Math.round(r[1] / total * 100)}%)</span>`).join('')}</div>`;
}

// زر الميكروفون: يكتب الكلام في حقل نصي ويخبر المستدعي إن استُخدم الصوت
function bindMic(root, { mic, status, input, onVoice }) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, recording = false, committed = '';
  const micBtn = $(mic, root), statusEl = $(status, root), txt = $(input, root);
  statusEl.textContent = t(SR ? 'اضغط على الميكروفون وتحدث، وسيُكتب الكلام تلقائيًا' : 'هذا المتصفح لا يدعم التسجيل الصوتي. استخدم Chrome أو اكتب المتابعة');
  const stop = () => { recording = false; if (rec) { try { rec.stop(); } catch {} } micBtn.classList.remove('rec'); };
  micBtn.onclick = () => {
    if (!SR) { txt.focus(); return; }
    if (recording) { stop(); statusEl.textContent = t('توقف التسجيل. راجع النص ثم احفظ'); return; }
    rec = new SR();
    rec.lang = LANG === 'en' ? 'en-US' : 'ar-EG'; rec.continuous = true; rec.interimResults = true;
    committed = txt.value ? txt.value.trim() + ' ' : '';
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) committed += e.results[i][0].transcript.trim() + ' ';
        else interim += e.results[i][0].transcript;
      }
      txt.value = committed + interim;
      onVoice && onVoice();
    };
    rec.onerror = e => {
      if (e.error === 'no-speech') return;
      stop();
      statusEl.textContent = t(e.error === 'not-allowed' ? 'يجب السماح للمتصفح باستخدام الميكروفون' : e.error === 'network' ? 'تحويل الصوت إلى نص يحتاج إلى اتصال بالإنترنت' : 'حدثت مشكلة في التسجيل. حاول مرة أخرى أو اكتب النص');
    };
    // يوقف Chrome التعرف بعد فترة صمت، فتتم المتابعة ما دام المستخدم لم يوقف التسجيل
    rec.onend = () => { if (recording) { try { rec.start(); } catch {} } };
    try {
      rec.start();
      recording = true;
      micBtn.classList.add('rec');
      statusEl.textContent = t('جارٍ التسجيل... اضغط مرة أخرى للإيقاف');
    } catch { statusEl.textContent = t('تعذر تشغيل الميكروفون'); }
  };
  return stop;
}

// رقم في أعلى الصفحة يعمل كاختصار: الضغط عليه يطبّق فلتر قائمته وينزل إليها، والضغط مرة أخرى يلغيه
const kpiBtn = (key, label, value, cls = '', active = false) => `<button type="button" class="kpi link ${cls} ${active ? 'kpi-on' : ''}" data-kf="${key}" aria-pressed="${active}"><div class="l">${label}</div><div class="v">${value}</div></button>`;
function bindKpis(root, apply) {
  $$('[data-kf]', root).forEach(b => b.onclick = () => {
    apply(b.dataset.kf, b.classList.contains('kpi-on'));
    requestAnimationFrame(() => $('#kpi-list', root)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
  });
}

<script>
// سجل العملاء (مصر والخارج)، إدخال عميل جديد، ملف العميل ومساره، الرفع من إكسيل
const custState = { egypt: { page: 1 }, intl: { page: 1 } };
const PAGE_SIZE = 40;

function filterCustomers(market, f) {
  const q = (f.q || '').trim().toLowerCase();
  const nq = normPhone(q);
  const m = new Date().getMonth();
  return visibleCustomers().filter(c => {
    if (c.market !== market) return false;
    if (market === 'intl' && f.country && c.country !== f.country) return false;
    if (market === 'egypt' && f.gov && regionByCode(c.govCode)?.gov !== f.gov) return false;
    if (market === 'egypt' && f.code && c.govCode !== f.code) return false;
    if (f.rating && c.rating !== f.rating) return false;
    if (f.crop && !c.crops.includes(f.crop)) return false;
    if (f.ctg && c.category !== f.ctg) return false;
    if (f.rep && !followedBy(c, f.rep)) return false;
    if (f.stage && c.stageId !== f.stage) return false;
    if (f.pay === 'none' ? c.payType : f.pay && c.payType !== f.pay) return false;
    if (f.follow === 'today' && c.followupDate !== today()) return false;
    if (f.follow === 'late' && !(c.followupDate && c.followupDate < today())) return false;
    if (f.season && !customerSeason(c, m).length) return false;
    if (!inDateRange(c.createdAt, f)) return false;
    if (q && !(c.name.toLowerCase().includes(q) || (nq && can('customers.view_phones') && (normPhone(c.phone1).includes(nq) || normPhone(c.phone2).includes(nq))) || c.code.toLowerCase().includes(q) || custAddress(c).toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => {
    const r = RATINGS.indexOf(a.rating) - RATINGS.indexOf(b.rating);
    return r || (a.followupDate || '9').localeCompare(b.followupDate || '9');
  });
}

const activeFilters = st => ['gov', 'code', 'stage', 'rating', 'crop', 'ctg', 'rep', 'pay', 'follow', 'from', 'to', 'season'].filter(k => st[k]).length;
function viewCustomers(root, market) {

    const manyOwners = can('customers.view_all') || (ME.assists || []).length;

        <td class="wrap card-wide" data-label="${t('العنوان')}">${esc(custAddress(c))}</td>${market === 'egypt' ? `<td class="card-hide" data-label="${t('الكود')}"><span class="code-tag">${esc(c.subCode || c.govCode || '-')}</span></td>` : ''}
        <td class="card-hide" data-label="${t('المساحة')}">${c.area === '' ? '' : `${esc(c.area)} ${t('فدان')}`}</td><td class="card-hide" data-label="${t('نوع الري')}">${esc(tv(c.irrigation))}</td><td class="card-wide" data-label="${t('نوع المحصول')}">${esc(c.crops.map(tv).join(LANG === 'en' ? ', ' : '، '))} ${seasonBadges(c, m)}</td><td class="num card-hide" data-label="${t('الملوحة')}">${esc(c.salinity)}</td><td class="card-hide" data-label="${t('مصدر المياه')}">${esc(tv(c.waterSource))}</td><td class="card-wide" data-label="${t('الجهاز المطلوب')}">${esc(deviceName(c.deviceType, c.deviceSize))}</td><td class="card-hide" data-label="${t('مصدر المعرفة')}">${esc(tv(c.source))}${c.viaDistributorId ? `<div class="muted">${esc(distName(c.viaDistributorId))}</div>` : ''}</td>
        <td data-label="${t('التقييم')}">${ratingPill(c.rating)}</td><td data-label="${t('المرحلة')}">${stagePill(c)}</td><td class="card-hide" data-label="${t('تاريخ الاتصال')}">${fmtDate(c.contactDate)}</td><td data-label="${t('تاريخ المتابعة')}">${followPill(c.followupDate)}</td>
        <td class="card-hide" data-label="${t('الدفع')}">${payPill(c)}</td><td class="card-hide" data-label="${t('قيمة المقدم')}">${c.deposit ? money(c.deposit) : ''}</td><td class="card-hide" data-label="${t('تاريخ السداد')}">${fmtDate(c.payDate)}</td>${fields.map(f => `<td class="card-hide" data-label="${esc(label(f))}">${esc(c.custom?.[f.id] ?? '')}</td>`).join('')}${manyOwners ? `<td data-label="${t('رجل البيع')}">${esc(userName(c.ownerId))}</td>` : ''}</tr>`;
      }).join('')}</tbody></table>
      <div class="pager"><button class="btn sm" id="prev" ${st.page <= 1 ? 'disabled' : ''}>${t('السابق')}</button><span>${t('صفحة {a} من {b}', { a: st.page, b: pages })} · ${t('العملاء: {n}', { n: list.length })}</span><button class="btn sm" id="next" ${st.page >= pages ? 'disabled' : ''}>${t('التالي')}</button></div></div>`;
    $$('tr.click', el).forEach(tr => tr.onclick = () => openCustomer(tr.dataset.id));
    $('#prev', el).onclick = () => { st.page--; draw(); };
    $('#next', el).onclick = () => { st.page++; draw(); };
  };

  ['rating', 'crop', 'ctg', 'rep', 'pay', 'follow', 'gov', 'code', 'stage'].forEach(k => {
    const el = $('#' + k, root);
    if (el) el.onchange = () => {
      st[k] = el.value; st.page = 1;
      if (k === 'gov') { st.code = ''; fillCodes(); }
      draw();
    };
  });
  $('#q', root).oninput = e => { st.q = e.target.value; st.page = 1; draw(); };
  // على الموبايل تُطوى عوامل التصفية خلف زر واحد حتى تظهر قائمة العملاء مباشرة
  $('#ftog', root).onclick = () => { st.fopen = !st.fopen; $('.more-filters', root).classList.toggle('open', st.fopen); $('#ftog', root).setAttribute('aria-expanded', String(st.fopen)); };
  bindDateRange(root, st, draw);
  const se = $('#season', root);
  if (se) se.onclick = () => { st.season = !st.season; se.classList.toggle('on', st.season); st.page = 1; draw(); };
  const add = $('#add', root);
  if (add) add.onclick = () => openWizard(market);
  const imp = $('#imp', root);
  if (imp) imp.onclick = openImport;
  const ex = $('#exp', root);
  if (ex) ex.onclick = () => {
    const list = filterCustomers(market, st);
    downloadBlob(buildXlsx([{ name: title, rows: customersToRows(list) }]), `${title} ${today()}.xlsx`);
    audit('export', 'customer', null, 'تصدير سجل العملاء: {n}', { n: list.length });
    toast(t('تم تنزيل ملف يضم {n} صفًا', { n: list.length }), 'ok');
  };
  drawTabs();
  draw();
}

const pipeState = { rep: '', domain: '' };
function viewPipeline(root) {
  const st = pipeState;
  const stages = stagesAll(st.domain);
  const custs = visibleCustomers().filter(c => (!st.rep || followedBy(c, st.rep)) && (!st.domain || c.domainId === st.domain));
  root.innerHTML = `<div class="page-head"><h1>${t('مسار العملاء')}</h1><div class="hint">${t('موقع كل عميل من أول اتصال حتى البيع وما بعده. اضغط على العميل لفتح ملفه')}</div></div>
  <div class="filters">${can('customers.view_all') ? `<select class="inp" id="rep" aria-label="${t('رجل البيع')}">${repOptions(st.rep)}</select>` : ''}${activeDomains().length > 1 ? `<select class="inp" id="dom" aria-label="${t('المجال')}">${opts(activeDomains().map(d => [d.id, label(d)]), st.domain, t('جميع المجالات'))}</select>` : ''}</div>
  <div class="board">${stages.map(s => {
    const list = custs.filter(c => c.stageId === s.id);
    return `<section class="board-col ${s.type} ${s.group}"><header><b>${esc(label(s))}</b><span class="n">${list.length}</span></header><div class="board-list">${list.slice(0, 30).map(c => `<button class="board-card" data-id="${c.id}"><b>${esc(c.name)}</b><span class="muted">${esc(custLocation(c))}</span><span>${ratingPill(c.rating)} ${followPill(c.followupDate)}</span></button>`).join('')}${list.length > 30 ? `<div class="muted" style="text-align:center">${t('و{n} آخرون', { n: list.length - 30 })}</div>` : ''}${list.length ? '' : `<div class="muted" style="text-align:center;padding:8px">—</div>`}</div></section>`;
  }).join('')}</div>`;
  const rep = $('#rep', root), dom = $('#dom', root);

  $$('.board-card', root).forEach(b => b.onclick = () => openCustomer(b.dataset.id));
}

// ------- إدخال عميل جديد على خطوات -------
function locationFields(prefix, d) {
  return `<div class="grid2"><div class="field"><label>${t('المحافظة')} <span class="req">*</span></label><select class="inp" id="${prefix}gov">${opts(REGIONS.map(r => [r.code, regionLabel(r)]), d.govCode, t('اختر'))}</select></div>
  <div class="field"><label>${t('المنطقة الفرعية')}</label><select class="inp" id="${prefix}sub"></select></div></div>`;
}
function bindLocation(root, prefix, d) {
  const gov = $(`#${prefix}gov`, root), sub = $(`#${prefix}sub`, root);
  const fill = () => {
    const r = regionByCode(gov.value);
    sub.innerHTML = opts((r?.items || []).map(i => [i.code, `${i.code} - ${i.section ? i.section + ' / ' : ''}${i.name}`]), d.subCode, r ? t('اختر') : '—');
  };
  gov.onchange = () => { d.subCode = ''; fill(); };
  fill();
}
// المحاصيل: اختيار من قائمة مصنفة أو كتابة الاسم، وكل محصول يُحفظ وحده
const cropPicker = () => `<div class="grid2"><select class="inp" id="cropsel" aria-label="${t('اختر المحصول من القائمة')}">${cropOptions(DB.crops.map(c => c.name), '', t('اختر المحصول من القائمة'))}</select><input class="inp" id="cropq" list="croplist" placeholder="${t('أو اكتب اسم المحصول ثم اضغط Enter')}"></div><datalist id="croplist">${DB.crops.map(c => `<option value="${esc(tv(c.name))}">`).join('')}</datalist><div class="chips mt" id="cropchips"></div>`;
function bindCropPicker(root, d) {
  const draw = () => {
    $('#cropchips', root).innerHTML = d.crops.map(c => `<button type="button" class="chip on" data-c="${esc(c)}">${esc(tv(c))} <span class="x">×</span></button>`).join('');
    $$('#cropchips .chip', root).forEach(b => b.onclick = () => { d.crops = d.crops.filter(x => x !== b.dataset.c); draw(); });
  };
  const push = list => { splitCrops(list).forEach(c => { if (!d.crops.includes(c)) d.crops.push(c); }); draw(); };
  const add = () => {
    const inp = $('#cropq', root), v = inp.value.trim();
    if (!v) return;
    // الاسم الإنجليزي المختار من القائمة يُحوَّل إلى اسمه المعتمد
    push(DB.crops.find(c => tv(c.name).toLowerCase() === v.toLowerCase())?.name || v);
    inp.value = '';
  };
  $('#cropq', root).addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
  $('#cropq', root).addEventListener('change', add);
  $('#cropsel', root).onchange = e => { if (e.target.value) push(e.target.value); e.target.value = ''; };
  draw();
}
const CATEGORY_PILL = { 'مزارع': 'p-plant', 'مهندس زراعي': 'p-after', 'وكيل': 'p-blue', 'موزع': 'p-orange' };
const categoryPill = v => `<span class="pill ${CATEGORY_PILL[v] || 'p-gray'}">${esc(tv(v))}</span>`;
const categoryChips = d => `<div class="field"><label>${t('تصنيف العميل')}</label><div class="chips" id="ctgc">${(DB.lists.customerCategory || CUSTOMER_CATEGORIES).map(v => `<button type="button" class="chip ${d.category === v ? 'on' : ''}" data-ctg="${esc(v)}">${esc(tv(v))}</button>`).join('')}</div><small class="muted" id="ctgHint">${isPartner(d.category) ? t('سيُضاف تلقائيًا إلى قائمة الموزعين') : ''}</small></div>`;
function bindCategory(root, d) {
  $$('#ctgc .chip', root).forEach(b => b.onclick = () => {
    d.category = d.category === b.dataset.ctg ? '' : b.dataset.ctg;
    $$('#ctgc .chip', root).forEach(x => x.classList.toggle('on', x.dataset.ctg === d.category));
    $('#ctgHint', root).textContent = isPartner(d.category) ? t('سيُضاف تلقائيًا إلى قائمة الموزعين') : '';
  });
}
// مصدر المعرفة "وكيل" أو "موزع": يُختار اسمه من قائمة الموزعين، أو يُضاف اسم جديد
// "وكيل" تعرض الوكلاء فقط، و"موزع" تعرض الموزعين فقط
const viaOptions = (source, sel) => {
  const agent = source === 'وكيل';
  const list = DB.distributors.filter(x => isAgent(x) === agent && (x.active !== false || x.id === sel)).map(x => [x.id, agent ? `${x.name}${(x.countries || []).length ? ` (${coverageLabel(x)})` : ''}` : `${x.name}${x.type && x.type !== 'موزع' ? ` (${tv(x.type)})` : ''}`]).sort((a, b) => a[1].localeCompare(b[1], 'ar'));
  return `${opts(list, sel || '', t('اختر'))}<option value="__new">+ ${esc(t(agent ? 'إضافة وكيل جديد' : 'إضافة موزع جديد'))}</option>`;
};
const viaLabel = source => t(source === 'وكيل' ? 'اسم الوكيل' : 'اسم الموزع');
const viaField = d => `<div class="field" id="viaWrap" ${isPartner(d.source) ? '' : 'hidden'}><label><span id="viaLab">${viaLabel(d.source)}</span> <span class="req">*</span></label><select class="inp" id="via">${viaOptions(d.source, d.viaDistributorId)}</select><input class="inp mt" id="viaNew" hidden placeholder="${t('اكتب الاسم الجديد')}"></div>`;
function bindVia(root) {
  const src = $('[data-f="source"]', root), wrap = $('#viaWrap', root), sel = $('#via', root), nw = $('#viaNew', root);
  src.addEventListener('change', () => {
    wrap.hidden = !isPartner(src.value);
    if (isPartner(src.value)) { sel.innerHTML = viaOptions(src.value, ''); $('#viaLab', root).textContent = viaLabel(src.value); nw.hidden = true; }
  });
  sel.onchange = () => { nw.hidden = sel.value !== '__new'; if (!nw.hidden) nw.focus(); };
}
// يعيد رقم الموزع المختار، أو الاسم الجديد ليُضاف عند الحفظ
function readVia(root, source) {
  if (!isPartner(source)) return { id: '', newName: '' };
  const sel = $('#via', root);
  if (sel.value === '__new') {
    const name = $('#viaNew', root).value.trim();
    return name ? { id: '', newName: name } : { error: t(source === 'وكيل' ? 'يرجى كتابة اسم الوكيل' : 'يرجى كتابة اسم الموزع') };
  }
  return sel.value ? { id: sel.value, newName: '' } : { error: t(source === 'وكيل' ? 'يرجى اختيار الوكيل' : 'يرجى اختيار الموزع') };
}
const viaId = (via, source) => via.newName ? findOrCreateDistributor(via.newName, source) : via.id || '';
// الأجهزة حسب سوق العميل: داخل مصر بالجنيه وخارجها بالدولار، مع السعر الحالي من قائمة الأسعار
// قائمة واحدة بكل جهاز (المقاس + الموديل) مجمّعة حسب المقاس، بالسعر الحالي من قائمة الأسعار
function deviceOptions(d) {
  const list = productsFor(d.domainId, d.market || 'egypt').sort(productSort);
  const cur = d.deviceType ? `${d.deviceType}||${d.deviceSize}` : '';
  const groups = [];
  list.forEach(p => {
    const g = MODEL_RX.test(p.type) ? tv(p.size) : t('أجهزة أخرى');
    let grp = groups.find(x => x[0] === g);
    if (!grp) groups.push(grp = [g, []]);
    grp[1].push(p);
  });
  let found = false;
  const html = groups.map(([g, ps]) => `<optgroup label="${esc(g)}">${ps.map(p => {
    const v = `${p.type}||${p.size}`;
    if (v === cur) found = true;
    return `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(productLabel(p))} · ${money(p.price)} ${curName(productCurrency(p))}</option>`;
  }).join('')}</optgroup>`).join('');
  // الجهاز المسجل سابقًا يبقى ظاهرًا حتى لو أُوقف، فلا يُمسح عند حفظ التعديل

async function openStoredFile(f) {
  if (!f) return;
  const isImg = /^image\/(jpeg|png|webp|gif)$/.test(f.mime);
  const win = isImg ? null : window.open('', '_blank');
  try {
    const blob = await fetchFile(f);
    const url = URL.createObjectURL(blob);
    if (isImg) openModal({ title: esc(f.name), wide: true, body: `<div style="text-align:center"><img src="${url}" alt="${esc(f.name)}" style="max-width:100%;height:auto;border-radius:8px"></div>`, footer: `<a class="btn" href="${url}" download="${esc(f.name)}">⬇ ${t('تنزيل')}</a>` });
    else if (win) win.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = f.name; a.click(); }
    setTimeout(() => URL.revokeObjectURL(url), 10 * 60000);
  } catch (err) {
    if (win) win.close();
    toast(err.message, 'err');
  }
}
