// تحويل العميل لرجل بيع آخر؛ يظهر في تنبيهات المسؤول الجديد وتنتقل إليه متابعاته
function transferCustomers(ids, repId) {
  let n = 0;
  ids.forEach(id => {
    const c = custById(id);
    if (!c || c.ownerId === repId) return;
    updateCustomer(id, { ownerId: repId }, 'تحويل العميل {name} إلى {u}', { name: c.name, u: userName(repId) });
    // المسؤول الجديد لا يبقى ضمن المتابعين المشتركين
    c.assistantIds = (c.assistantIds || []).filter(x => x !== repId);
    c.shares = sharesOf(c).filter(s => s.userId !== repId);
    DB.afterSales.forEach(a => { if (a.customerId === id && a.status === 'pending') a.userId = repId; });
    n++;
  });
  saveDB();
  toast(t('تم تحويل العملاء: {n}', { n }), 'ok');
}
function openTransfer(ids, onDone) {

  };
}

}

    ${items.map((it, i) => `<div class="grid3" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1.3fr)"><div class="field"><label>${t('الجهاز')}</label><select class="inp" data-i="${i}" data-k="productId">${opts(DB.products.map(p => [p.id, `${tv(p.type)} - ${tv(p.size)}`]), it.productId, `${tv(it.type)} ${tv(it.size)}`)}</select></div><div class="field"><label>${t('الكمية')}</label><input class="inp" type="number" min="1" data-i="${i}" data-k="qty" value="${it.qty}"></div><div class="field"><label>${t('سعر الوحدة')}</label><input class="inp" type="number" min="0" data-i="${i}" data-k="price" value="${it.price}"></div></div>`).join('')}
    <div class="grid2"><div class="field"><label>${t('الخصم')}</label><input class="inp" type="number" min="0" id="disc" value="${o.discount || 0}"></div><div class="field"><label>${t('قيمة المقدم')}</label><input class="inp" type="number" min="0" id="dep" value="${o.deposit || 0}"></div></div>
    ${o.installments.length ? `<h4>${t('جدول السداد')}</h4>${o.installments.map((x, i) => `<div class="grid2"><div class="field"><label>${t('الاستحقاق')}</label><input class="inp" type="date" data-ins="${i}" data-k="due" value="${x.due}" ${x.paid ? 'disabled' : ''}></div><div class="field"><label>${t('المبلغ')}</label><input class="inp" type="number" min="0" data-ins="${i}" data-k="amount" value="${x.amount}" ${x.paid ? 'disabled' : ''}></div></div>`).join('')}` : ''}`,

  $('#sv', m.el).onclick = () => {

    $$('[data-i]', m.el).forEach(el => {
      const it = items[+el.dataset.i];
      if (el.dataset.k === 'productId') {
        const p = DB.products.find(x => x.id === el.value);
        if (p && p.id !== it.productId) Object.assign(it, { productId: p.id, type: p.type, size: p.size });
      } else it[el.dataset.k] = +el.value || 0;
    });
    if (items.some(i => !(i.qty > 0))) { toast(t('يرجى اختيار الجهاز والكمية'), 'err'); return; }
    const discount = +$('#disc', m.el).value || 0;
    const total = Math.max(0, items.reduce((s, i) => s + i.qty * i.price, 0) - discount);
    note('التاريخ', o.date, $('#od', m.el).value);
    note('الموزع', DB.distributors.find(d => d.id === o.distributorId)?.name || '', DB.distributors.find(d => d.id === $('#odist', m.el).value)?.name || '');
    note('الأجهزة', o.items.map(i => `${i.type} ${i.size} ×${i.qty} @${i.price}`).join(' + '), items.map(i => `${i.type} ${i.size} ×${i.qty} @${i.price}`).join(' + '));
    note('الإجمالي', o.total, total);
    note('المقدم', o.deposit || 0, +$('#dep', m.el).value || 0);
    $$('[data-ins]', m.el).forEach(el => { const x = o.installments[+el.dataset.ins]; const v = el.dataset.k === 'amount' ? +el.value || 0 : el.value; note(`قسط ${fmtDate(x.due)}`, x[el.dataset.k], v); x[el.dataset.k] = v; });
    Object.assign(o, { date: $('#od', m.el).value || o.date, distributorId: $('#odist', m.el).value, items, discount, total, deposit: +$('#dep', m.el).value || 0 });
    if (changes.length) audit('update', 'order', o.id, 'تعديل الطلب {no}', { no: o.no }, changes);
    m.close();
    toast(t(changes.length ? 'تم الحفظ وتسجيل التعديل' : 'لا يوجد تغيير'), changes.length ? 'ok' : '');
    onDone && onDone();
  };
}

<script>
// تحليل المبيعات: يرى كل مستخدم أداءه ويصدّره، ويرى صاحب الصلاحية الفريق ويصفّي بالشخص والمنطقة
const dashState = { period: 'year', rep: '', gov: '', market: '', from: '', to: '', subGov: '' };

function periodRange(p, st = {}) {
  const n = new Date(), td = iso(n);
  if (p === 'custom' && st.from) {
    const to = st.to || td;
    // الفترة السابقة بنفس عدد الأيام مباشرة قبل البداية، للمقارنة
    const days = Math.max(1, Math.round((new Date(to) - new Date(st.from)) / 86400000) + 1);
    return { from: st.from, to, label: `${fmtDate(st.from)} - ${fmtDate(to)}`, prevFrom: addDays(st.from, -days), prevTo: addDays(st.from, -1) };
  }
  if (p === 'all') return { from: '2000-01-01', to: td, label: 'كل الفترات', prevFrom: '1990-01-01', prevTo: '1999-12-31' };
  if (p === 'week') return { from: addDays(td, -6), to: td, label: 'آخر 7 أيام', prevFrom: addDays(td, -13), prevTo: addDays(td, -7) };
  if (p === 'lastmonth') return { from: iso(new Date(n.getFullYear(), n.getMonth() - 1, 1)), to: iso(new Date(n.getFullYear(), n.getMonth(), 0)), label: 'الشهر الماضي', prevFrom: iso(new Date(n.getFullYear(), n.getMonth() - 2, 1)), prevTo: iso(new Date(n.getFullYear(), n.getMonth() - 1, 0)) };
  if (p === 'thisyear') return { from: `${n.getFullYear()}-01-01`, to: td, label: 'هذه السنة', prevFrom: `${n.getFullYear() - 1}-01-01`, prevTo: `${n.getFullYear() - 1}-12-31` };
  if (p === 'month') return { from: iso(new Date(n.getFullYear(), n.getMonth(), 1)), to: td, label: 'هذا الشهر', prevFrom: iso(new Date(n.getFullYear(), n.getMonth() - 1, 1)), prevTo: iso(new Date(n.getFullYear(), n.getMonth(), 0)) };
  if (p === 'quarter') return { from: iso(new Date(n.getFullYear(), n.getMonth() - 2, 1)), to: td, label: 'آخر 3 أشهر', prevFrom: iso(new Date(n.getFullYear(), n.getMonth() - 5, 1)), prevTo: iso(new Date(n.getFullYear(), n.getMonth() - 2, 0)) };
  return { from: iso(new Date(n.getFullYear(), n.getMonth() - 11, 1)), to: td, label: 'آخر 12 شهرًا', prevFrom: iso(new Date(n.getFullYear(), n.getMonth() - 23, 1)), prevTo: iso(new Date(n.getFullYear(), n.getMonth() - 11, 0)) };
}

function computeAnalytics(st) {
  const r = periodRange(st.period, st);
  const orderMatch = o => {
    if (st.rep && !creditedTo(o, st.rep)) return false;
    const c = custById(o.customerId);
    if (st.market && c?.market !== st.market) return false;
    if (st.gov && regionByCode(c?.govCode)?.gov !== st.gov) return false;
    return true;
  };
  const base = DB.orders.filter(orderMatch);
  const sale = base.filter(countsAsSale);
  const inRange = sale.filter(o => o.date >= r.from && o.date <= r.to);
  const prev = sale.filter(o => o.date >= r.prevFrom && o.date <= r.prevTo);
  const sum = list => list.reduce((s, o) => s + orderValue(o), 0);
  const units = list => list.reduce((s, o) => s + o.items.reduce((a, i) => a + i.qty, 0), 0);
  const collected = list => list.reduce((s, o) => s + orderCollected(o) * fx(o), 0);
  const custs = liveCustomers().filter(c => (!st.rep || followedBy(c, st.rep)) && (!st.market || c.market === st.market) && (!st.gov || regionByCode(c.govCode)?.gov === st.gov));
  const custIds = new Set(custs.map(c => c.id));
  const fups = DB.followups.filter(f => (!st.rep || f.userId === st.rep) && f.at.slice(0, 10) >= r.from);
  const after = DB.afterSales.filter(a => custIds.has(a.customerId));
  const scored = after.filter(a => a.status === 'done' && a.satisfaction);
  const groupSum = (list, keyFn, fn = orderValue) => {
    const m = {};
    list.forEach(o => { [].concat(keyFn(o)).forEach(k => { if (k) m[k] = (m[k] || 0) + fn(o); }); });
    return Object.entries(m).sort((a, b) => b[1] - a[1]);
  };
  const months = [];
  const n = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(n.getFullYear(), n.getMonth() - i, 1);
    const key = iso(d).slice(0, 7);
    const list = sale.filter(o => o.date.startsWith(key));
    months.push({ label: monthName(d.getMonth()), value: sum(list), count: list.length, units: units(list), current: i === 0, tip: `${monthName(d.getMonth())} ${d.getFullYear()}\n${t('المبيعات')}: ${money(sum(list))} ${t('ج.م')}\n${t('الطلبات')}: ${list.length} · ${t('الأجهزة')}: ${units(list)}` });
  }
  const devices = {};
  inRange.forEach(o => o.items.forEach(i => { const k = MODEL_RX.test(i.type) ? deviceName(i.type, i.size) : `${tv(i.type).replace(t('جهاز معالجة مغناطيسية - '), '')} ${tv(i.size)}`; devices[k] = (devices[k] || 0) + i.qty; }));
  const repRows = sellers().map(u => {
    // البيع لعميل مشترك يُحتسب كاملًا لكل من يتابعه
    const list = sale.filter(o => creditedTo(o, u.id) && o.date >= r.from && o.date <= r.to);
    const uc = liveCustomers().filter(c => followedBy(c, u.id));
    return { u, shared: list.filter(o => orderReps(o).length > 1).length, sales: sum(list), orders: list.length, units: units(list), coll: collected(list), cust: uc.length, fu: DB.followups.filter(f => f.userId === u.id && f.at.slice(0, 10) >= r.from).length, late: uc.filter(c => c.followupDate && c.followupDate < today()).length };
  }).sort((a, b) => b.sales - a.sales);
  const sales = sum(inRange), coll = collected(inRange);
  // الأجهزة كما في قائمة الأسعار: العدد والقيمة لكل موديل (X1 إلى X4)، ولكل مقاس، ولكل جهاز (المقاس + الموديل)
  const typeMap = {}, sizeMap = {}, inchMap = {};
  const modelLabel = type => { const m = String(type).match(MODEL_RX); return m ? t('موديل X{n} (حتى {ppm})', { n: m[1], ppm: ppmText(m[2]) }) : tv(type); };
  inRange.forEach(o => o.items.forEach(i => {
    const share = o.total ? (i.qty * i.price) / Math.max(1, o.items.reduce((s, x) => s + x.qty * x.price, 0)) : 0;
    const v = orderValue(o) * share;
    const mk = modelLabel(i.type);
    const ty = typeMap[mk] = typeMap[mk] || { units: 0, value: 0, order: MODEL_RX.test(i.type) ? +i.type.match(MODEL_RX)[1] : 9 };
    ty.units += i.qty; ty.value += v;
    const sk = `${i.type}|${i.size}`;
    const sz = sizeMap[sk] = sizeMap[sk] || { type: i.type, size: i.size, units: 0, value: 0 };
    sz.units += i.qty; sz.value += v;
    if (MODEL_RX.test(i.type)) {
      const ik = inchMap[i.size] = inchMap[i.size] || { size: i.size, units: 0, value: 0 };
      ik.units += i.qty; ik.value += v;
    }
  }));
  // الوكلاء: طلبات عملاء الخارج تُنسب للوكيل المختار في الطلب، وإلا لوكيل دولة العميل
  const agentOf = o => {
    const d = DB.distributors.find(x => x.id === o.distributorId);
    if (isAgent(d)) return d;
    const c = custById(o.customerId);
    return c?.market === 'intl' ? territoryPartners(c).find(isAgent) : null;
  };
  const byAgent = (() => {
    const m = {};
    inRange.forEach(o => { const d = agentOf(o); if (!d) return; const k = d.id; m[k] = m[k] || { name: d.name, area: coverageLabel(d), units: 0, value: 0 }; m[k].units += o.items.reduce((s, i) => s + i.qty, 0); m[k].value += orderValue(o); });
    return Object.values(m).sort((a, b) => b.value - a.value);
  })();
  // أعلى المناطق الفرعية (قرى وأحياء) داخل المحافظة المختارة
  const govOrders = inRange.filter(o => { const c = custById(o.customerId); return c?.market === 'egypt' && c.govCode; });
  const govTotals = groupSum(govOrders, o => regionByCode(custById(o.customerId).govCode)?.gov || '');
  const subGov = st.gov || st.subGov || govTotals[0]?.[0] || '';
  const bySubArea = groupSum(govOrders.filter(o => regionByCode(custById(o.customerId).govCode)?.gov === subGov), o => { const c = custById(o.customerId); return custSubName(c) || `${t('بدون منطقة فرعية')} (${c.govCode})`; }).slice(0, 15);
  const byDistributor = (() => {
    const m = {};
    inRange.forEach(o => { if (!o.distributorId) return; const d = DB.distributors.find(x => x.id === o.distributorId); if (!d || isAgent(d)) return; const k = d.name; m[k] = m[k] || { units: 0, value: 0, type: d.type }; m[k].units += o.items.reduce((s, i) => s + i.qty, 0); m[k].value += orderValue(o); });
    return Object.entries(m).sort((a, b) => b[1].units - a[1].units);
  })();
  return {
    byType: Object.entries(typeMap).sort((a, b) => a[1].order - b[1].order || b[1].value - a[1].value).map(([k, v]) => [k, v.units, v.value]),
    bySize: Object.values(sizeMap).sort((a, b) => b.units - a.units),
    byInch: Object.values(inchMap).sort((a, b) => inchOf(a.size) - inchOf(b.size)),
    byCategory: groupSum(inRange, o => tv(custById(o.customerId)?.category) || t('غير محدد')),
    subGov, govList: govTotals.map(x => x[0]), bySubArea, byDistributor, byAgent,
    r, sales, prevSales: sum(prev), coll, count: inRange.length, prevCount: prev.length, unitsCount: units(inRange), custs,
    newCust: custs.filter(c => c.createdAt.slice(0, 10) >= r.from).length,
    buyers: new Set(inRange.map(o => o.customerId)).size,
    fups, voice: fups.filter(f => f.viaVoice).length,
    late: custs.filter(c => c.followupDate && c.followupDate < today()).length,
    cancelled: base.filter(o => o.status === 'cancelled' && o.date >= r.from).length,
    postponed: base.filter(o => o.status === 'postponed' && o.date >= r.from).length,
    months, repRows,
    byGov: groupSum(inRange, o => { const c = custById(o.customerId); return c ? custLocation(c) : ''; }).slice(0, 10),
    byDevice: Object.entries(devices).sort((a, b) => b[1] - a[1]).slice(0, 8),
    byCrop: groupSum(inRange, o => (custById(o.customerId)?.crops || []).map(tv)).slice(0, 8),
    bySource: groupSum(inRange, o => tv(custById(o.customerId)?.source) || t('غير محدد')).slice(0, 8),
    ratingCounts: RATINGS.map(x => [tv(x), custs.filter(c => c.rating === x).length]),
    payMix: Object.entries(PAY_TYPES).map(([k, l]) => [t(l), sum(inRange.filter(o => o.payType === k))]),
    funnel: stagesAll().map(s => [label(s), custs.filter(c => c.stageId === s.id).length]),
    afterDone: after.filter(a => a.status === 'done').length,
    afterDue: after.filter(a => a.status === 'pending' && a.due <= today()).length,
    satisfaction: scored.length ? scored.reduce((s, a) => s + a.satisfaction, 0) / scored.length : 0,
    openTickets: DB.tickets.filter(x => custIds.has(x.customerId) && ticketOpen(x)).length,
  };
}

// تصدير التحليل إلى ملف إكسيل متعدد الأوراق وفق عوامل التصفية الحالية
function exportAnalytics(st, a) {
  const scope = st.rep ? userName(st.rep) : t('الفريق');
  const pairs = (name, head, rows) => ({ name, rows: [head, ...rows] });
  const v = t('القيمة'), egp = `${t('القيمة')} (${t('ج.م')})`;
  const sheets = [
    pairs(t('الملخص'), [t('البند'), v], [
      [t('النطاق'), scope], [t('الفترة'), t(a.r.label)], [t('تاريخ التقرير'), fmtDate(today())],
      [t('قيمة المبيعات'), Math.round(a.sales)], [t('قيمة الفترة السابقة'), Math.round(a.prevSales)], [t('الطلبات'), a.count], [t('الأجهزة المباعة'), a.unitsCount],
      [t('المحصّل'), Math.round(a.coll)], [t('المتبقي للتحصيل'), Math.round(a.sales - a.coll)], [t('عملاء جدد'), a.newCust], [t('عملاء اشتروا في الفترة'), a.buyers],
      [t('متابعات مسجلة'), a.fups.length], [t('متابعات صوتية'), a.voice], [t('متابعات متأخرة'), a.late], [t('طلبات ملغاة'), a.cancelled], [t('طلبات مؤجلة'), a.postponed],
      [t('متابعات ما بعد البيع المنجزة'), a.afterDone], [t('متابعات ما بعد البيع المستحقة'), a.afterDue], [t('متوسط رضا العملاء'), a.satisfaction ? +a.satisfaction.toFixed(2) : ''], [t('طلبات دعم فني مفتوحة'), a.openTickets],
    ]),
    pairs(t('المبيعات الشهرية'), [t('الشهر'), egp, t('الطلبات'), t('الأجهزة')], a.months.map(m => [m.label, Math.round(m.value), m.count, m.units])),
    pairs(t('المناطق'), [t('المنطقة'), egp], a.byGov.map(x => [x[0], Math.round(x[1])])),
    pairs(t('الأجهزة'), [t('الجهاز'), t('العدد')], a.byDevice.map(([k, v]) => [k.replace(/[⁦-⁩]/g, ''), v])),
    pairs(t('المحاصيل'), [t('المحصول'), egp], a.byCrop.map(x => [x[0], Math.round(x[1])])),
    pairs(t('مصدر المعرفة'), [t('المصدر'), egp], a.bySource.map(x => [x[0], Math.round(x[1])])),
    pairs(t('طريقة الدفع'), [t('طريقة الدفع'), egp], a.payMix.map(x => [x[0], Math.round(x[1])])),
    pairs(t('مراحل العملاء'), [t('المرحلة'), t('العملاء')], a.funnel),
    pairs(t('الموديلات'), [t('الموديل'), t('العدد'), egp], a.byType.map(x => [x[0].replace(/[⁦-⁩]/g, ''), x[1], Math.round(x[2])])),
    pairs(t('المقاسات'), [t('المقاس'), t('العدد'), egp], a.byInch.map(x => [tv(x.size), x.units, Math.round(x.value)])),
    pairs(t('الأجهزة بالتفصيل'), [t('الجهاز'), t('المقاس'), t('العدد'), egp], a.bySize.map(x => [deviceText(x.type, x.size), tv(x.size), x.units, Math.round(x.value)])),
    pairs(t('تصنيف العملاء'), [t('التصنيف'), egp], a.byCategory.map(x => [x[0], Math.round(x[1])])),
    pairs(t('الوكلاء'), [t('الوكيل'), t('الدول'), t('الأجهزة'), egp], a.byAgent.map(x => [x.name, x.area, x.units, Math.round(x.value)])),
    pairs(t('المناطق الفرعية'), [t('المحافظة'), t('المنطقة'), egp], a.bySubArea.map(x => [govLabel(a.subGov), x[0], Math.round(x[1])])),
    pairs(t('الموزعون'), [t('الموزع'), t('التصنيف'), t('الأجهزة'), egp], a.byDistributor.map(([n, v]) => [n, tv(v.type), v.units, Math.round(v.value)])),
  ];
  if (!st.rep) sheets.splice(1, 0, pairs(t('أداء الفريق'), [t('رجل البيع'), egp, t('الطلبات'), t('الأجهزة'), t('المحصّل'), t('عدد العملاء'), t('متابعات'), t('متأخرة')], a.repRows.map(x => [x.u.name, Math.round(x.sales), x.orders, x.units, Math.round(x.coll), x.cust, x.fu, x.late])));
  downloadBlob(buildXlsx(sheets), `${t('تحليل المبيعات')} - ${scope} - ${today()}.xlsx`);
  audit('export', 'analytics', st.rep || null, st.rep ? 'تصدير تحليل مبيعات: {s}' : 'تصدير تحليل مبيعات الفريق', { s: scope });
  toast(t('تم تصدير التحليل'), 'ok');
}

function viewDashboard(root) {
  const st = dashState;
  const team = can('analytics.team');
  if (!team) st.rep = ME.id;
  const a = computeAnalytics(st);
  const delta = (x, y) => {
    if (!y) return `<span class="muted">${t('لا توجد فترة سابقة للمقارنة')}</span>`;
    const p = Math.round((x - y) / y * 100);
    return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}%</span> ${t('عن الفترة السابقة')}`;
  };
  const canExport = st.rep === ME.id ? can('analytics.export_own') || can('analytics.export_team') : can('analytics.export_team');
  const exportLabel = st.rep === ME.id ? 'تصدير تحليلي' : st.rep ? 'تصدير تحليل رجل البيع' : 'تصدير تحليل الفريق';
  const egp = t('ج.م');
  root.innerHTML = `<div class="page-head"><h1>${t(team ? 'تحليل المبيعات' : 'تحليل أدائي')}</h1><span class="spacer"></span>${canExport ? `<button class="btn primary" id="xp">⬇ ${t(exportLabel)}</button>` : ''}<div class="hint">${t('القيم بالجنيه المصري. تُحسب طلبات الدولار بسعر {r} ج.م، ولا تدخل الطلبات الملغاة والمؤجلة في المبيعات', { r: DB.settings.usdRate })}</div></div>
  <div class="filters">
    <select class="inp" id="period" aria-label="${t('الفترة')}">${optsT([['week', 'آخر 7 أيام'], ['month', 'هذا الشهر'], ['lastmonth', 'الشهر الماضي'], ['quarter', 'آخر 3 أشهر'], ['thisyear', 'هذه السنة'], ['year', 'آخر 12 شهرًا'], ['all', 'كل الفترات'], ['custom', 'فترة أحددها']], st.period)}</select>
    ${st.period === 'custom' ? dateRangeHtml(st) : ''}
    ${team ? `<select class="inp" id="rep" aria-label="${t('رجل البيع')}">${repOptions(st.rep)}</select>` : ''}
    <select class="inp" id="market" aria-label="${t('السوق')}">${optsT([['egypt', 'مصر'], ['intl', 'الخارج']], st.market, t('مصر والخارج'))}</select>
    <select class="inp" id="gov" aria-label="${t('المحافظة')}">${govOptions(st.gov)}</select>
  </div>
  <div class="section-bar">${t('المبيعات والتحصيل')}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">${t('قيمة المبيعات')}</div><div class="v">${money(a.sales)} <small>${egp}</small></div><div class="d">${delta(a.sales, a.prevSales)}</div></div>
    <div class="kpi"><div class="l">${t('الطلبات')}</div><div class="v">${a.count}</div><div class="d">${delta(a.count, a.prevCount)}</div></div>
    <div class="kpi"><div class="l">${t('الأجهزة المباعة')}</div><div class="v">${a.unitsCount}</div><div class="d">${t('متوسط الطلب {v} ج.م', { v: money(a.count ? a.sales / a.count : 0) })}</div></div>
    <div class="kpi ok"><div class="l">${t('المحصّل')}</div><div class="v">${money(a.coll)} <small>${egp}</small></div><div class="d">${t('{p}% من المبيعات', { p: a.sales ? Math.round(a.coll / a.sales * 100) : 0 })}</div></div>
    <div class="kpi warn"><div class="l">${t('المتبقي للتحصيل')}</div><div class="v">${money(a.sales - a.coll)} <small>${egp}</small></div></div>
  </div>
  <div class="card"><h3>${t('المبيعات الشهرية')}</h3><div class="sub">${t('آخر 12 شهرًا، والعمود الأغمق هو الشهر الحالي')}</div>${barChart(a.months)}</div>
  ${team && !st.rep ? `<div class="card"><h3>${t('أداء رجال البيع')}</h3><div class="sub">${t(a.r.label)}</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('رجل البيع')}</th><th>${t('المبيعات')}</th><th>${t('الطلبات')}</th><th>${t('الأجهزة')}</th><th>${t('المحصّل')}</th><th>${t('عدد العملاء')}</th><th>${t('متابعات')}</th><th>${t('متأخرة')}</th></tr></thead><tbody>${a.repRows.map(x => `<tr class="click" data-rep="${x.u.id}"><td><b>${esc(x.u.name)}</b></td><td>${money(x.sales)}</td><td>${x.orders}${x.shared ? ` <span class="pill p-after" title="${t('مبيعات مشتركة مع زميل تُحتسب للاثنين')}">🔗 ${x.shared}</span>` : ''}</td><td>${x.units}</td><td>${money(x.coll)}</td><td>${x.cust}</td><td>${x.fu}</td><td>${x.late ? `<span class="pill p-red">⚠ ${x.late}</span>` : '<span class="pill p-green">✓ 0</span>'}</td></tr>`).join('')}</tbody></table></div></div>` : ''}
  <div class="cols2">
    <div class="card"><h3>${t('المبيعات حسب المنطقة')}</h3><div class="sub">${t('أعلى 10 مناطق')} · ${egp}</div>${hbars(a.byGov, { fmt: moneyShort, h1: t('المنطقة') })}</div>
    <div class="card"><h3>${t('الأجهزة الأكثر مبيعًا')}</h3><div class="sub">${t('عدد الأجهزة')}</div>${hbars(a.byDevice, { h1: t('الجهاز'), h2: t('العدد') })}</div>
    <div class="card"><h3>${t('المبيعات حسب المحصول')}</h3><div class="sub">${egp} · ${t('يُحتسب العميل في كل محصول يزرعه')}</div>${hbars(a.byCrop, { fmt: moneyShort, h1: t('المحصول') })}</div>
    <div class="card"><h3>${t('مصدر المعرفة')}</h3><div class="sub">${t('المبيعات حسب مصدر العميل')} · ${egp}</div>${hbars(a.bySource, { fmt: moneyShort, h1: t('المصدر') })}</div>
    <div class="card"><h3>${t('طريقة الدفع')}</h3><div class="sub">${t('توزيع قيمة المبيعات')}</div>${stackBar(a.payMix, moneyShort)}</div>
    <div class="card"><h3>${t('تقييم العملاء')}</h3><div class="sub">${t('عدد العملاء في كل درجة')}</div>${stackBar(a.ratingCounts, v => `${v}`)}</div>
  </div>
  <div class="section-bar">${t('الأجهزة حسب قائمة الأسعار')}</div>
  <div class="cols2">
    <div class="card"><h3>${t('المبيعات حسب الموديل')}</h3><div class="sub">${t('الموديل يحدد درجة الملوحة التي يعالجها الجهاز')} · ${egp}</div>${hbars(a.byType.map(x => [x[0], x[2], `${moneyShort(x[2])} · ${t('العدد')} ${x[1]}`]), { fmt: moneyShort, h1: t('الموديل') })}</div>
    <div class="card"><h3>${t('المبيعات حسب المقاس')}</h3><div class="sub">${t('كل الموديلات')} · ${egp}</div>${hbars(a.byInch.map(x => [tv(x.size), x.value, `${moneyShort(x.value)} · ${t('العدد')} ${x.units}`]), { fmt: moneyShort, h1: t('المقاس') })}</div>
  </div>
  <div class="card"><h3>${t('الأجهزة المباعة بالتفصيل')}</h3><div class="sub">${t('كل مقاس مع موديله، من الأكثر مبيعًا')}</div>${a.bySize.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('الجهاز')}</th><th>${t('العدد')}</th><th>${t('القيمة')} (${egp})</th></tr></thead><tbody>${a.bySize.map(x => `<tr><td>${esc(deviceName(x.type, x.size))}</td><td><b>${x.units}</b></td><td>${money(x.value)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">${t('لا توجد بيانات في هذه الفترة')}</div>`}</div>
  <div class="section-bar">${t('العملاء والوكلاء')}</div>
  <div class="cols2">
    <div class="card"><h3>${t('المبيعات حسب تصنيف العميل')}</h3><div class="sub">${t('مزارع، مهندس زراعي، وكيل، موزع')} · ${egp}</div>${hbars(a.byCategory, { fmt: moneyShort, h1: t('التصنيف') })}</div>
    <div class="card"><h3>${t('مبيعات الوكلاء خارج مصر')}</h3><div class="sub">${t('حسب دولة العميل أو الوكيل المختار في الطلب')} · ${egp}</div>${a.byAgent.length ? hbars(a.byAgent.slice(0, 10).map(x => [`${x.name} (${x.area})`, x.value, `${moneyShort(x.value)} · ${t('العدد')} ${x.units}`]), { fmt: moneyShort, h1: t('الوكيل') }) : `<div class="empty">${t('لا توجد مبيعات خارج مصر في هذه الفترة')}</div>`}</div>
  </div>
  <div class="section-bar">${t('المناطق الأعلى مبيعًا داخل المحافظة')}</div>
  <div class="card"><div class="filters"><select class="inp" id="subGov" aria-label="${t('المحافظة')}" ${st.gov ? 'disabled' : ''}>${opts(a.govList.map(g => [g, govLabel(g)]), a.subGov)}</select><span class="muted">${t('القرى والأحياء والمراكز الأعلى مبيعًا')}</span></div>${hbars(a.bySubArea, { fmt: moneyShort, h1: t('المنطقة') })}</div>
  ${a.byDistributor.length ? `<div class="card"><h3>${t('الموزعون داخل مصر')}</h3><div class="sub">${t('عدد الأجهزة المباعة عن طريق كل موزع')}</div>${hbars(a.byDistributor.slice(0, 10).map(([n, v]) => [n, v.units, `${v.units} · ${tv(v.type)}`]), { h1: t('الموزع'), h2: t('الأجهزة') })}</div>` : ''}
  <div class="section-bar">${t('مسار العملاء وما بعد البيع')}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">${t('عملاء جدد')}</div><div class="v">${a.newCust}</div><div class="d">${t('اشترى منهم في الفترة: {n}', { n: a.buyers })}</div></div>
    <div class="kpi"><div class="l">${t('متابعات مسجلة')}</div><div class="v">${a.fups.length}</div><div class="d">${t('الصوتية منها: {n}', { n: a.voice })}</div></div>
    <div class="kpi ${a.late ? 'alert' : 'ok'}"><div class="l">${t('متابعات متأخرة')}</div><div class="v">${a.late}</div><div class="d">${t('ملغاة: {a} · مؤجلة: {b}', { a: a.cancelled, b: a.postponed })}</div></div>
    <div class="kpi"><div class="l">${t('متوسط رضا العملاء')}</div><div class="v">${a.satisfaction ? a.satisfaction.toFixed(1) : '—'} <small>/ 5</small></div><div class="d">${t('متابعات ما بعد البيع المنجزة: {n}', { n: a.afterDone })}</div></div>
    <div class="kpi ${a.openTickets ? 'warn' : 'ok'}"><div class="l">${t('طلبات دعم فني مفتوحة')}</div><div class="v">${a.openTickets}</div></div>
  </div>
  <div class="card"><h3>${t('العملاء حسب المرحلة')}</h3>${hbars(a.funnel.filter(x => x[1]), { h1: t('المرحلة'), h2: t('العملاء') })}</div>`;
  ['period', 'rep', 'market', 'gov', 'subGov'].forEach(k => {
    const el = $('#' + k, root);
    if (el) el.onchange = () => { st[k] = el.value; viewDashboard(root); };
  });
  bindDateRange(root, st, () => viewDashboard(root));
  const xp = $('#xp', root);
  if (xp) xp.onclick = () => exportAnalytics(st, a);
  $$('[data-rep]', root).forEach(tr => tr.onclick = () => { st.rep = tr.dataset.rep; viewDashboard(root); });
}

</script>
<script>
// شاشات الإدارة: النشاط، تصدير البيانات، المستخدمون والصلاحيات، الأكواد، مركز الإعدادات
const ACTION_LABELS = { login: 'دخول', logout: 'خروج', open: 'فتح النظام', create: 'إضافة', update: 'تعديل', followup: 'متابعة', call: 'مكالمة', stage: 'تغيير مرحلة', aftersale: 'ما بعد البيع', ticket: 'دعم فني', export: 'تنزيل بيانات', import: 'رفع ملف', archive: 'أرشفة', delete: 'حذف', view: 'فتح ملف', mail: 'بريد', grant: 'تصريح', user: 'مستخدم', backup: 'نسخة احتياطية', config: 'إعدادات' };
const actState = { tab: 'log', user: '', action: '', from: '', to: '', q: '', page: 1 };

function viewActivity(root) {
  const st = actState;
  root.innerHTML = `<div class="page-head"><h1>${t('نشاط الفريق')}</h1><span class="spacer"></span><button class="btn" id="exp">⬇ ${t('تصدير السجل')}</button><div class="hint">${t('جميع خطوات المستخدمين: الفتح والإغلاق، وتعديل الأرقام والأسماء، والطلبات، وتنزيل البيانات')}</div></div>
  <div class="tabs"><button class="tab ${st.tab === 'log' ? 'on' : ''}" data-t="log">${t('سجل الخطوات')}</button><button class="tab ${st.tab === 'sess' ? 'on' : ''}" data-t="sess">${t('فتح النظام وإغلاقه')}</button></div><div id="ab"></div>`;
  $$('.tab', root).forEach(b => b.onclick = () => { st.tab = b.dataset.t; viewActivity(root); });
  const ab = $('#ab', root);
  $('#exp', root).onclick = () => {
    const rows = [['الوقت', 'المستخدم', 'الخطوة', 'التفاصيل', 'التغييرات'].map(x => t(x)), ...DB.audit.map(a => [fmtDT(a.at), userName(a.userId), t(ACTION_LABELS[a.action] || a.action), auditLabel(a), a.changes.map(c => `${t(c.field)}: ${tv(c.from)} ← ${tv(c.to)}`).join(' | ')])];
    downloadBlob(buildXlsx([{ name: t('سجل النشاط'), rows }]), `${t('سجل النشاط')} ${today()}.xlsx`);
    audit('export', 'audit', null, 'تصدير سجل النشاط');
  };
  if (st.tab === 'sess') {
    const now = Date.now();
    const list = DB.sessions.filter(s => !st.user || s.userId === st.user).slice(0, 200);
    ab.innerHTML = `<div class="filters"><select class="inp" id="u" aria-label="${t('المستخدم')}">${opts(DB.users.map(u => [u.id, u.name]), st.user, t('جميع المستخدمين'))}</select></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('المستخدم')}</th><th>${t('الفتح')}</th><th>${t('الإغلاق')}</th><th>${t('المدة')}</th><th>${t('الحالة')}</th></tr></thead><tbody>${list.map(s => {
      const live = !s.end && now - new Date(s.lastSeen).getTime() < 3 * 60000;
      const endT = s.end || s.lastSeen, mins = Math.round((new Date(endT) - new Date(s.start)) / 60000);
      return `<tr><td><b>${esc(userName(s.userId))}</b></td><td>${fmtDT(s.start)}</td><td>${live ? '—' : fmtDT(endT)}</td><td>${t('{h} س {m} د', { h: Math.floor(mins / 60), m: mins % 60 })}</td><td>${live ? `<span class="pill p-green">● ${t('متصل الآن')}</span>` : `<span class="pill p-gray">${t('مغلق')}</span>`}</td></tr>`;
    }).join('')}</tbody></table></div>`;
    $('#u', ab).onchange = e => { st.user = e.target.value; viewActivity(root); };
    return;
  }
  ab.innerHTML = `<div class="filters"><select class="inp" id="u" aria-label="${t('المستخدم')}">${opts(DB.users.map(u => [u.id, u.name]), st.user, t('جميع المستخدمين'))}</select><select class="inp" id="a" aria-label="${t('الخطوة')}">${optsT(Object.entries(ACTION_LABELS), st.action, t('جميع الخطوات'))}</select><input class="inp" type="date" id="f" value="${st.from}" aria-label="${t('من')}"><input class="inp" type="date" id="to" value="${st.to}" aria-label="${t('إلى')}"><input class="inp search" id="q" placeholder="${t('ابحث في التفاصيل')}" value="${esc(st.q)}"></div><div id="al"></div>`;
  const draw = () => {
    const q = st.q.trim();
    const list = DB.audit.filter(a => (!st.user || a.userId === st.user) && (!st.action || a.action === st.action) && (!st.from || a.at.slice(0, 10) >= st.from) && (!st.to || a.at.slice(0, 10) <= st.to) && (!q || a.label.includes(q) || auditLabel(a).includes(q) || a.changes.some(c => `${c.field} ${c.from} ${c.to}`.includes(q))));
    const pages = Math.max(1, Math.ceil(list.length / 50));
    st.page = Math.min(st.page, pages);
    const el = $('#al', ab);
    el.innerHTML = list.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${t('الوقت')}</th><th>${t('المستخدم')}</th><th>${t('الخطوة')}</th><th>${t('التفاصيل')}</th></tr></thead><tbody>${list.slice((st.page - 1) * 50, st.page * 50).map(a => `<tr><td>${fmtDT(a.at)}</td><td><b>${esc(userName(a.userId))}</b></td><td><span class="pill ${a.action === 'update' || a.action === 'config' ? 'p-orange' : a.action === 'export' ? 'p-blue' : a.action === 'archive' || a.action === 'delete' ? 'p-red' : 'p-gray'}">${t(ACTION_LABELS[a.action] || a.action)}</span></td><td class="wrap">${esc(auditLabel(a))}${a.changes.map(c => `<div class="change"><b>${esc(t(c.field))}:</b> ${c.from ? `<del>${esc(tv(c.from))}</del> ← ` : ''}<ins>${esc(tv(c.to))}</ins></div>`).join('')}</td></tr>`).join('')}</tbody></table><div class="pager"><button class="btn sm" id="pp" ${st.page <= 1 ? 'disabled' : ''}>${t('السابق')}</button><span>${t('صفحة {a} من {b}', { a: st.page, b: pages })}</span><button class="btn sm" id="np" ${st.page >= pages ? 'disabled' : ''}>${t('التالي')}</button></div></div>` : `<div class="card empty">${t('لا توجد خطوات مطابقة')}</div>`;
    const pp = $('#pp', el), np = $('#np', el);
    if (pp) pp.onclick = () => { st.page--; draw(); };
    if (np) np.onclick = () => { st.page++; draw(); };
  };
  const bind = (id, k) => { $(id, ab).onchange = e => { st[k] = e.target.value; st.page = 1; draw(); }; };
  bind('#u', 'user'); bind('#a', 'action'); bind('#f', 'from'); bind('#to', 'to');
  $('#q', ab).oninput = e => { st.q = e.target.value; st.page = 1; draw(); };
  draw();
}

function viewRegions(root) {
  root.innerHTML = `<div class="page-head"><h1>${t('أكواد المناطق')}</h1><div class="hint">${t('الأكواد الرئيسية: {a}، والمناطق الفرعية: {b}، والأرقام المجاورة هي عدد العملاء', { a: REGIONS.length, b: REGIONS.reduce((s, r) => s + r.items.length, 0) })}</div></div>
  <div class="filters"><input class="inp search" id="q" placeholder="${t('ابحث بالكود أو المحافظة أو المنطقة')}"><select class="inp" id="g" aria-label="${t('المحافظة')}">${govOptions('')}</select></div><div id="rl"></div>`;
  const counts = {};
  visibleCustomers().forEach(c => { if (c.govCode) counts[c.govCode] = (counts[c.govCode] || 0) + 1; if (c.subCode) counts[c.subCode] = (counts[c.subCode] || 0) + 1; });
  const draw = () => {
    const q = $('#q', root).value.trim(), g = $('#g', root).value;
    const list = REGIONS.filter(r => !g || r.gov === g).map(r => {
      const hit = !q || r.code.toLowerCase() === q.toLowerCase() || r.gov.includes(q) || r.main.includes(q) || govLabel(r.gov).toLowerCase().includes(q.toLowerCase());
      return { r, items: hit ? r.items : r.items.filter(i => i.name.includes(q) || i.code.toLowerCase() === q.toLowerCase()) };
    }).filter(x => x.items.length);
    $('#rl', root).innerHTML = list.length ? list.map(({ r, items }) => `<div class="season-card"><div class="season-head" style="cursor:default"><span class="code-tag">${r.code}</span><b>${esc(govLabel(r.gov))}</b><span class="muted">${esc(r.main === 'المناطق الرئيسية' ? t('المناطق الرئيسية') : r.main)}</span><span class="count">${t('العملاء: {n}', { n: counts[r.code] || 0 })}</span></div><div class="season-body"><div class="chips">${items.map(i => `<span class="pill p-gray" title="${esc(i.section)}"><span class="code-tag">${i.code}</span> ${esc(i.name)}${counts[i.code] ? ` <b>(${counts[i.code]})</b>` : ''}</span>`).join('')}</div></div></div>`).join('') : `<div class="card empty">${t('لا توجد نتائج')}</div>`;
  };
  $('#q', root).oninput = draw;
  $('#g', root).onchange = draw;
  draw();
}

      body: `${nameFields(s?.name, s?.en)}<div class="grid2"><div class="field"><label>${t('القسم')}</label><select class="inp" id="fg" ${s?.type && s.type !== 'open' ? 'disabled' : ''}>${optsT([['sales', 'المبيعات'], ['aftersales', 'ما بعد البيع']], s?.group || 'sales')}</select></div><div class="field"><label>${t('المجال')}</label><select class="inp" id="fd">${opts(DB.domains.map(d => [d.id, label(d)]), s?.domainId || '', t('جميع المجالات'))}</select></div></div>`,
      footer: `<button class="btn primary" id="sv">${t('حفظ')}</button>`,

        const anchor = data.group === 'sales' ? DB.stages.find(x => x.type === 'won')?.order ?? 60 : Math.max(...DB.stages.filter(x => x.group === 'aftersales').map(x => x.order), 60) + 1;

  $$('[data-dn]', sb).forEach(b => b.onclick = () => swap(b.dataset.dn, 1));
  $$('[data-tg]', sb).forEach(b => b.onclick = () => {

    redraw();
  });
}

function drawLists(sb, redraw) {

    if (exists) { toast(t('المحصول موجود بالفعل: {c}', { c: tv(exists.name) }), 'err'); return; }

function drawMail(sb) {
  if (cloudMode) {
    sb.innerHTML = mailRecipientsHtml() + `<div class="card"><h3>${t('الإرسال اليومي من سيرفرات جوجل')}</h3><p class="muted" style="margin-top:0">${t('يُرسل البريد كل يوم الساعة 8 صباحًا من آخر البيانات المحفوظة، حتى لو كانت كل الأجهزة مغلقة.')}</p><div class="chips"><button class="btn primary" id="sn">📧 ${t('إرسال البريد الآن')}</button><button class="btn" id="tst">✉ ${t('إرسال بريد تجريبي')}</button></div><p class="muted mt" id="st"></p>
      <p class="muted">${t('البريد التجريبي رسالة قصيرة دون مرفق تصل لكل المستلمين. إذا لم تظهر في الوارد فابحث عنها في الرسائل المزعجة (Spam) واضغط "ليست رسالة مزعجة".')}</p></div>`;
    bindMailRecipients(sb);
    $('#tst', sb).onclick = async () => {
      const b = $('#tst', sb), st = $('#st', sb);
      b.disabled = true;
      st.textContent = t('جارٍ الإرسال...');
      try {
        await syncNow();
        const out = await cloudCall('test');
        if (out.error === 'unknown action') throw new Error(t('يلزم تحديث خدمة جوجل'));
        if (!out.ok) throw new Error(out.error);
        st.textContent = t('أُرسل البريد التجريبي إلى: {list}', { list: (out.sent || []).join('، ') || '—' });
        audit('mail', 'mail', null, 'إرسال بريد تجريبي إلى المستلمين');
      } catch (err) { st.textContent = t('تعذر الاتصال بالخدمة: {e}', { e: err.message }); }
      b.disabled = false;
    };
    $('#sn', sb).onclick = async () => {
      const b = $('#sn', sb), st = $('#st', sb);
      b.disabled = true;
      st.textContent = t('جارٍ الإرسال...');
      try {
        await syncNow();
        const out = await cloudCall('send');
        if (!out.ok) throw new Error(out.error);
        st.textContent = t('تم إرسال البريد');
        audit('mail', 'mail', null, 'إرسال بريد المتابعة من سيرفرات جوجل');
      } catch (err) { st.textContent = t('تعذر الاتصال بالخدمة: {e}', { e: err.message }); }
      b.disabled = false;
    };
    return;
  }
  let lastAt = '';
  try { lastAt = localStorage.getItem(CLOUD_AT_KEY) || ''; } catch {}
  sb.innerHTML = mailRecipientsHtml() + `<div class="card"><h3>${t('الإرسال اليومي من سيرفرات جوجل')}</h3><p class="muted" style="margin-top:0">${t('يُرسل البريد كل يوم الساعة 8 صباحًا حتى لو كان الجهاز مغلقًا، ويعتمد على آخر بيانات رُفعت من النظام أثناء فتحه.')}</p>
  <div class="field"><label>${t('رابط الخدمة')}</label><input class="inp" dir="ltr" id="mu" value="${esc(DB.settings.mailSyncUrl || '')}" placeholder="https://script.google.com/macros/s/.../exec"></div>
  <div class="field"><label>${t('مفتاح المزامنة')}</label><input class="inp" dir="ltr" id="mk" type="text" autocomplete="off" spellcheck="false" style="-webkit-text-security:disc" value="${esc(DB.settings.mailSyncKey || '')}"></div>
  <div class="chips"><button class="btn primary" id="sv">${t('حفظ ورفع البيانات')}</button><button class="btn" id="sn" ${cloudReady() ? '' : 'disabled'}>📧 ${t('إرسال البريد الآن')}</button></div>
  <p class="muted mt" id="st">${cloudReady() ? (lastAt ? t('آخر رفع للبيانات: {d}', { d: fmtDT(lastAt) }) : t('لم تُرفع البيانات بعد')) : t('الخدمة غير مفعلة بعد. خطوات التفعيل في ملف README.md')}</p></div>`;
  bindMailRecipients(sb);
  const st = $('#st', sb), sv = $('#sv', sb), sn = $('#sn', sb);
  sv.onclick = async () => {
    const url = $('#mu', sb).value.trim(), key = $('#mk', sb).value.trim();
    if (url && !/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)) { toast(t('رابط الخدمة غير صحيح. يجب أن ينتهي بـ exec'), 'err'); return; }
    DB.settings.mailSyncUrl = url;
    DB.settings.mailSyncKey = key;
    audit('config', 'settings', 'mail', 'تعديل إعدادات البريد اليومي');
    if (!cloudReady()) { sn.disabled = true; st.textContent = t('الخدمة غير مفعلة بعد. خطوات التفعيل في ملف README.md'); return; }
    sv.disabled = true;
    st.textContent = t('جارٍ رفع البيانات...');
    try {
      await cloudSync(true);
      sn.disabled = false;
      st.textContent = t('آخر رفع للبيانات: {d}', { d: fmtDT(nowStamp()) });
      toast(t('تم رفع البيانات'), 'ok');
    } catch (err) { st.textContent = t('تعذر الاتصال بالخدمة: {e}', { e: err.message }); }
    sv.disabled = false;
  };
  sn.onclick = async () => {
    sn.disabled = true;
    st.textContent = t('جارٍ الإرسال...');
    try {
      await cloudSync(true);
      await cloudPost('send');
      st.textContent = t('تم إرسال البريد');
      toast(t('تم إرسال البريد'), 'ok');
      audit('mail', 'mail', null, 'إرسال بريد المتابعة من سيرفرات جوجل');
    } catch (err) { st.textContent = t('تعذر الاتصال بالخدمة: {e}', { e: err.message }); }
    sn.disabled = false;
  };
}
function drawGeneral(sb) {
  sb.innerHTML = `<div class="card"><div class="grid2"><div class="field"><label>${t('سعر الدولار (ج.م)')}</label><input class="inp" type="number" min="1" id="rate" value="${DB.settings.usdRate}"></div></div><button class="btn primary" id="sv">${t('حفظ')}</button></div>`;
  $('#sv', sb).onclick = () => {
    const rate = +$('#rate', sb).value;
    if (!(rate > 0)) { toast(t('يجب أن يكون سعر الدولار أكبر من صفر'), 'err'); return; }
    audit('config', 'settings', 'general', 'تعديل الإعدادات العامة', null, [{ field: 'سعر الدولار', from: String(DB.settings.usdRate), to: String(rate) }]);
    DB.settings.usdRate = rate;
    saveDB();
    toast(t('تم الحفظ'), 'ok');
  };
}
function drawData(sb, redraw) {
  const snap = readSnapshot();
  const backup = can('data.backup'), reset = can('data.reset');
  sb.innerHTML = `<div class="demo-banner">${t(serverOn ? 'البيانات محفوظة في مجلد data داخل مجلد النظام على هذا الجهاز، مع نسخة احتياطية يومية من الملف.' : 'البيانات في النسخة التجريبية محفوظة في هذا المتصفح فقط. يرجى تنزيل نسخة احتياطية قبل مسح بيانات المتصفح.')}</div>
  ${snap?.data && backup ? `<div class="card" style="border-inline-start:4px solid var(--green)"><div class="row-card"><div class="grow"><b style="color:var(--navy)">${t('نسخة تلقائية جاهزة للاسترجاع')}</b><div class="muted">${t('حُفظت في {d} قبل: {r}', { d: fmtDT(snap.at), r: t(snap.reason) })} · ${t('العملاء: {n}', { n: snap.data.customers.filter(c => !c.archived).length })} · ${t('الطلبات: {n}', { n: snap.data.orders.length })}</div></div><button class="btn primary" id="undo">↩ ${t('استرجاع هذه البيانات')}</button></div></div>` : ''}
  ${backup ? `<div class="card"><div class="chips"><button class="btn" id="bk">⬇ ${t('نسخة احتياطية')}</button><label class="btn">⬆ ${t('استرجاع نسخة')}<input type="file" id="rs" accept=".json" hidden></label></div></div>` : ''}
  ${reset ? `<div class="section-bar danger-bar">${t('منطقة خطرة')}</div><div class="card"><p class="muted" style="margin-top:0">${t('قبل أي عملية هنا ينزّل النظام نسخة احتياطية ويحتفظ بنسخة تلقائية يمكن استرجاعها من الشاشة نفسها.')}</p><div class="chips"><button class="btn danger" id="demo">${t('إعادة البيانات التجريبية')}</button><button class="btn danger" id="wipe">${t('مسح جميع البيانات والبدء من جديد')}</button></div></div>` : ''}`;
  const on = (sel, fn) => { const el = $(sel, sb); if (el) el.onclick = fn; };
  on('#undo', () => confirmBox(t('استرجاع النسخة التلقائية'), t('ستُستبدل البيانات الحالية بهذه النسخة، وستحتاج إلى تسجيل الدخول مرة أخرى.'), () => {
    if (restoreSnapshot()) reloadSynced();
    else toast(t('النسخة التلقائية غير سليمة'), 'err');
  }, t('استرجاع')));
  on('#bk', () => {
    downloadBlob(new Blob([JSON.stringify(DB)], { type: 'application/json' }), `delta-crm-backup-${today()}.json`);
    audit('backup', 'db', null, 'تنزيل نسخة احتياطية');
  });
  const rs = $('#rs', sb);
  if (rs) rs.onchange = async e => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      if (!data.users || !data.customers) throw new Error();
      confirmBox(t('استرجاع نسخة'), t('ستُستبدل البيانات الحالية بالكامل بهذه النسخة.'), () => { saveSnapshot('استرجاع ملف نسخة'); DB = data; saveDB(); reloadSynced(); }, t('استرجاع'));
    } catch { toast(t('الملف ليس نسخة احتياطية سليمة'), 'err'); }
  };
  on('#demo', () => dangerReset('إعادة البيانات التجريبية', 'ستُستبدل جميع البيانات الحالية بالبيانات التجريبية.', 'إعادة', true));
  on('#wipe', () => dangerReset('مسح جميع البيانات', 'ستُحذف جميع بيانات العملاء والطلبات والسجل وحسابات رجال البيع، ويبقى حساب الإدارة ومدير المبيعات والأكواد وجدول المحاصيل الأصلي.', 'مسح', false));
}

// العمليات التي تمسح كل البيانات: تتطلب كتابة كلمة التأكيد، وتُحفظ نسخة قبل التنفيذ
function dangerReset(titleKey, textKey, word, withDemo) {
  const wordShown = t(word);
  const m = openModal({
    title: t(titleKey),
    body: `<p style="margin-top:0">${t(textKey)}</p><p>${t('لديك الآن: العملاء {a}، الطلبات {b}. سينزل ملف نسخة احتياطية على جهازك قبل التنفيذ، وتبقى نسخة تلقائية في هذه الشاشة.', { a: liveCustomers().length, b: DB.orders.length })}</p>
    <div class="field"><label for="dw">${t('للتأكيد اكتب كلمة')} <b>${wordShown}</b></label><input class="inp" id="dw" autocomplete="off"></div>`,
    footer: `<button class="btn danger" id="go" disabled>${t(titleKey)}</button><button class="btn" id="no">${t('رجوع')}</button>`,
  });
  const go = $('#go', m.el);
  $('#dw', m.el).oninput = e => { go.disabled = e.target.value.trim() !== wordShown; };
  $('#no', m.el).onclick = m.close;
  go.onclick = async () => {
    go.disabled = true;
    downloadBlob(new Blob([JSON.stringify(DB)], { type: 'application/json' }), `delta-crm-backup-${today()}.json`);
    if (!saveSnapshot(titleKey)) toast(t('المساحة غير كافية للنسخة التلقائية، واعتمد على الملف الذي نزل'), 'err');
    // مهلة قصيرة ليبدأ تنزيل الملف قبل إعادة تحميل الصفحة
    await new Promise(r => setTimeout(r, 900));
    localStorage.removeItem(SESSION_KEY);
    await resetDB(withDemo);
    reloadSynced();
  };
}

</script>
<script>
// التشغيل والتنقل وتسجيل الدخول
const NAV = [
  { group: 'العمل اليومي' },
  { path: 'today', label: 'لوحة اليوم', ic: '☀', view: viewToday },
  { path: 'calendar', label: 'التقويم', ic: '🗓', view: viewCalendar },
  { path: 'notifications', label: 'التنبيهات', ic: '🔔', view: viewNotifications },
  { group: 'العملاء' },
  { path: 'pipeline', label: 'مسار العملاء', ic: '🧭', view: viewPipeline },
  { path: 'egypt', label: 'عملاء مصر', ic: '📋', view: r => viewCustomers(r, 'egypt') },
  { path: 'intl', label: 'عملاء الخارج', ic: '🌍', view: r => viewCustomers(r, 'intl') },
  { path: 'shared', label: 'العملاء المشتركون', ic: '🔗', view: viewShared },
  { path: 'season', label: 'مواسم المحاصيل', ic: '🌱', view: viewSeason },
  { path: 'regions', label: 'أكواد المناطق', ic: '📍', view: viewRegions },

  { path: 'agents', label: 'الوكلاء', ic: '🌐', view: viewAgents, show: () => can('distributors.view') },
  { path: 'distributors', label: 'الموزعون', ic: '🏪', view: viewDistributors, show: () => can('distributors.view') },
  { group: 'ما بعد البيع', show: () => can('aftersales.view') || can('support.view') },
  { path: 'buyers', label: 'العملاء المشترون', ic: '✅', view: viewBuyers, show: () => can('aftersales.view') },
  { path: 'aftersales', label: 'متابعات ما بعد البيع', ic: '🤝', view: viewAfterSales, show: () => can('aftersales.view') },
  { path: 'support', label: 'الدعم الفني', ic: '🛠', view: viewSupport, show: () => can('support.view') },
  { group: 'التقارير' },
  { path: 'dashboard', label: 'تحليل المبيعات', ic: '📊', view: viewDashboard, show: () => can('analytics.own') || can('analytics.team') },
  { path: 'exports', label: 'تصدير البيانات', ic: '⬇', view: viewExports },
  { group: 'الإدارة', show: () => can('activity.view') || canTeam() || settingsTabs().length > 0 },
  { path: 'activity', label: 'نشاط الفريق', ic: '👁', view: viewActivity, show: () => can('activity.view') },
  { path: 'team', label: 'المستخدمون والصلاحيات', ic: '👥', view: viewTeam, show: () => canTeam() },
  { path: 'settings', label: 'الإعدادات', ic: '⚙', view: viewSettings, show: () => settingsTabs().length > 0 },
];
const navVisible = n => !n.show || n.show();
const langButton = () => `<button class="lang-btn" id="lang" aria-label="${LANG === 'ar' ? 'Switch to English' : 'التبديل إلى العربية'}">${LANG === 'ar' ? 'English' : 'العربية'}</button>`;
const bindLang = () => { const b = $('#lang'); if (b) b.onclick = () => setLang(LANG === 'ar' ? 'en' : 'ar'); };

function renderLogin(msg) {
  // أزرار التنقل بين الأدوار تبقى ما دامت البيانات تجريبية، وتختفي عند بدء البيانات الفعلية
  const demo = DB.settings.demo;
  const demoUsers = DB.users.filter(u => u.active && !/^tst\./.test(u.username));
  // أول حساب لكل دور له كلمة مرور، فالحساب الذي لم تُحدد كلمة مروره بعد لا يظهر هنا
  const shown = demoUsers.filter(u => u.passHash).filter((u, i, a) => a.findIndex(x => x.role === u.role) === i);
  $('#app').innerHTML = `<main class="login-page"><div class="login-card">
    <div class="login-top"><span class="spacer"></span>${langButton()}</div>
    ${loginLogo()}<div class="sub">${t('نظام إدارة العملاء والمبيعات')}</div>
    ${msg ? `<div class="err-msg" role="alert">${esc(t(msg))}</div>` : ''}
    <form id="loginForm" method="post" action="#" autocomplete="on">
      <div class="field"><label for="username">${t('اسم المستخدم')}</label><input class="inp" dir="ltr" id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">${t('كلمة المرور')}</label><input class="inp" dir="ltr" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary" style="width:100%" type="submit">${t('تسجيل الدخول')}</button>
    </form>
    ${demo ? `<div class="demo-box"><p>${t('نسخة تجريبية: جرّب الدخول بدور')}</p><div class="demo-btns">${shown.map(u => `<button class="btn sm" data-demo="${esc(u.username)}">${esc(roleName(u))}</button>`).join('')}</div></div>` : ''}
  </div></main>`;
  bindLang();
  $('#loginForm').onsubmit = async e => {
    e.preventDefault();
    const res = await login($('#username').value, $('#password').value);
    if (res.error) { renderLogin(res.error); return; }
    // تغيير الرابط بعد الدخول يتيح لمتصفح Chrome عرض حفظ بيانات الدخول، ورابط البحث برقم من التطبيق يبقى كما هو
    history.pushState(null, '', location.hash.startsWith('#/find/') ? location.hash : '#/today');
    route();
  };
  $$('[data-demo]').forEach(b => b.onclick = async () => {
    await login(b.dataset.demo, DEMO_PASSWORD);
    history.replaceState(null, '', '#/today');
    route();
  });
}

function renderShell(path) {
  const lateCount = overdue().length;
  const instLate = installmentAlerts().filter(i => i.late).length;
  const asDue = can('aftersales.view') ? afterSalesDue().length : 0;
  const tkNew = visibleTickets().filter(x => x.status === 'new').length;
  const td = today(), bIds = can('aftersales.view') ? buyerIds() : new Set();
  const buyersDue = visibleCustomers().filter(c => bIds.has(c.id) && c.asNextDate && c.asNextDate <= td).length;
  const sharedDue = visibleCustomers().filter(c => (c.assistantIds || []).length && involvedIn(c, ME.id) && c.followupDate && c.followupDate <= td).length;
  const badges = { shared: sharedDue, today: lateCount, notifications: myNotifications().length, orders: instLate, aftersales: asDue, buyers: buyersDue, support: tkNew };

function route() {
  viewDirty = false;
  $('#modal-root').querySelectorAll('.drawer, .drawer-back').forEach(x => x.remove());
  if (!ME) { renderLogin(); return; }
  if (ME.mustChangePw) { renderSetPassword(); return; }
  const [, path = 'today', sub] = location.hash.split('/');
  // رابط من تطبيق كاشف المتصلين: #/find/رقم يفتح ملف العميل، أو نموذج عميل جديد بالرقم إذا لم يكن مسجلًا
  if (path === 'find') {
    history.replaceState(null, '', '#/today');
    route();
    openByPhone(decodeURIComponent(sub || ''));
    return;
  }
  const item = NAV.find(n => n.path === path && navVisible(n)) || NAV.find(n => n.path === 'today');
  renderShell(item.path);
  const view = $('#view');
  try {
    item.view(view, sub);
  } catch (err) {
    console.error(err);
    view.innerHTML = `<div class="err-msg">${t('حدثت مشكلة في عرض الصفحة:')} ${esc(err.message)}</div>`;
  }
  scrollTo(0, 0);
  resumePendingCall();
}

window.addEventListener('hashchange', route);
function openByPhone(num) {
  const n = String(num || '').trim();
  if (!n) return;
  const c = findDuplicate([n]);
  if (c && customerVisible(c)) { openCustomer(c.id); return; }
  if (c) { toast(t('هذا الرقم مسجل باسم "{name}" لدى {owner}', { name: c.name, owner: userName(c.ownerId) }), 'err'); return; }
  if (!can('customers.create')) { toast(t('هذا الرقم غير مسجل في النظام'), 'err'); return; }
  // الرقم الذي يبدأ بمفتاح دولة غير مصر يُسجَّل عميلًا بالخارج
  const intl = /^(\+|00)/.test(n) && !/^(\+|00)20/.test(n);
  openWizard(intl ? 'intl' : 'egypt', { phone1: n, country: intl ? countryFromPhone(n)?.name || '' : '' });
}
// تنزيل تطبيق كاشف المتصلين من Drive الشركة عبر خدمة جوجل
async function downloadCallerApp(btn) {
  btn.disabled = true;
  toast(t('جارٍ تنزيل التطبيق...'));
  try {
    const out = await cloudCall('app');
    if (out.error === 'unknown action') throw new Error(t('يلزم تحديث خدمة جوجل'));
    if (!out.ok) throw new Error(out.error === 'not found' ? t('لم يُرفع ملف التطبيق بعد') : out.error);
    downloadBlob(new Blob([fromBase64(out.data)], { type: 'application/vnd.android.package-archive' }), out.name || 'delta-crm-callerid.apk');
    audit('export', 'app', null, 'تنزيل تطبيق كاشف المتصلين');
    openModal({ title: t('تثبيت تطبيق كاشف المتصلين'), body: `<ol style="margin:0;padding-inline-start:20px;line-height:1.9">${['افتح الملف المنزَّل من إشعار التنزيل أو من مجلد التنزيلات', 'إذا طُلب، اسمح لـ Chrome بتثبيت التطبيقات، ثم اضغط تثبيت', 'إذا ظهرت رسالة "تطبيق غير معروف"، اختر التثبيت على أي حال، فهو تطبيق الشركة الخاص', 'افتح التطبيق وسجّل الدخول بكود الاتصال واسم المستخدم وكلمة المرور', 'اضغط أزرار التفعيل الثلاثة في التطبيق حتى تظهر علامة ✓ أمام كل منها'].map(s => `<li>${t(s)}</li>`).join('')}</ol><p class="muted">${t('يعمل على أندرويد 10 فأحدث فقط')}</p>` });
  } catch (err) { toast(err.message, 'err'); }
  btn.disabled = false;
}
// أول دخول بكلمة مرور مؤقتة: يختار صاحب الحساب كلمة مروره قبل فتح النظام
function renderSetPassword(msg) {
  $('#app').innerHTML = `<main class="login-page"><div class="login-card">
    ${loginLogo()}<div class="sub">${t('مرحبًا {name}. اختر كلمة مرور خاصة بك قبل البدء', { name: esc(ME.name) })}</div>
    ${msg ? `<div class="err-msg" role="alert">${esc(t(msg))}</div>` : ''}
    <form id="pwForm"><input type="text" autocomplete="username" value="${esc(ME.username)}" hidden>
      <div class="field"><label>${t('اسم المستخدم')}</label><div class="inp ltr" style="background:var(--bg)">${esc(ME.username)}</div></div>
      <div class="field"><label for="np1">${t('كلمة المرور الجديدة')}</label><input class="inp" dir="ltr" id="np1" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="np2">${t('تأكيد كلمة المرور')}</label><input class="inp" dir="ltr" id="np2" type="password" autocomplete="new-password" required></div>
      <small class="muted">${t('8 أحرف على الأقل، ولا تُشارك كلمة المرور مع أحد')}</small>
      <button class="btn primary mt" style="width:100%" type="submit">${t('حفظ والدخول')}</button>
    </form><button class="btn sm mt" id="pwOut">${t('خروج')}</button>
  </div></main>`;
  $('#pwOut').onclick = signOut;
  $('#pwForm').onsubmit = async e => {
    e.preventDefault();
    const a = $('#np1').value, b = $('#np2').value;
    if (a.length < 8) { renderSetPassword('يجب ألا تقل كلمة المرور عن 8 أحرف'); return; }
    if (a !== b) { renderSetPassword('كلمتا المرور غير متطابقتين'); return; }
    if (a === DEMO_PASSWORD) { renderSetPassword('اختر كلمة مرور مختلفة عن كلمة المرور المؤقتة'); return; }
    ME.passHash = await sha(a);
    delete ME.mustChangePw;
    audit('user', 'user', ME.id, 'تغيير كلمة المرور');
    history.pushState(null, '', '#/today');
    route();
  };
}
function renderKeyGate(msg) {
  $('#app').innerHTML = `<main class="login-page"><div class="login-card">

    <form id="keyForm"><div class="field"><label for="ck">${t('كود الاتصال')}</label><input class="inp" dir="ltr" id="ck" type="text" autocomplete="off" spellcheck="false" style="-webkit-text-security:disc" required></div><button class="btn primary" style="width:100%" type="submit">${t('دخول')}</button></form>
  </div></main>`;
  $('#keyForm').onsubmit = e => {
    e.preventDefault();
    localStorage.setItem(CLOUD_KEY_STORE, $('#ck').value.trim());
    reloadApp();
  };
}

function softReload() {
  clearTimeout(pushTimer);
  conflicted = false; pushing = false; pushDirty = false; serverOn = false; serverRev = 0; lastRev = 0; DB = null; ME = null;
  $('#modal-root').innerHTML = '';
  [custState.egypt, custState.intl, orderState, dashState, calState, pipeState].forEach(s => { s.rep = ''; });
  boot();
}
// تسجيل الخروج يعرض صفحة الدخول فورًا، ويُحفظ في الخلفية دون انتظار رفع البيانات أو إعادة تحميل الصفحة
function signOut() {
  logout();
  history.replaceState(null, '', location.pathname);
  $('#modal-root').innerHTML = '';
  document.body.classList.remove('no-scroll');
  [custState.egypt, custState.intl, orderState, dashState, calState, pipeState].forEach(s => { s.rep = ''; });
  renderLogin();
  window.scrollTo(0, 0);
  syncNow().catch(() => {});
}
function reloadApp() {
  if (framed) softReload();
  else location.reload();
}
async function boot() {
  try {
    await loadDB();
  } catch (err) {
    console.error(err);
    if (err.message === 'needs-key') renderKeyGate();
    else if (err.message === 'suspended') renderSuspended();
    else $('#app').innerHTML = `<main class="login-page"><div class="login-card"><div class="err-msg" role="alert">${t('تعذر الوصول إلى البيانات. تأكد من الاتصال بالإنترنت ثم أعد المحاولة')}</div><button class="btn primary" style="width:100%" onclick="reloadApp()">${t('إعادة المحاولة')}</button></div></main>`;
    return;
  }
  resumeSession();
  route();
}
boot();

</script>
<script>
// عامل الخدمة يعمل فقط على الرابط المنشور، لا على الملف المحلي ولا داخل صفحة جوجل
if ('serviceWorker' in navigator && location.protocol === 'https:' && window.top === window) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // إذا نُشر تحديث للنظام لا تُعاد تحميل الصفحة في وجه المستخدم:
  // يُطبَّق بهدوء عند الانتقال لصفحة أخرى أو عند ترك التطبيق، بشرط عدم وجود نافذة مفتوحة، وبعد رفع أي تعديل لم يُحفظ
  // الأفضل عند ترك التطبيق، ولا يُطبَّق عند الانتقال بين الصفحات إلا إذا ظل التحديث منتظرًا 20 دقيقة
  let updateReady = 0;
  const idle = () => !document.querySelector('.modal-back, .drawer') && !document.activeElement?.matches('input, textarea, select');
  const applyUpdate = async onNav => {
    if (!updateReady || !idle() || (onNav === true && Date.now() - updateReady < 20 * 60000)) return;
    updateReady = 0;
    try { if (window.syncNow) await syncNow(); } catch {}
    location.reload();
  };
  navigator.serviceWorker.addEventListener('message', e => { if (e.data === 'dw-updated' && !updateReady) updateReady = Date.now(); });
  window.addEventListener('hashchange', () => applyUpdate(true));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') applyUpdate(); });
}
</script>
